name: alleys
on:
  push:
    branches: ['claude/alleys']
permissions:
  contents: write
concurrency:
  group: alleys-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Run check
        run: |
          mkdir -p out; set +e
          MIN=0 python3 build.py > out/log.txt 2>&1; echo "build $?" >> out/status.txt
          node tests/alleyshots.cjs out >> out/log.txt 2>&1; echo "alley $?" >> out/status.txt
          git fetch -q origin main && git worktree add -q ../base FETCH_HEAD && ln -s "$PWD/node_modules" ../base/node_modules && cp tests/alleyshots.cjs ../base/tests/ && (cd ../base && MIN=0 python3 build.py > /dev/null 2>&1; node tests/alleyshots.cjs "$OLDPWD/out/base" >> "$OLDPWD/out/log.txt" 2>&1); echo "base $?" >> out/status.txt
          true
      - name: Publish results to a branch
        if: always()
        run: |
          git config user.name ci; git config user.email ci@example.com
          D=$(mktemp -d); cp -r out "$D/"; git checkout -q --orphan ci-out-alleys && git rm -rqf . && cp -r "$D/out" . && git add -f out && git commit -qm "results $GITHUB_SHA" && git push -f origin HEAD:refs/heads/ci-out-alleys
