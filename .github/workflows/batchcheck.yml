name: batchcheck
on:
  push:
    branches: ['claude/walker-fixes']
  workflow_dispatch:
concurrency:
  group: batchcheck-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Build
        run: python3 build.py
      - name: Profiling copy
        run: python3 tools/perfprof.py
      - name: Site opens
        run: node tests/site.cjs
        continue-on-error: true
      - name: Start and park cost
        run: node tests/startprof.cjs out/startprof.json
        continue-on-error: true
      - name: Screenshots
        run: node tests/batchshots.cjs out/shots
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batchcheck
          path: out/
  base:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          path: new
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: cp new/tests/startprof.cjs tests/ && cp new/tools/perfprof.py tools/ && python3 build.py && python3 tools/perfprof.py
      - name: Start and park cost before
        run: node tests/startprof.cjs out/startprof-before.json
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: base
          path: out/
