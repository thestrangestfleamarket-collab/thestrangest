name: batchcheck
on:
  push:
    branches: ['claude/walker-fixes']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: batchcheck-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Build
        run: python3 build.py
      - name: Profiling copy
        run: python3 tools/perfprof.py
      - name: Site opens
        run: node tests/site.cjs
        continue-on-error: true
      - name: Start and park cost
        run: node tests/startprof.cjs out/startprof.json
        continue-on-error: true
      - name: Screenshots
        run: node tests/batchshots.cjs out/shots
        continue-on-error: true
      - name: Publish results to a branch
        if: always()
        run: |
          git config user.name ci; git config user.email ci@example.com
          mkdir -p out; D=$(mktemp -d); cp -r out "$D/"; git checkout --orphan "ci-out-$JOB" && git rm -rqf . && cp -r "$D/out" . && git add -f out && git commit -qm "results $GITHUB_SHA" && git push -f origin "HEAD:refs/heads/ci-out-$JOB"
        env:
          JOB: ${{ github.job }}
  base:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          path: new
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: cp new/tests/startprof.cjs tests/ && cp new/tools/perfprof.py tools/ && python3 build.py && python3 tools/perfprof.py
      - name: Start and park cost before
        run: node tests/startprof.cjs out/startprof-before.json
        continue-on-error: true
      - name: Publish results to a branch
        if: always()
        run: |
          git config user.name ci; git config user.email ci@example.com
          mkdir -p out; D=$(mktemp -d); cp -r out "$D/"; git checkout --orphan "ci-out-$JOB" && git rm -rqf . && cp -r "$D/out" . && git add -f out && git commit -qm "results $GITHUB_SHA" && git push -f origin "HEAD:refs/heads/ci-out-$JOB"
        env:
          JOB: ${{ github.job }}
