name: batchcheck
on:
  push:
    branches: ['claude/walker-fixes']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: batchcheck-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Build, site, profile, shots
        run: |
          mkdir -p out; set +e
          python3 build.py > out/log.txt 2>&1; echo "build $?" >> out/status.txt
          node tests/site.cjs >> out/log.txt 2>&1; echo "site $?" >> out/status.txt
          MIN=0 python3 build.py >> out/log.txt 2>&1 && python3 tools/perfprof.py >> out/log.txt 2>&1; echo "prof $?" >> out/status.txt
          node tests/startprof.cjs out/startprof.json > out/startprof.log 2>&1; echo "startprof $?" >> out/status.txt
          node tests/batchshots.cjs out/shots >> out/log.txt 2>&1; echo "shots $?" >> out/status.txt
          true
      - name: Report
        if: always()
        run: python3 tools/cireport.py out
      - name: Publish results to a branch
        if: always()
        run: |
          git config user.name ci; git config user.email ci@example.com
          D=$(mktemp -d); cp -r out "$D/"; git checkout -q --orphan "ci-out-$JOB" && git rm -rqf . && cp -r "$D/out" . && git add -f out && git commit -qm "results $GITHUB_SHA" && git push -f origin "HEAD:refs/heads/ci-out-$JOB" > push.log 2>&1 || { echo "::error title=push::$(tr '\n' ' ' < push.log | cut -c1-900)"; exit 1; }
        env:
          JOB: ${{ github.job }}
  base:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          path: new
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Profile main
        run: |
          mkdir -p out; set +e; cp new/tests/startprof.cjs tests/; cp new/tools/perfprof.py new/tools/cireport.py tools/
          MIN=0 python3 build.py > out/log.txt 2>&1 && python3 tools/perfprof.py >> out/log.txt 2>&1; echo "prof $?" >> out/status.txt
          node tests/startprof.cjs out/startprof.json > out/startprof.log 2>&1; echo "startprof $?" >> out/status.txt
          true
      - name: Report
        if: always()
        run: python3 tools/cireport.py out
