name: chunks
on:
  push:
    branches: [claude/chunks]
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Baseline (main)
        run: |
          mkdir -p out/base; git fetch -q origin main; git worktree add -q base origin/main; ln -s ../node_modules base/node_modules; cp tests/chunkmeasure.cjs tests/startcost.py base/tests/
          (cd base && python3 build.py && DIST=dist node tests/chunkmeasure.cjs sizes ../out/base && DIST=dist node tests/chunkmeasure.cjs web ../out/base && MIN=0 python3 build.py; python3 tests/startcost.py && DIST=dist node tests/chunkmeasure.cjs prof ../out/base) > out/base.log 2>&1 || true
      - name: Build minified
        run: python3 build.py && mkdir -p out && node tests/chunkmeasure.cjs sizes out
      - name: Measure website start
        run: node tests/chunkmeasure.cjs web out > out/web.log 2>&1 || true
      - name: Profile start
        if: hashFiles('QUICK') == ''
        run: (MIN=0 python3 build.py; cp dist/market.html dist/market-min0.html; python3 tests/startcost.py && node tests/chunkmeasure.cjs prof out) > out/prof.log 2>&1 || true
      - name: Early teleports
        if: hashFiles('QUICK') == ''
        run: node tests/chunkmeasure.cjs early out > out/early.log 2>&1 || true
      - name: Tour
        if: hashFiles('QUICK') == ''
        timeout-minutes: 25
        run: node tests/chunkmeasure.cjs tour out > out/tour.log 2>&1 || true
      - name: Publish
        if: always()
        run: |
          git config user.email ci@example.com; git config user.name ci
          git checkout --orphan ci-out-chunks
          git rm -rf --cached . > /dev/null
          git add -f out
          git commit -m out -q
          git push -f origin ci-out-chunks
