name: ghostflat
on:
  push:
    branches: [claude/ghost-flat]
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: MIN=0 python3 build.py > build.txt 2>&1; tail -3 build.txt
      - run: mkdir -p out; node tests/ghostflat.cjs out > out/log.txt 2>&1 || true
        continue-on-error: true
      - if: always()
        run: |
          mkdir -p out; git config user.name ci; git config user.email ci@example.com
          git checkout --orphan ci-out-ghostflat; git rm -rfq --cached . ; git add -f out; git commit -qm shots; git push -f origin ci-out-ghostflat
