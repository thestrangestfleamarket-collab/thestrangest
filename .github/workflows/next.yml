name: next
on:
  push:
    branches: ['claude/next', 'claude/next2', 'claude/next3']
permissions:
  contents: write
concurrency:
  group: next-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Run check
        run: |
          mkdir -p out; set +e
          MIN=0 python3 build.py > out/log.txt 2>&1; echo "build $?" >> out/status.txt
          node tests/nextshots.cjs out >> out/log.txt 2>&1; echo "next $?" >> out/status.txt
          node tests/runcheck.cjs out/run >> out/log.txt 2>&1; echo "run $?" >> out/status.txt
          echo "::notice title=report::$(cat out/status.txt out/report.json 2>/dev/null | tr '\n' ' ' | cut -c1-6000)"
          true
      - name: Publish results to a branch
        if: always()
        run: |
          git config user.name ci; git config user.email ci@example.com
          D=$(mktemp -d); cp -r out "$D/"; git checkout -q --orphan ci-out-next && git rm -rqf . && cp -r "$D/out" . && git add -f out && git commit -qm "results $GITHUB_SHA" && git push -f origin HEAD:refs/heads/ci-out-next
