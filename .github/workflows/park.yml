name: park
on:
  push:
    branches: ['claude/park-place']
permissions:
  contents: write
concurrency:
  group: park-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Run check
        run: |
          mkdir -p out; set +e
          MIN=0 python3 build.py > out/log.txt 2>&1; echo "build $?" >> out/status.txt
          node tests/parkplace.cjs out >> out/log.txt 2>&1; echo "park $?" >> out/status.txt
          git fetch -q origin main && git worktree add -q ../base origin/main && ln -s $GITHUB_WORKSPACE/node_modules ../base/node_modules && (cd ../base && MIN=0 python3 build.py > /dev/null 2>&1); ls -la ../base/dist/market.html >> out/log.txt
          node tests/parkstart.cjs out ../base/dist/market.html dist/market.html >> out/log.txt 2>&1; echo "start $?" >> out/status.txt
          true
      - name: Publish results to a branch
        if: always()
        run: |
          git config user.name ci; git config user.email ci@example.com
          D=$(mktemp -d); cp -r out "$D/"; git checkout -q --orphan ci-out-park && git rm -rqf . && cp -r "$D/out" . && git add -f out && git commit -qm "results $GITHUB_SHA" && git push -f origin HEAD:refs/heads/ci-out-park
