name: shadow
on:
  push:
    branches: ['claude/shadow-stable']
permissions:
  contents: write
concurrency:
  group: shadow-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Run check
        run: |
          mkdir -p out; set +e
          MIN=0 python3 build.py > out/log.txt 2>&1; echo "build $?" >> out/status.txt
          node tests/shadowwalk.cjs out >> out/log.txt 2>&1; echo "shadow $?" >> out/status.txt
          git fetch -q origin +refs/heads/main:refs/remotes/origin/main && git worktree add base origin/main && ln -s $PWD/node_modules base/node_modules && cp tests/shadowwalk.cjs base/tests/ && (cd base && MIN=0 python3 build.py > ../out/logbase.txt 2>&1) && mkdir -p out/base && node base/tests/shadowwalk.cjs out/base >> out/logbase.txt 2>&1; echo "base $?" >> out/status.txt
          echo "::notice title=report::$(cat out/status.txt 2>/dev/null | tr '\n' ' ' | cut -c1-2000)"
          true
      - name: Publish results to a branch
        if: always()
        run: |
          git config user.name ci; git config user.email ci@example.com
          D=$(mktemp -d); cp -r out "$D/"; git checkout -q --orphan ci-out-shadow && git rm -rqf . && cp -r "$D/out" . && git add -f out && git commit -qm "results $GITHUB_SHA" && git push -f origin HEAD:refs/heads/ci-out-shadow
