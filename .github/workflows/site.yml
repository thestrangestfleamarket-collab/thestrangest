name: site
on:
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:
    inputs:
      measure:
        description: 'Also run the measuring checks (budget, same picture, same pixels)'
        type: boolean
        default: false
      full:
        description: 'Run every check, not only those for the files changed'
        type: boolean
        default: false
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        name: Which checks the changed files call for (all with the full label or box)
        env:
          FULL: ${{ (github.event_name == 'workflow_dispatch' && inputs.full) || contains(github.event.pull_request.labels.*.name, 'full') }}
          BASE: ${{ github.base_ref || 'main' }}
        run: |
          C=$(git diff --name-only "origin/$BASE"...HEAD 2>/dev/null || echo ALL)
          R=""; k(){ if [ "$FULL" = "true" ] || [ "$C" = "ALL" ] || echo "$C" | grep -Eq "$2"; then R="$R $1"; fi; }
          k lawn    'src/14[0-2]|lawn'
          k grass   'src/014a|src/14[0-4]|src/064|grasskinds'
          k online  'src/111d|worker/|online'
          k brawl   'src/146h|src/146a|src/103|brawl'
          k vr      'src/162[a-c]|vr\.cjs'
          k bedroom 'src/150[a-c]|src/059a|bedroom'
          k roomedit 'src/150[c-e]|src/150cz|src/059a|roomedit'
          k editors 'src/09[4-9]|src/13[34]|src/141d|src/136|editors'
          k fishing 'src/142-|src/066|src/141f|fishing'
          k water   'src/065a|src/066-|src/060a|src/089a|src/141f|water'
          k guardians 'src/146[i-k]|src/089b|src/062-|guardians'
          echo "run=$R" >> "$GITHUB_OUTPUT"; echo "extra checks:$R"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - id: pw
        run: echo "v=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pwcache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.v }}
      - run: npx playwright install --with-deps chromium
        if: steps.pwcache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: steps.pwcache.outputs.cache-hit == 'true'
      - name: Build
        run: python3 build.py
      - name: The core's own logic (imports, level file, SYS, ZONES, VIS, FADE, collision)
        run: node tests/core.cjs dist/market.html
      - name: The lawn (knee-high tufts, painted ground)
        if: contains(steps.f.outputs.run, ' lawn')
        run: node tests/lawn.cjs dist/market.html
      - name: The grass kinds (their looks, flowers, mushrooms, butterflies)
        if: contains(steps.f.outputs.run, ' grass')
        run: node tests/grasskinds.cjs dist/market.html
      - name: The other players (bodies, name tags, the list, chat)
        if: contains(steps.f.outputs.run, ' online')
        run: node tests/online.cjs dist/market.html
      - name: Fights between players (hitboxes, blows, knockdown)
        if: contains(steps.f.outputs.run, ' brawl')
        run: node tests/brawl.cjs dist/market.html
      - name: The headset (VR on an emulated Quest 3)
        if: contains(steps.f.outputs.run, ' vr')
        run: node tests/vr.cjs dist/market.html
      - name: Your bedroom (the owner's picture, real bodies, iso walls)
        if: contains(steps.f.outputs.run, ' bedroom')
        run: node tests/bedroom.cjs dist/market.html
      - name: The room editor (decorate your apartment, saved and back after a reload)
        if: contains(steps.f.outputs.run, ' roomedit')
        run: node tests/roomedit.cjs dist/market.html
      - name: Check the site opens (door, then THE MARKET)
        run: node tests/site.cjs
      - name: Every place's code comes when you go there
        run: node tests/places.cjs out
      - name: Fishing on the Hudson's pier (the pier, the rod, a bite, the fight)
        if: contains(steps.f.outputs.run, ' fishing')
        run: node tests/fishing.cjs dist/market.html
      - name: One water and its fish (the shared simulation, still water still, the fish, the deep)
        if: contains(steps.f.outputs.run, ' water')
        run: node tests/water.cjs dist/market.html
      - name: The castle's guardians, their places and a breakout
        if: contains(steps.f.outputs.run, ' guardians')
        run: mkdir -p out && node tests/guardians.cjs dist/market.html out
      - name: Every editor opens and its controls work
        if: contains(steps.f.outputs.run, ' editors')
        run: node tests/editors.cjs dist/market.html
      - name: The page's errors, when it did not open
        if: failure()
        run: MIN=0 python3 build.py && node tests/pageerr.cjs dist/market.html
  game:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.c.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: c
        name: Measure only when asked (the measure label on the pull request, or the measure box when started by hand)
        env:
          ASKED: ${{ (github.event_name == 'workflow_dispatch' && inputs.measure) || contains(github.event.pull_request.labels.*.name, 'measure') }}
        run: |
          if [ "$ASKED" = "true" ]; then T='["budget","samepic","texhash"]'; else T='[]'; fi; echo "tests=$T" >> "$GITHUB_OUTPUT"; echo "$T"
  check:
    needs: game
    if: needs.game.outputs.tests != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.game.outputs.tests) }}
    name: ${{ matrix.test }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - id: pw
        run: echo "v=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pwcache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.v }}
      - run: npx playwright install --with-deps chromium
        if: steps.pwcache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: steps.pwcache.outputs.cache-hit == 'true'
      - name: Build the base and this pull request (readable)
        run: |
          git fetch --depth=1 origin ${{ github.base_ref || 'main' }}
          git worktree add ../base FETCH_HEAD
          ln -s "$PWD/node_modules" ../base/node_modules
          P="${{ matrix.test == 'budget' && 'python3 tools/perfprof.py' || 'true' }}"
          (cd ../base && MIN=0 python3 build.py && $P)
          MIN=0 python3 build.py && $P
          mkdir -p out
      - name: Measure both and compare against the budget (start, park)
        if: matrix.test == 'budget'
        run: |
          set -o pipefail
          node tests/startprof.cjs out/base.json ../base/dist/market-prof.html 2>&1 | tee out/startprof-base.log
          node tests/startprof.cjs out/head.json dist/market-prof.html 2>&1 | tee out/startprof-head.log
          node tests/budget.cjs out/base.json out/head.json | tee out/budget.log
      - name: The lost picture comes back
        if: matrix.test == 'budget' && (success() || failure())
        run: set -o pipefail; node tests/ctxloss.cjs dist/market.html | tee out/ctxloss.log
      - name: The same picture (street, dungeon, castle, bodega, diner, bar)
        if: matrix.test == 'samepic'
        run: set -o pipefail; node tests/samepic.cjs ../base/dist/market.html dist/market.html out/samepic | tee out/samepic.log
      - name: The same pixels in every painted texture
        if: matrix.test == 'texhash'
        run: set -o pipefail; node tests/texhash.cjs ../base/dist/market.html dist/market.html | tee out/texhash.log
      - name: Results as annotations (for sessions that can't download logs)
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          for f in sorted(glob.glob('out/*.log')):
              t = '\n'.join(l for l in open(f).read().split('\n') if not l.startswith('::'))[-6000:].replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print('::notice title=' + f + '::' + t)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out-${{ matrix.test }}
          path: out/
