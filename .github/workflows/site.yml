name: site
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Build
        run: python3 build.py
      - name: Check the site opens (door, then THE MARKET)
        run: node tests/site.cjs
  budget:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Build the base and this pull request (readable, with the profiling copy)
        run: |
          git fetch --depth=1 origin ${{ github.base_ref }}
          git worktree add ../base FETCH_HEAD
          ln -s "$PWD/node_modules" ../base/node_modules
          (cd ../base && MIN=0 python3 build.py && python3 tools/perfprof.py)
          MIN=0 python3 build.py && python3 tools/perfprof.py
      - name: Measure both (start, street, park)
        run: |
          node tests/startprof.cjs out/base.json ../base/dist/market-prof.html
          node tests/startprof.cjs out/head.json dist/market-prof.html
      - name: Compare against the budget
        run: set -o pipefail; node tests/budget.cjs out/base.json out/head.json | tee out/budget.log
      - name: The lost picture comes back
        if: success() || failure()
        run: set -o pipefail; node tests/ctxloss.cjs dist/market.html | tee out/ctxloss.log
      - name: The same picture (street, dungeon, castle, bodega, diner, bar)
        if: success() || failure()
        run: set -o pipefail; node tests/samepic.cjs ../base/dist/market.html dist/market.html out/samepic | tee out/samepic.log
      - name: The same pixels in every painted texture
        if: success() || failure()
        run: set -o pipefail; node tests/texhash.cjs ../base/dist/market.html dist/market.html | tee out/texhash.log
      - name: Results as annotations (for sessions that can't download logs)
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          for f in sorted(glob.glob('out/*.log')):
              t = '\n'.join(l for l in open(f).read().split('\n') if not l.startswith('::'))[-6000:].replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print('::notice title=' + f + '::' + t)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: budget-pictures
          path: out/
