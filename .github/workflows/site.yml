name: site
on:
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:
    inputs:
      measure:
        description: 'Also run the measuring checks (budget, same picture, same pixels)'
        type: boolean
        default: false
      full:
        description: 'Run every check, not only those for the files changed'
        type: boolean
        default: false
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-check:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        name: Which checks the changed files call for (all with the full label or box)
        env:
          FULL: ${{ (github.event_name == 'workflow_dispatch' && inputs.full) || contains(github.event.pull_request.labels.*.name, 'full') }}
          BASE: ${{ github.base_ref || 'main' }}
        run: |
          C=$(for f in $(git diff --name-only "origin/$BASE"...HEAD 2>/dev/null || echo ALL); do [ "$f" = ALL ] && { echo ALL; break; }; case "$f" in src/*.js) git diff -U0 "origin/$BASE"...HEAD -- "$f" | grep -E '^[-+][^-+]' | grep -vqE "^[-+](import \{[^}]*\} from '\./[^']+';|export \{[^}]*\};) *$" && echo "$f";; *) echo "$f";; esac; done)
          R=""; k(){ if [ "$FULL" = "true" ] || [ "$C" = "ALL" ] || echo "$C" | grep -Eq "$2"; then R="$R $1"; fi; }
          k lawn    'src/14[0-2]|lawn'
          k grass   'src/014a|src/14[0-4]|src/064|grasskinds'
          k online  'src/111d|worker/|online'
          k brawl   'src/146h|src/146a|src/103|brawl'
          k physx   'src/090|src/150-loose|src/150o|physx'
          k vr      'src/162[a-c]|vr\.cjs'
          k catrun  'src/146bb|src/059b-arcade|src/162[a-c]|src/141-forage|catrun\.cjs'
          k riders  'src/117a|src/009c|riders\.cjs'
          k bins    'src/144d|src/111d|src/009-down|worker/|bins\.cjs'
          k loopmap 'src/159c|src/009b|loopmap\.cjs'
          k passport 'src/159d|passport\.cjs'
          k summon  'src/076b|src/162b|summon\.cjs'
          k scanner 'src/159e|src/146-|scanner\.cjs'
          k spray   'src/159f|src/146-|spray\.cjs'
          k bodega80 'src/039-bodega|src/016-street-kit|bodega80s\.cjs'
          k bedroom 'src/150[a-c]|src/150ea|src/059a|bedroom'
          k roomedit 'src/150[c-e]|src/150cz|src/059a|roomedit'
          k editors 'src/09[4-9]|src/13[34]|src/140b|src/136|editors'
          k fishing 'src/142-|src/142b|src/066|src/141f|fishing'
          k guide   'src/136d|src/094|data/guide|guide'
          k bank    'src/059h|src/059-store|src/161-perf|bank'
          k art     'src/059p-art|data/art|art\.cjs'
          k cars    'src/150p-cars|src/150o-physmore|src/146i-ride|data/cars|data/radio|worker/|cars\.cjs|radio\.cjs'
          k water   'src/065a|src/066-|src/060a|src/089a|src/141f|water'
          k scores  'src/059g|arcade-scores'
          k arcade  'src/059[b,g-o]|arcade-torch|arcade-petri'
          k bbs     'src/146-drone|src/059a|bbs\.cjs'
          k lives   'src/158|src/159-jobs|src/159d|worker/lives|data/lives|lives\.cjs'
          k insides 'src/059-store|src/059-street|src/059h|src/059p|src/008-batch|insides\.cjs'
          k playhouse 'src/151[a-z]|src/059-street|playhouse'
          k handheld 'src/146ya-handheld|src/146y-operator|src/146-drone|src/094|src/162b|handheld\.cjs'
          k train   'src/009b|src/009c|src/066c|src/159c|loop\.cjs'
          k hall    'src/150n|src/059a|hall\.cjs'
          k holodeck 'src/059b-arcade|src/146bb|src/146bc|holodeck'
          k kite    'src/146g-kite|src/093|kite\.cjs'
          k swim    'src/146g-swim|src/066-river|src/065a|swim\.cjs'
          k visit   'src/150d|src/146z|src/059a|src/111d|visit\.cjs'
          k westst  'src/023|src/059-|src/059[e-h]|westst'
          k zones   'src/129a|src/066-river|src/065a|zones\.cjs'
          k bees    'src/147a|bees\.cjs'
          k wild    'src/087-npc-creatures|src/144[f-h]|src/076-npc-map|wild\.cjs'
          k cast    'src/111a|src/111f[bc]|src/159-jobs|src/059i|data/cast/|data/characters|data/merchant|flea\.cjs|jobsim|merchant\.cjs'
          echo "run=$R" >> "$GITHUB_OUTPUT"; echo "extra checks:$R"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - id: pw
        run: echo "v=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pwcache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.v }}
      - run: npx playwright install --with-deps chromium
        if: steps.pwcache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: steps.pwcache.outputs.cache-hit == 'true'
      - name: Build
        run: python3 build.py
      - name: The core's own logic (imports, level file, SYS, ZONES, VIS, FADE, collision)
        run: node tests/core.cjs dist/market.html
      - name: The lawn (knee-high tufts, painted ground)
        if: contains(steps.f.outputs.run, ' lawn')
        run: node tests/lawn.cjs dist/market.html
      - name: The grass kinds (their looks, flowers, mushrooms, butterflies)
        if: contains(steps.f.outputs.run, ' grass')
        run: node tests/grasskinds.cjs dist/market.html
      - name: The townspeople's lives (homes, days, records)
        if: contains(steps.f.outputs.run, ' lives')
        run: node tests/lives.cjs dist/market.html
      - name: The other players (bodies, name tags, the list, chat)
        if: contains(steps.f.outputs.run, ' online')
        run: node tests/online.cjs dist/market.html
      - name: Fights between players (hitboxes, blows, knockdown)
        if: contains(steps.f.outputs.run, ' brawl')
        run: node tests/brawl.cjs dist/market.html
      - name: The physics extras (shapes, stepping up, ragdolls, the go-kart)
        if: contains(steps.f.outputs.run, ' physx')
        run: node tests/physx.cjs dist/market.html
      - name: The headset (VR on an emulated Quest 3)
        if: contains(steps.f.outputs.run, ' vr')
        run: node tests/vr.cjs dist/market.html
      - name: THE CATACOMB RUN (the start, the lessons, every control on the keyboard and in the headset)
        if: contains(steps.f.outputs.run, ' catrun')
        run: node tests/catrun.cjs dist/market.html
      - name: riders
        if: contains(steps.f.outputs.run, ' riders')
        run: node tests/riders.cjs dist/market.html
      - name: bins
        if: contains(steps.f.outputs.run, ' bins')
        run: node tests/bins.cjs dist/market.html
      - name: loopmap
        if: contains(steps.f.outputs.run, ' loopmap')
        run: node tests/loopmap.cjs dist/market.html
      - name: passport
        if: contains(steps.f.outputs.run, ' passport')
        run: node tests/passport.cjs dist/market.html
      - name: The cast (the flea market, a day at work, the playable Merchant)
        if: contains(steps.f.outputs.run, ' cast')
        run: node tests/flea.cjs && node tests/merchant.cjs && node tests/jobsim.cjs
      - name: Summoning a character (the owner's ADMIN window)
        if: contains(steps.f.outputs.run, ' summon')
        run: node tests/summon.cjs dist/market.html
      - name: scanner
        if: contains(steps.f.outputs.run, ' scanner')
        run: node tests/scanner.cjs dist/market.html
      - name: spray
        if: contains(steps.f.outputs.run, ' spray')
        run: node tests/spray.cjs dist/market.html
      - name: bodega80
        if: contains(steps.f.outputs.run, ' bodega80')
        run: node tests/bodega80s.cjs dist/market.html
      - name: Your bedroom (the owner's picture, real bodies, iso walls)
        if: contains(steps.f.outputs.run, ' bedroom')
        run: node tests/bedroom.cjs dist/market.html
      - name: The room editor (decorate your apartment, saved and back after a reload)
        if: contains(steps.f.outputs.run, ' roomedit')
        run: node tests/roomedit.cjs dist/market.html
      - name: The shops' insides (built on the way in, dropped on the way out, nothing left behind)
        if: contains(steps.f.outputs.run, ' insides')
        run: node tests/insides.cjs dist/market.html
      - name: The computer's BBS (dial-in, order, drone delivery, drone view)
        if: contains(steps.f.outputs.run, ' bbs')
        run: node tests/bbs.cjs dist/market.html
      - name: The handheld (ESC pops it up, its icons open the menus)
        if: contains(steps.f.outputs.run, ' handheld')
        run: node tests/handheld.cjs dist/market.html
      - name: The loop (two trains shuttle from A, you ride one out and back)
        if: contains(steps.f.outputs.run, ' train')
        run: node tests/loop.cjs dist/market.html
      - name: Your hall (the elevator, the stairs, the roof)
        if: contains(steps.f.outputs.run, ' hall')
        run: node tests/hall.cjs
      - name: The holodeck (its panel, the adventures menu)
        if: contains(steps.f.outputs.run, ' holodeck')
        run: node tests/holodeck.cjs dist/market.html
      - name: The kite (held, launched, climbing in the wind)
        if: contains(steps.f.outputs.run, ' kite')
        run: node tests/kite.cjs dist/market.html
      - name: Swimming in the Hudson (down, up, the depths, the tunnel)
        if: contains(steps.f.outputs.run, ' swim')
        run: node tests/swim.cjs dist/market.html
      - name: Visiting another player's apartment
        if: contains(steps.f.outputs.run, ' visit')
        run: node tests/visit.cjs dist/market.html
      - name: West St faces its street (every door and way out)
        if: contains(steps.f.outputs.run, ' westst')
        run: node tests/westst.cjs
      - name: The Hudson loads when you go in
        if: contains(steps.f.outputs.run, ' zones')
        run: node tests/zones.cjs
      - name: The bees (the Beekeeper, hives on the lawn, honey)
        if: contains(steps.f.outputs.run, ' bees')
        run: node tests/bees.cjs dist/market.html
      - name: The park's creatures (real sizes, how each lives, the wildlife journal)
        if: contains(steps.f.outputs.run, ' wild')
        run: node tests/wild.cjs
      - name: Check the site opens (door, then THE MARKET)
        run: node tests/site.cjs
      - name: Every place's code comes when you go there
        run: node tests/places.cjs out
      - name: Fishing on the Hudson's pier (the pier, the rod, a bite, the fight)
        if: contains(steps.f.outputs.run, ' fishing')
        run: node tests/fishing.cjs dist/market.html
      - name: The bank (its door, the hoard, the dragon waking)
        if: contains(steps.f.outputs.run, ' bank')
        run: node tests/bank.cjs dist/market.html
      - name: The playhouse (its hall, the cloth curtain, the bars, the show at a moment)
        if: contains(steps.f.outputs.run, ' playhouse')
        run: node tests/playhouse.cjs
      - name: The art museum (the lot, the paintings hung when you go in, the plaques, out again)
        if: contains(steps.f.outputs.run, ' art')
        run: node tests/art.cjs dist/market.html
      - name: The cars (parked on Market St, get in, drive, get out, someone else's car)
        if: contains(steps.f.outputs.run, ' cars')
        run: node tests/cars.cjs dist/market.html
      - name: The car radio (tune, the shared moment, off when you get out, heard near someone else's car)
        if: contains(steps.f.outputs.run, ' cars')
        run: node tests/radio.cjs dist/market.html
      - name: The cars' server (one driver a car, parking kept and heard)
        if: contains(steps.f.outputs.run, ' cars')
        run: node tests/cars-server.cjs
      - name: The guide book (Shift+G, every chapter's steps and pictures)
        if: contains(steps.f.outputs.run, ' guide')
        run: node tests/guide.cjs dist/market.html
      - name: One water and its fish (the shared simulation, still water still, the fish, the deep)
        if: contains(steps.f.outputs.run, ' water')
        run: node tests/water.cjs dist/market.html
      - name: Every editor opens and its controls work
        if: contains(steps.f.outputs.run, ' editors')
        run: node tests/editors.cjs dist/market.html
      - name: The arcade's high-score table (a run that makes the top ten, the initials, the table)
        if: contains(steps.f.outputs.run, ' scores')
        run: node tests/arcade-scores.cjs dist/market.html
      - name: TORCHBEARER (the dungeon, floor by floor) and PETRI (the dish)
        if: contains(steps.f.outputs.run, ' arcade')
        run: node tests/arcade-torch.cjs dist/market.html && node tests/arcade-petri.cjs dist/market.html
      - name: The page's errors, when it did not open
        if: failure()
        run: MIN=0 python3 build.py && node tests/pageerr.cjs dist/market.html
  game:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.c.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: c
        name: Measure only when asked (the measure label on the pull request, or the measure box when started by hand)
        env:
          ASKED: ${{ (github.event_name == 'workflow_dispatch' && inputs.measure) || contains(github.event.pull_request.labels.*.name, 'measure') }}
        run: |
          if [ "$ASKED" = "true" ]; then T='["budget","samepic","texhash"]'; else T='[]'; fi; echo "tests=$T" >> "$GITHUB_OUTPUT"; echo "$T"
  check:
    needs: game
    if: needs.game.outputs.tests != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.game.outputs.tests) }}
    name: ${{ matrix.test }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - id: pw
        run: echo "v=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pwcache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.v }}
      - run: npx playwright install --with-deps chromium
        if: steps.pwcache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: steps.pwcache.outputs.cache-hit == 'true'
      - name: Build the base and this pull request (readable)
        run: |
          git fetch --depth=1 origin ${{ github.base_ref || 'main' }}
          git worktree add ../base FETCH_HEAD
          ln -s "$PWD/node_modules" ../base/node_modules
          P="${{ matrix.test == 'budget' && 'python3 tools/perfprof.py' || 'true' }}"
          (cd ../base && MIN=0 python3 build.py && $P)
          MIN=0 python3 build.py && $P
          mkdir -p out
      - name: Measure both and compare against the budget (start, park)
        if: matrix.test == 'budget'
        run: |
          set -o pipefail
          node tests/startprof.cjs out/base.json ../base/dist/market-prof.html 2>&1 | tee out/startprof-base.log
          node tests/startprof.cjs out/head.json dist/market-prof.html 2>&1 | tee out/startprof-head.log
          node tests/budget.cjs out/base.json out/head.json | tee out/budget.log
      - name: The lost picture comes back
        if: matrix.test == 'budget' && (success() || failure())
        run: set -o pipefail; node tests/ctxloss.cjs dist/market.html | tee out/ctxloss.log
      - name: The same picture (street, dungeon, castle, bodega, diner, bar)
        if: matrix.test == 'samepic'
        run: set -o pipefail; node tests/samepic.cjs ../base/dist/market.html dist/market.html out/samepic | tee out/samepic.log
      - name: The same pixels in every painted texture
        if: matrix.test == 'texhash'
        run: set -o pipefail; node tests/texhash.cjs ../base/dist/market.html dist/market.html | tee out/texhash.log
      - name: Results as annotations (for sessions that can't download logs)
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          for f in sorted(glob.glob('out/*.log')):
              t = '\n'.join(l for l in open(f).read().split('\n') if not l.startswith('::'))[-6000:].replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print('::notice title=' + f + '::' + t)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out-${{ matrix.test }}
          path: out/
