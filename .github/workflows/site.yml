name: site
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, labeled]
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:
    inputs:
      measure:
        description: 'Also run the measuring checks (budget, same picture, same pixels)'
        type: boolean
        default: false
      full:
        description: 'Run every check, not only those for the files changed'
        type: boolean
        default: false
jobs:
  # runs only when it is worth it (owner, 7 Nov 2026): never on a draft; on a push only when it is new work, not a merge of main; on a label only for go, full or measure
  # (judged in the jobs' own if, with no machine; only a push starts one, to see whether it is a merge)
  gate:
    if: github.event_name == 'pull_request' && github.event.action == 'synchronize' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          n=$(gh api "repos/${{ github.repository }}/commits/$SHA" --jq '.parents|length' || echo 1); go=true; [ "$n" -gt 1 ] && go=false
          echo "go=$go" >> "$GITHUB_OUTPUT"; echo "go=$go"
  build-check:
    needs: gate
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || (!github.event.pull_request.draft && ((github.event.action == 'synchronize' && needs.gate.outputs.go == 'true') || (github.event.action == 'labeled' && contains(fromJSON('["go","full","measure"]'), github.event.label.name)) || contains(fromJSON('["opened","reopened","ready_for_review"]'), github.event.action)))) }}
    concurrency:
      group: site-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: ${{ ((github.event_name == 'workflow_dispatch' && inputs.full) || contains(github.event.pull_request.labels.*.name, 'full')) && 300 || 150 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        name: Which checks the changed files call for (all with the full label or box)
        env:
          FULL: ${{ (github.event_name == 'workflow_dispatch' && inputs.full) || contains(github.event.pull_request.labels.*.name, 'full') }}
          BASE: ${{ github.base_ref || 'main' }}
        run: |
          C=$(for f in $(git diff --name-only "origin/$BASE"...HEAD 2>/dev/null || echo ALL); do [ "$f" = ALL ] && { echo ALL; break; }; case "$f" in src/*.js) git diff -U0 "origin/$BASE"...HEAD -- "$f" | grep -E '^[-+][^-+]' | grep -vqE "^[-+](import \{[^}]*\} from '\./[^']+';|export \{[^}]*\};) *$" && echo "$f";; *) echo "$f";; esac; done)
          R=""; k(){ if [ "$FULL" = "true" ] || [ "$C" = "ALL" ] || echo "$C" | grep -Eq "$2"; then R="$R $1"; fi; }
          k grass   'src/014a|src/140-weeds|src/140a-tufts|src/141-forage|src/142a-flora|src/143-bfly|src/064|grasskinds'
          k online  'src/111d-online|worker/|online'
