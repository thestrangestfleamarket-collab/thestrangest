name: split
on:
  push:
    branches: [claude/code-split]
permissions:
  contents: write
jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: python3 build.py 2>&1 | tee out-build.log
      - run: node tests/site.cjs 2>&1 | tee out-site.log
        continue-on-error: true
      - run: node tests/places.cjs out 2>&1 | tee out-places.log
        continue-on-error: true
      - if: always()
        run: |
          mkdir -p out; cp out-*.log dist/chunks.txt out/ || true
          git config user.email ci@example.com; git config user.name ci
          git checkout --orphan ci-out-split; git rm -rf --cached . >/dev/null; git add -f out; git commit -m out >/dev/null; git push -f origin ci-out-split
  same:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: |
          git fetch --depth=1 origin main
          git worktree add ../base FETCH_HEAD
          ln -s "$PWD/node_modules" ../base/node_modules
          (cd ../base && MIN=0 python3 build.py)
          MIN=0 python3 build.py
          mkdir -p out
      - run: node tests/samepic.cjs ../base/dist/market.html dist/market.html out/samepic 2>&1 | tee out/samepic.log
        continue-on-error: true
      - run: node tests/texhash.cjs ../base/dist/market.html dist/market.html 2>&1 | tee out/texhash.log
        continue-on-error: true
      - if: always()
        run: |
          git config user.email ci@example.com; git config user.name ci
          git checkout --orphan ci-out-split2; git rm -rf --cached . >/dev/null; git add -f out; git commit -m out >/dev/null; git push -f origin ci-out-split2
