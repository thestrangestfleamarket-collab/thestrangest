name: split
on:
  push:
    branches: [claude/code-split]
permissions:
  contents: write
jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Build
        run: MIN=0 python3 build.py
      - name: Base
        run: |
          git fetch --depth=1 origin main
          git worktree add ../base FETCH_HEAD
          ln -s "$PWD/node_modules" ../base/node_modules
          (cd ../base && MIN=0 python3 build.py)
      - name: Compare places
        run: node tests/arcadecmp.cjs 2>&1 | tee out-cmp.log
        continue-on-error: true
      - name: Publish
        if: always()
        run: |
          mkdir -p out; cp out-*.log out-*.patch dist/chunks.txt out/ || true
          ls -la dist/g > out/dist-g.txt; ls -la ../base/dist/g > out/base-g.txt || true
          git config user.email ci@example.com; git config user.name ci
          git checkout --orphan ci-out-split; git rm -rf --cached . >/dev/null; git add -f out; git commit -m out >/dev/null; git push -f origin ci-out-split
