name: split
on:
  push:
    branches: [claude/code-split]
permissions:
  contents: write
jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Build readable (later chunk kept inline, for coverage)
        run: SKIP=later MIN=0 python3 build.py
      - name: Start coverage (readable artifact)
        run: COV=1 node tests/splitcheck.cjs file . out/cov-file.json ""
        continue-on-error: true
      - name: Build
        run: python3 build.py 2>&1 | tee out-build.log
      - name: Site check
        run: node tests/site.cjs 2>&1 | tee out-site.log
        continue-on-error: true
      - name: Head on the website
        run: node tests/splitcheck.cjs site . out/head-site.json "$(cat tests/.tour 2>/dev/null)"
        continue-on-error: true
      - name: Head as the artifact
        run: node tests/splitcheck.cjs file . out/head-file.json "$(cat tests/.tour 2>/dev/null)"
        continue-on-error: true
      - name: Places on the website
        run: node tests/places.cjs out 2>&1 | tee out-places.log
        continue-on-error: true
      - name: Base
        run: |
          git fetch --depth=1 origin main
          git worktree add ../base FETCH_HEAD
          ln -s "$PWD/node_modules" ../base/node_modules
          (cd ../base && python3 build.py)
          node tests/splitcheck.cjs site ../base out/base-site.json ""
        continue-on-error: true
      - name: Publish
        if: always()
        run: |
          mkdir -p out; cp out-*.log out/ || true
          ls -la dist/g > out/dist-g.txt; ls -la ../base/dist/g > out/base-g.txt || true
          git config user.email ci@example.com; git config user.name ci
          git checkout --orphan ci-out-split; git rm -rf --cached . >/dev/null; git add -f out; git commit -m out >/dev/null; git push -f origin ci-out-split
