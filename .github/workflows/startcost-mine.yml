name: startcost-mine
on:
  push:
    branches: [claude/startcost-mine]
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Profile the start (readable build)
        run: |
          mkdir -p out
          MIN=0 python3 build.py
          node tests/cpuprof.cjs out/cpu > out/cpu.log 2>&1 || true
          node tests/cpuprof.cjs out/cpu2 > out/cpu2.log 2>&1 || true
      - name: Publish
        if: always()
        run: |
          git config user.email ci@example.com; git config user.name ci
          git checkout --orphan ci-out-startcost-mine
          git rm -rf --cached . > /dev/null
          git add -f out
          git commit -m out -q
          git push -f origin ci-out-startcost-mine
