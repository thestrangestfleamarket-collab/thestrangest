<!doctype html><html lang="en"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><meta name="market-build" content="__BUILDV__"><title>Map Editor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap">
<style>
:root{--bg:#0b0d12;--panel:#151821;--line:#2a2f3c;--ink:#ece5d3;--dim:#8a8f9c;--acc:#f2c14e;--ok:#6fbf73;--bad:#e06a5a}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:12px/1.4 Silkscreen,ui-monospace,Menlo,monospace}
button,input,select{font:inherit}
.app{display:grid;grid-template-columns:62px 1fr 290px;grid-template-rows:44px 1fr 26px;height:100vh}
header{grid-column:1/4;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
header b{color:var(--acc);letter-spacing:.06em}header .btn{padding:5px 7px}.sp{flex:1}
.btn{background:#1e222d;color:var(--ink);border:1px solid var(--line);padding:5px 9px;border-radius:4px;cursor:pointer}
.seg{display:inline-flex}.seg .btn{border-radius:0}.seg .btn:first-child{border-radius:4px 0 0 4px}.seg .btn:last-child{border-radius:0 4px 4px 0;border-left:0}
.btn:hover{border-color:var(--acc)}.btn:disabled{opacity:.4;cursor:default}.btn.on{border-color:var(--acc);color:var(--acc)}.btn.pub{background:#3a2a10;border-color:var(--acc);color:var(--acc)}
nav{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:6px;overflow:auto}
nav button{width:50px;min-height:46px;border:1px solid var(--line);background:#1b1f29;color:var(--ink);border-radius:5px;cursor:pointer;font-size:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:3px 0}
nav button span{font-size:17px}nav button.on{border-color:var(--acc);background:#2a2412;color:var(--acc)}nav button.next{opacity:.35;cursor:default}
main{position:relative;overflow:hidden;background:#07090d}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.pal{position:absolute;left:8px;top:8px;background:rgba(21,24,33,.95);border:1px solid var(--line);border-radius:6px;padding:8px;max-width:min(440px,calc(100% - 16px))}
.pal h4{margin:0 0 6px;color:var(--acc);font-size:11px;font-weight:normal}.pal .opts{display:flex;flex-wrap:wrap;gap:4px}.pal .list{max-height:190px;overflow:auto;margin-top:6px}.pal p{margin:6px 0 0;color:var(--dim);font-size:10px}
.sw{display:inline-block;width:10px;height:10px;border:1px solid #0006;vertical-align:-1px;margin-right:4px}
aside{background:var(--panel);border-left:1px solid var(--line);padding:10px;overflow:auto}
aside h3{margin:0 0 8px;font-size:11px;color:var(--acc);font-weight:normal}
.row{display:grid;grid-template-columns:78px 1fr;gap:6px;align-items:center;margin:4px 0}.row label{color:var(--dim)}
.row input,.row select{width:100%;background:#0f1218;color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:3px 5px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:4px}
hr{border:0;border-top:1px solid var(--line);margin:10px 0}
.lay label{display:flex;gap:6px;align-items:center;margin:2px 0;cursor:pointer}
.note{color:var(--dim);font-size:10px}.warn{color:var(--bad)}.good{color:var(--ok)}
footer{grid-column:1/4;display:flex;gap:14px;align-items:center;padding:0 10px;background:var(--panel);border-top:1px solid var(--line);color:var(--dim);font-size:10px;overflow:hidden;white-space:nowrap}
#msg{color:var(--acc)}
@media (max-width:800px){.app{grid-template-columns:56px 1fr;grid-template-rows:44px 1fr minmax(0,40vh) 26px}aside{grid-column:1/3;border-left:0;border-top:1px solid var(--line)}header,footer{grid-column:1/3}}
</style></head><body>
<div class="app">
<header><b>MAP EDITOR</b><span class="note" id="sec"></span><span class="seg"><button class="btn" id="lvUp" title="Page Up">STREET</button><button class="btn" id="lvDown" title="Page Down">UNDERGROUND</button></span><span class="seg"><button class="btn" id="vTop" title="V">TOP</button><button class="btn" id="vIso" title="V">ISO</button></span><button class="btn" id="rotL" title="turn the view (Q)">⟲</button><button class="btn" id="rotR" title="turn the view (E)">⟳</button><span class="sp"></span>
 <button class="btn" id="undo" title="Ctrl+Z">↶ UNDO</button><button class="btn" id="redo" title="Ctrl+Y">↷ REDO</button><button class="btn" id="fit" title="the whole map">FIT</button>
 <button class="btn" id="look" title="open the game at this spot (it shows what is live)">LOOK IN 3D</button>
 <button class="btn pub" id="pub">PUBLISH LIVE</button></header>
<nav id="tools"></nav>
<main><canvas id="cv"></canvas><div class="pal" id="pal"></div></main>
<aside><h3 id="selT">PICKED</h3><div id="sel" class="note">Click a building, a park place, a path, a car or a stall to pick it.</div>
 <hr><h3>SHOW</h3><div class="lay" id="lay"></div>
 <hr><h3>THIS DRAFT</h3><div id="draft" class="note"></div>
 <div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:8px"><button class="btn" id="exp">EXPORT</button><button class="btn" id="imp">IMPORT</button><input type="file" id="impf" accept=".json,application/json" hidden><button class="btn" id="revert" title="throw the draft away and start again from what is live">BACK TO LIVE</button></div></aside>
<footer><span id="xy">tile –</span><span id="zm"></span><span id="cost"></span><span class="sp"></span><span id="msg"></span></footer>
</div>
<script type="module">
// THE MAP EDITOR (owners; its own light page at /editor, no game loaded): the real ground picture (tools/topmap.cjs) with every placed thing over it; move buildings, park places, paths, cars and stalls, paint ground and roads; the draft stays in this browser until PUBLISH LIVE sends it to /shared/map-<section>.json, which every player's game lays over data/world.json at start (worker/mappatch.js).
const WORLD=__DATA__("data/world.json"), TOP=__DATA__("data/topmap.json");
__CODE__("worker/mappatch.js")
const MAPFILE=MAPPATCH.file(WORLD), $=s=>document.querySelector(s), WEB=/^https?:$/.test(location.protocol), KEY='mapeditor-draft', r2=v=>Math.round(v*100)/100, clone=o=>JSON.parse(JSON.stringify(o));
const GCOL={grass:'#4a7a3a',grass2:'#6f863a',grass3:'#2f6b2c',grass4:'#8fa05a',sidewalk:'#9a968e',cobble:'#6b6b70',dirt:'#6b4f33',gravel:'#7a766f',slab:'#8a857a',sand:'#c9b885',road:'#34363c',alley:'#46474c'};
const GNAME={grass:'GRASS',grass2:'DRY GRASS',grass3:'LUSH GRASS',grass4:'PALE GRASS',sidewalk:'SIDEWALK',cobble:'COBBLE',dirt:'DIRT',gravel:'GRAVEL',slab:'STONE SLAB',sand:'SAND',road:'ROAD',alley:'ALLEY',erase:'ERASE'};
const BASE={}; for(const o of TOP.items)BASE[o.gid]=o;
const PARKK=['round','lake','cave','tower','tower2','tower3','skatepark','castle'];
// what can be put down: the game's placed models (the landscape editor's kits and the drive models; sizes baked by tools/topmap.cjs) and its drivable cars
const GARDEN=__DATA__("data/garden.json")||[], KIT=TOP.kit||{models:{},groups:[],cars:[]}, MOD=KIT.models;
const nm=k=>k.startsWith('car:')?((KIT.cars.find(c=>'car:'+c[0]===k)||[0,k])[1]+' (DRIVABLE)'):k.replace(/^pf_/,'').replace(/_/g,' ').replace(/([a-z])([A-Z0-9])/g,'$1 $2').toUpperCase();
const TREES=['OakTree1','OakTree2','OakTree3','Elder1','Elder2','Spruce1','Willow1','Giant1','pf_twisted_dead_oak'];
const LG=n=>((KIT.groups||[]).find(g=>g[0]===n)||[0,[]])[1];
const CAT={build:[['HOMES',['pf_corner_tenement','pf_brownstone_row_house','pf_narrow_walk_up','pf_cast_iron_loft','pf_haunted_victorian_house','pf_porch_log_cabin','pf_mushroom_cottage','pf_hare_paenga_boat_house','pf_orongo_house_run']],
    ['SHOPS',['pf_corner_shop','pf_corner_shophouse','pf_two_storey_shophouse','pf_three_storey_shophouse','pf_wide_shophouse','pf_one_storey_shop_row','pf_convenience_store','pf_street_diner','pf_motel_office','pf_motel_room_run','pf_auto_repair_garage']],
    ['CIVIC',['pf_office_tower','pf_fire_station','pf_brick_church','pf_public_school','pf_village_hall','pf_parking_garage','pf_small_shrine_hall','pf_old_lighthouse','pf_family_mausoleum','pf_glass_conservatory','pf_promenade_bandstand','pf_press_box','pf_subway_entrance']]],
  nature:[['TREES',TREES],['BUSHES',LG('Bushes')],['GRASS',LG('Grass')],['FLOWERS',[...LG('Flowers'),'pf_common_daisy','pf_dandelion','pf_taro_plant','pf_dragonsbane_thistle']],['MUSHROOMS',[...LG('Mushrooms'),'pf_miasma_bladder_fungus']],['ROCKS',LG('Rocks')],['WOOD',LG('Wood')]],
  props:[['STREET',['pf_cemetery_lantern_post','pf_pay_phone_booth','pf_roadside_billboard','pf_doorman_canopy','pf_ticket_booth','pf_ice_cream_kiosk_on','pf_elote_cart','pf_food_truck','pf_platform_bookstall','pf_turnstile_bank','fence1','fence2','pf_wrought_iron_cemetery_fence','pillar1','pillar2','pillar3','pf_coiled_dragon_pillar','pf_moai_kavakava','pf_arched_cemetery_gate','pf_main_entrance_gate','pf_camp_tent','campfire']],
    ['DRIVABLE CARS',(KIT.cars||[]).map(c=>'car:'+c[0])],
    ['VEHICLES TO LOOK AT',['pf_compact_hatchback','pf_wheeled_city_coupe','pf_stretch_limousine','pf_patrol_cruiser','pf_security_patrol_cruiser','pf_vintage_hearse','pf_fire_engine','pf_semi_tractor','pf_box_trailer','pf_camper_trailer','pf_pop_top_camper_van','pf_team_minibus','pf_campus_shuttle_bus','pf_capital_cruiser','pf_freestyle_bmx']],
    ['WATER',['kayak','fisherboat','pf_lake_rowing_skiff','pf_hanga_roa_fishing_boat','pf_japanese_koi_pond','pf_kidney_pool','pf_wetland_boardwalk_run','pf_stone_viaduct_span','pf_pier_head_platform','pf_moat_bridge','pf_station_footbridge']]]};
for(const t in CAT)CAT[t]=CAT[t].map(([n,ks])=>[n,ks.filter(k=>k.startsWith('car:')||MOD[k])]).filter(g=>g[1].length);
{ const seen=new Set(Object.values(CAT).flatMap(g=>g.flatMap(x=>x[1]))), rest=Object.keys(MOD).filter(k=>!seen.has(k)); if(rest.length)CAT.props.push(['OTHER',rest]); }
const LYOF={}; for(const [t,ly] of [['build','build'],['nature','nature'],['props','props']])for(const [,ks] of CAT[t])for(const k of ks)LYOF[k]=ly;
const scaleFor=k=>TREES.includes(k)&&MOD[k]?Math.max(.3,Math.min(30,12/MOD[k][2])):MOD[k]?MOD[k][3]||1:1;

// the draft: the same shape as the published file's set, ground kept as cells (map tiles) until it is sent
const EMPTY=()=>({places:{},parkPlaces:{},paths:{},cars:{},things:{},homes:{},garden:{},add:[],del:[],newcars:[],names:{}});
let S={set:EMPTY(),cells:{}}, LIVE=null, EFF=WORLD, UNDO=[], REDO=[];
const cellsOf=G=>{ const c={}; for(const g of G||[])for(let y=Math.floor(g.y0);y<g.y1;y++)for(let x=Math.floor(g.x0);x<g.x1;x++)c[x+','+y]=g.t; return c; };
const rects=cells=>{ const by={}; for(const k in cells){ const [x,y]=k.split(',').map(Number); (by[cells[k]]=by[cells[k]]||[]).push([x,y]); } const out=[];
  for(const t in by){ const rows={}; for(const [x,y] of by[t])(rows[y]=rows[y]||[]).push(x); const runs=[];
    for(const y of Object.keys(rows).map(Number).sort((a,b)=>a-b)){ const xs=rows[y].sort((a,b)=>a-b); let a=xs[0], p=a; for(let i=1;i<=xs.length;i++){ if(i<xs.length&&xs[i]===p+1){ p=xs[i]; continue; } runs.push({y,x0:a,x1:p+1}); if(i<xs.length){ a=p=xs[i]; } } }
    const open=new Map(); for(const r of runs){ const k=r.x0+':'+r.x1, o=open.get(k); if(o&&o.y1===r.y)o.y1=r.y+1; else { if(o)out.push({x0:o.x0,x1:o.x1,y0:o.y0,y1:o.y1,t}); open.set(k,{x0:r.x0,x1:r.x1,y0:r.y,y1:r.y+1}); } }
    for(const o of open.values())out.push({x0:o.x0,x1:o.x1,y0:o.y0,y1:o.y1,t}); }
  return out; };
const patch=()=>{ const set=clone(S.set); for(const k in set)if(k!=='lamps'&&k!=='ponds'&&!Object.keys(set[k]).length)delete set[k]; const g=rects(S.cells); if(g.length)set.ground=g; return {v:MAPPATCH.v,at:new Date().toISOString(),set}; };
const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
const sortK=o=>Array.isArray(o)?o.map(sortK):o&&typeof o==='object'?Object.fromEntries(Object.keys(o).sort().map(k=>[k,sortK(o[k])])):o;
const canon=s=>JSON.stringify({set:sortK(s.set),cells:Object.keys(s.cells).sort().map(k=>k+'='+s.cells[k])});
let LIVEC=null; const setLive=P=>{ LIVE=P; LIVEC=P?canon(fromPatch(P)):null; };
const recompute=()=>{ EFF=MAPPATCH.apply(WORLD,{v:1,set:S.set}).W; };
const keep=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} };
const snap=()=>JSON.stringify(S), push=()=>{ UNDO.push(snap()); if(UNDO.length>300)UNDO.shift(); REDO.length=0; };
const changed=()=>{ recompute(); keep(); side(); draw(); };
const fromPatch=P=>{ const s={set:EMPTY(),cells:{}}; if(P&&P.set){ for(const k in s.set)if(P.set[k]&&typeof P.set[k]==='object'&&Array.isArray(P.set[k])===Array.isArray(s.set[k]))s.set[k]=clone(P.set[k]); if(Array.isArray(P.set.lamps))s.set.lamps=clone(P.set.lamps); if(Array.isArray(P.set.ponds))s.set.ponds=clone(P.set.ponds); s.cells=cellsOf(MAPPATCH.apply(WORLD,P).ground); } return s; };

// what is on the map: built from the draft's world each time
const wpx=x=>(x-TOP.O[0])*TOP.T, wpz=y=>(y-TOP.O[1])*TOP.T;
const BLK=WORLD.block, PW=WORLD.pathWidth||7.2;
function things(){ const L=[], W=EFF;
  for(const p of W.places){ const b=BASE[p.id]; let y0=p.y0, y1=p.y1; if(y1==null){ if(b){ y0=b.y-b.d/2; y1=b.y+b.d/2; } else { y0=BLK.back; y1=BLK.front; } }
    L.push({k:'place',id:p.id,n:(p.name||(b&&b.n)||p.id).toUpperCase(),sh:'rect',x:(p.x0+p.x1)/2,y:(y0+y1)/2,w:p.x1-p.x0,d:y1-y0,rot:0,face:p.y1!=null?(p.face||'n'):null,row:p.y1==null,ly:'build'}); }
  for(const k of PARKK){ const p=W.parkPlaces[k]; if(!p)continue; const b=BASE[k]||BASE.tower, ox=(b&&b.ox)||0, oy=(b&&b.oy)||0;
    if(k==='castle'){ const c=BASE.castle; L.push({k:'park',id:k,n:'THE CASTLE',sh:'rect',x:p.x0+c.w/2,y:p.y0+c.d/2,w:c.w,d:c.d,rot:0,ly:'park'}); continue; }
    const n=(BASE[k]&&BASE[k].n)||(k==='tower2'||k==='tower3'?'A TOWER':k.toUpperCase());
    if(b&&b.sh==='circle')L.push({k:'park',id:k,n,sh:'circle',x:p.x+ox,y:p.y+oy,r:p.r!=null?p.r:b.r,rot:0,ly:'park',ox,oy});
    else { const w=b?b.w:8, d=b?b.d:8, sw=p.face==='e'||p.face==='w'; L.push({k:'park',id:k,n,sh:'rect',x:p.x+ox,y:p.y+oy,w:sw?d:w,d:sw?w:d,rot:0,ly:'park',ox,oy}); } }
  for(const p of W.paths){ const ox=(BASE[p.id]&&BASE[p.id].ox)||0, oy=(BASE[p.id]&&BASE[p.id].oy)||0, ax=p.a[0]+ox, ay=p.a[1]+oy, bx=p.b[0]+ox, by=p.b[1]+oy;
    L.push({k:'path',id:p.id,n:(BASE[p.id]&&BASE[p.id].n)||'PARK PATH',sh:'rect',x:(ax+bx)/2,y:(ay+by)/2,w:Math.hypot(bx-ax,by-ay),d:PW,rot:Math.atan2(by-ay,bx-ax)*180/Math.PI,ly:'paths',ox,oy}); }
  for(const c of W.cars||[])L.push({k:'car',id:c.id,n:(/^m\d/.test(c.id)?'NEW ':'')+'CAR · '+String(c.model||'').toUpperCase(),sh:'rect',x:c.x,y:c.y,w:4.2,d:1.9,rot:-(c.hd||0)+90,hd:c.hd||0,ly:'props'});
  (W.things||[]).forEach((t,i)=>L.push({k:'thing',id:i,n:'STALL · '+String(t.k).toUpperCase(),sh:'rect',x:t.x,y:t.y,w:2.6,d:2,rot:(t.rot||0)*180/Math.PI,ly:'props'}));
  for(const id in W.homes||{}){ const h=W.homes[id]; if(Array.isArray(h)&&isFinite(h[0]))L.push({k:'home',id,n:'HOME OF '+id.toUpperCase(),sh:'circle',x:h[0],y:h[1],r:Math.max(.6,+h[2]||0),ly:'people'}); }
  for(const o of TOP.items)if(/^tree|^camp$|^gate$|^fountain$/.test(o.gid))L.push({k:'fixed',id:o.gid,n:o.n,sh:o.sh,x:o.x,y:o.y,w:o.w,d:o.d,r:o.r,rot:o.rot||0,h:o.h,ly:'fixed'});
  const gi=(o,k,id)=>{ const m=MOD[o.k]||[1,1,1,1], sc=o.s||1; const ly=LYOF[o.k]||'props', w=Math.max(.4,m[0]*sc), d=Math.max(.4,m[1]*sc); return {k,id,model:o.k,n:nm(o.k),sh:ly==='nature'?'circle':'rect',r:Math.max(w,d)/2,x:TOP.O[0]+o.x/TOP.T,y:TOP.O[1]+o.z/TOP.T,w,d,h:m[2]*sc,rot:-(o.rot||0)*180/Math.PI,s:sc,wr:o.rot||0,ly}; };
  for(const o of GARDEN){ const key=MAPPATCH.gkey(o), e=S.set.garden[key]; if(e===null)continue; L.push(gi(e?{...o,...e}:o,'garden',key)); }

  lampsOf().forEach((l,i)=>L.push({k:'lamp',id:i,n:'LAMP POST',sh:'circle',x:l.x,y:l.y,r:.7,h:4.4,ly:'power'}));
  const D=TOP.down||{}, bx=(b,o)=>({sh:'rect',x:(b[0]+b[2])/2,y:(b[1]+b[3])/2,w:b[2]-b[0],d:b[3]-b[1],rot:0,h:0,...o}), dX=stationShift(), SID=(WORLD.section&&WORLD.section.id)||'A';
  for(const v of D.levels||[])L.push(bx(v.box,{k:'under',id:v.id,n:v.name,ly:'under',lv:'down'}));
  for(const v of D.stations||[]){ const mine=v.id===SID, b=mine?[v.box[0]+dX,v.box[1],v.box[2]+dX,v.box[3]]:v.box; L.push(bx(b,{k:mine?'station':'under',id:'st-'+v.id,n:'PLATFORM · '+(mine?stationName():v.name),ly:'under',lv:'down'})); }
  for(const w of D.ways||[]){ const sub=w.b==='station', b=sub?[w.box[0]+dX,w.box[1],w.box[2]+dX,w.box[3]]:w.box; L.push(bx(b,{k:'stair',id:w.id,n:'⇅ '+w.id.toUpperCase(),ly:'stair',station:sub})); }
  for(const o of L)if(o.h==null)o.h=o.k==='place'?((BASE[o.id]&&BASE[o.id].h)||7):o.k==='park'?((BASE[o.id]&&BASE[o.id].h)||(/tower/.test(o.id)?6:0)):o.k==='car'?1:o.k==='thing'?1.6:0;
  return L; }
const stairsBase=()=>WORLD.places.find(p=>p.kind==='stairs'), stationShift=()=>{ const b=stairsBase(), e=b&&EFF.places.find(p=>p.id===b.id); return b&&e?((e.x0+e.x1)-(b.x0+b.x1))/2:0; };
const stationName=()=>((EFF.loop&&EFF.loop.stations||[]).find(q=>q.id===((WORLD.section&&WORLD.section.id)||'A'))||{}).name||'';
const MOVES=new Set(['place','park','path','car','thing','home','garden','added','lamp','pond']), CLEARS=new Set(['garden','added','car','lamp','pond']);
const ownPonds=()=>{ if(!S.set.ponds)S.set.ponds=clone(EFF.ponds||[]); return S.set.ponds; };
const lampsOf=()=>S.set.lamps||(KIT.lamps||[]), ownLamps=()=>{ if(!S.set.lamps)S.set.lamps=clone(KIT.lamps||[]); return S.set.lamps; };
const brookOf=()=>((EFF.parkPlaces.brook||{}).pts||[]), setBrook=pts=>{ const B=(WORLD.parkPlaces.brook||{}).pts; if(same(pts,B))delete S.set.parkPlaces.brook; else S.set.parkPlaces.brook={pts}; };
let ITEMS=[]; const items=()=>ITEMS=things();

// writing a thing back into the draft (only what differs from the baked file is kept)
const base=(k,id)=>k==='place'?WORLD.places.find(p=>p.id===id):k==='park'?WORLD.parkPlaces[id]:k==='path'?WORLD.paths.find(p=>p.id===id):k==='car'?(WORLD.cars||[]).find(c=>c.id===id):k==='thing'?WORLD.things[id]:WORLD.homes[id];
const SETK={place:'places',park:'parkPlaces',path:'paths',car:'cars',thing:'things',home:'homes',garden:'garden'};

  if(PLACE.has(tool)&&k==='r'){ e.preventDefault(); gdeg=((gdeg+(e.shiftKey?-1:1)*(tool==='build'?90:15))%360+360)%360; pal(); draw(); return; }
  if((k==='delete'||k==='backspace')&&sel&&CLEARS.has(sel.k)){ e.preventDefault(); push(); remove(sel); sel=null; changed(); return; }
  if(!sel||!MOVES.has(sel.k))return; if(k==='r'){ e.preventDefault(); push(); if(turn(sel,e.shiftKey?-15:15))changed(); else UNDO.pop(); return; }
  const d={arrowleft:[-1,0],arrowright:[1,0],arrowup:[0,-1],arrowdown:[0,1]}[k]; if(d){ e.preventDefault(); push(); const st=e.shiftKey?1:.25, a=ang(), c=Math.cos(a), s2=Math.sin(a); let dx=c*d[0]+s2*d[1], dy=-s2*d[0]+c*d[1]; if(Math.abs(dx)>=Math.abs(dy)){ dx=Math.sign(dx); dy=0; } else { dy=Math.sign(dy); dx=0; } write(sel,sel.x+dx*st,sel.row?sel.y:sel.y+dy*st); changed(); } });
$('#undo').onclick=undo; $('#redo').onclick=redo; $('#fit').onclick=()=>{ fit(); draw(); };

// going to the game, saving, publishing
const look=(x,y)=>{ const u='/?at='+r2(wpx(x))+','+r2(wpz(y)); if(WEB)window.open(u,'_blank','noopener'); else msg('LOOK IN 3D opens the game on the website at '+u); };
$('#look').onclick=()=>look(sel?sel.x:V.x,sel?sel.y:V.y);
let mt=0; const msg=t=>{ $('#msg').textContent=t; clearTimeout(mt); mt=setTimeout(()=>$('#msg').textContent='',6000); };
const download=(name,obj)=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,1)],{type:'application/json'})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); };
$('#exp').onclick=()=>{ download('map-'+new Date().toISOString().slice(0,16).replace(/[:T]/g,'-')+'.json',patch()); msg('EXPORTED'); };
$('#imp').onclick=()=>$('#impf').click();
$('#impf').onchange=async e=>{ const f=e.target.files&&e.target.files[0]; e.target.value=''; if(!f)return; try{ const j=JSON.parse(await f.text()); if(!j||j.v!==MAPPATCH.v||!j.set)throw 0; push(); S=fromPatch(j); changed(); msg('IMPORTED '+f.name); }catch(err){ msg('NOT A MAP EDITOR FILE'); } };
$('#revert').onclick=()=>{ if(!confirm('Throw this draft away and start again from what is live?'))return; push(); S=fromPatch(LIVE); changed(); msg('BACK TO WHAT IS LIVE'); };
$('#pub').onclick=async()=>{ const P=patch(); if(!WEB){ download(MAPFILE.slice(8),P); msg('NOT ON THE WEBSITE: DOWNLOADED '+MAPFILE.slice(8)+' INSTEAD'); return; }
  if(!confirm('Publish this map for every player? They get it the next time they come in.'))return; $('#pub').disabled=true; msg('PUBLISHING...');
  try{ const r=await fetch(MAPFILE,{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify(P)}), o=await r.json().catch(()=>({})); if(!r.ok||!o.ok)throw new Error(o.why||r.status); setLive(P); side(); msg('LIVE FOR EVERYONE'); }
  catch(err){ msg('NOT PUBLISHED: '+(err.message||err)); } $('#pub').disabled=false; };

// start: what is live, then this browser's draft over it
(async()=>{ $('#sec').textContent='section '+((WORLD.section&&WORLD.section.id)||'A')+' · build __BUILDV__';
  if(WEB){ try{ const r=await fetch(MAPFILE,{credentials:'same-origin',cache:'no-store'}); if(r.status===200)setLive(await r.json()); }catch(e){} }
  let d=null; try{ d=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){}
  S=d&&d.set&&d.cells?d:fromPatch(LIVE); { const E=EMPTY(); for(const k in E)if(!S.set[k]||Array.isArray(S.set[k])!==Array.isArray(E[k]))S.set[k]=E[k]; }
  recompute(); size(); fit(); seg(); bar(); side(); draw(); addEventListener('resize',()=>{ size(); draw(); });
  window.EDITOR={state:()=>S,patch,items:()=>ITEMS,write:(k,id,x,y,extra)=>{ const o=ITEMS.find(q=>q.k===k&&q.id===id); if(!o)return false; push(); write(o,x,y,extra); changed(); return true; },
    paint:(x,y,n,t)=>{ push(); const k=paintAt(x,y,n,t); changed(); return k; },live:()=>LIVE,
    view:o=>{ if(o.iso!=null)setIso(o.iso); if(o.rot!=null){ V.rot=o.rot; keepView(); } if(o.level)setLevel(o.level); draw(); return {rot:V.rot,iso:V.iso,level:LV}; },
    project:(x,y,h)=>P(x,y,h||0).map(v=>v/DPR),cat:()=>CAT,
    place:(k,x,y,deg)=>{ if(deg!=null)gdeg=deg; push(); const id=placeAt(k,x,y); changed(); return id; },
    clear:(k,id)=>{ const o=ITEMS.find(q=>q.k===k&&q.id===id); if(!o||!CLEARS.has(o.k))return false; push(); remove(o); changed(); return true; },
    tool:t=>{ tool=t; pal(); },
    lamp:(x,y)=>{ push(); const L=ownLamps(); L.push({x,y}); changed(); return L.length; },
    brook:(i,x,y)=>{ push(); const B=brookOf().map(q=>q.slice()); B[i]=[x,y]; setBrook(B); changed(); return B.length; },
    names:o=>{ push(); S.set.names=o; changed(); return true; },
    pond:(x,y,r)=>{ push(); const L=ownPonds(); L.push({x,y,r:r||6}); changed(); return L.length; },sel:()=>sel&&{k:sel.k,id:sel.id},ready:true}; })();
</script></body></html>
