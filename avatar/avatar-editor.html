<title>Avatar Workbench</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* layout: a tool rail on the left (header, tabs, controls), the stage with the figure on the right; on a phone the stage sits above the controls */
:root{
  --bg:#e7eaf0; --panel:#ffffff; --ink:#1a2130; --mute:#5b6475; --line:#d2d7e0; --chip:#eef1f6;
  --accent:#b8661a; --accent-ink:#ffffff; --good:#2f7d4f;
  --f-disp:'Silkscreen',ui-monospace,monospace; --f-body:'Atkinson Hyperlegible',system-ui,-apple-system,sans-serif; --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0f1218; --panel:#171b24; --ink:#e6e9ef; --mute:#9aa3b2; --line:#2a3140; --chip:#212735; --accent:#f0a64a; --accent-ink:#1c1206; --good:#5fc28a; color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#0f1218; --panel:#171b24; --ink:#e6e9ef; --mute:#9aa3b2; --line:#2a3140; --chip:#212735; --accent:#f0a64a; --accent-ink:#1c1206; --good:#5fc28a; color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;overflow:hidden}
#app{height:100%;display:grid;grid-template-columns:minmax(300px,370px) 1fr;grid-template-rows:auto 1fr;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
h1{font-family:var(--f-disp);font-weight:400;font-size:18px;letter-spacing:.06em;margin:0 8px 0 0;text-wrap:balance}
h1 small{font-family:var(--f-mono);font-size:11px;color:var(--mute);letter-spacing:0;margin-left:6px}
.sp{flex:1}
#side{background:var(--panel);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-height:0;min-width:0}
nav{display:flex;flex-wrap:wrap;gap:2px;padding:6px;border-bottom:1px solid var(--line)}
nav button{flex:1 1 auto}
.tab{display:none;overflow:auto;padding:10px 12px 18px;min-height:0;flex:1}
.tab.on{display:flex;flex-direction:column;gap:14px}
section h2{font-family:var(--f-disp);font-weight:400;font-size:12px;letter-spacing:.08em;color:var(--mute);margin:0 0 6px;text-transform:uppercase}
section p.note{margin:0 0 6px;color:var(--mute);font-size:12.5px;line-height:1.4}
button{font:inherit;font-size:12.5px;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:5px;padding:5px 9px;cursor:pointer;line-height:1.2}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.big{font-family:var(--f-disp);letter-spacing:.05em;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:4px}
.row{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.sl{display:grid;grid-template-columns:104px 1fr 46px;align-items:center;gap:8px;margin:2px 0}
.sl label{font-size:12.5px;color:var(--ink)}
.sl output{font-family:var(--f-mono);font-size:11.5px;color:var(--mute);text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent);min-width:0}
.sw{display:flex;flex-wrap:wrap;gap:3px;align-items:center;margin:2px 0 8px}
.sw b{width:20px;height:20px;border-radius:4px;border:1px solid var(--line);cursor:pointer;display:inline-block}
.sw b.on{outline:2px solid var(--accent);outline-offset:1px}
.sw input[type=color]{width:28px;height:22px;padding:0;border:1px solid var(--line);border-radius:4px;background:none}
.cl{font-size:12px;color:var(--mute);margin-top:4px}
select,input[type=text]{font:inherit;font-size:12.5px;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:5px;padding:4px 6px;min-width:0}
#stage{position:relative;border-radius:8px;overflow:hidden;min-height:0;min-width:0;border:1px solid var(--line);background:#20242c}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none}
#bar{position:absolute;left:8px;right:8px;bottom:8px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:7px;padding:6px 10px}
#bar .mini{display:flex;align-items:center;gap:6px;font-size:12px;flex:1 1 140px;min-width:0}
#bar .mini span{font-family:var(--f-disp);font-size:10.5px;letter-spacing:.06em;color:var(--mute)}
#hud{position:absolute;left:10px;top:8px;font-family:var(--f-mono);font-size:11px;color:#dfe3ea;text-shadow:0 1px 0 #000;pointer-events:none}
#toast{position:absolute;right:10px;top:8px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:12.5px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:70%}
#toast.on{opacity:1}
#loading{position:absolute;inset:0;display:grid;place-items:center;color:#dfe3ea;font-family:var(--f-disp);letter-spacing:.06em}
textarea{width:100%;box-sizing:border-box;min-height:80px;font-family:var(--f-mono);font-size:11px;background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:5px}
.kbd{font-family:var(--f-mono);font-size:11px;background:var(--chip);border:1px solid var(--line);border-radius:3px;padding:0 4px}
@media (max-width:760px){
  body{overflow:auto}
  #app{grid-template-columns:1fr;grid-template-rows:auto 56vh auto;height:auto;min-height:100%}
  #stage{order:2;min-height:320px}
  #side{order:3;max-height:none}
  .tab{overflow:visible}
}
@media (prefers-reduced-motion:reduce){ #toast{transition:none} }
</style>

<div id="app">
  <header>
    <h1>AVATAR WORKBENCH<small id="tris"></small></h1>
    <div class="row" id="genderRow"></div>
    <span class="sp"></span>
    <div class="row">
      <button id="undo" title="Undo (Ctrl+Z)">Undo</button>
      <button id="redo" title="Redo (Ctrl+Shift+Z)">Redo</button>
      <button id="rand" title="A random character">Randomize</button>
      <button id="resetAll">Reset</button>
    </div>
  </header>
  <aside id="side">
    <nav id="tabs"></nav>
    <div class="tab" id="t-body"></div>
    <div class="tab" id="t-look"></div>
    <div class="tab" id="t-pose"></div>
    <div class="tab" id="t-sculpt"></div>
    <div class="tab" id="t-view"></div>
    <div class="tab" id="t-file"></div>
  </aside>
  <main id="stage">
    <canvas id="cv"></canvas>
    <div id="loading">LOADING THE WORKBENCH...</div>
    <div id="hud"></div>
    <div id="toast"></div>
    <div id="bar">
      <div class="mini"><span>TURN</span><input type="range" id="yaw" min="-180" max="180" step="1"></div>
      <div class="mini"><span>TILT</span><input type="range" id="pitch" min="-80" max="85" step="1"></div>
      <div class="mini"><span>ZOOM</span><input type="range" id="zoom" min="0" max="100" step="1"></div>
      <button id="spin" title="Turntable (T)">Turntable</button>
    </div>
  </main>
</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {mergeVertices} from 'three/addons/utils/BufferGeometryUtils.js';
import {GLTFExporter} from 'three/addons/exporters/GLTFExporter.js';

const D2R=Math.PI/180, V3=THREE.Vector3, V2=THREE.Vector2;
const $=s=>document.querySelector(s);
const clone=o=>JSON.parse(JSON.stringify(o));
const store={ get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };

// ---------------------------------------------------------------- the character's numbers
const BASE={
  male:{height:1.78,head:1,neck:1,shoulders:1,chest:1,bust:0,waist:1,belly:0,hips:1,glutes:.2,torso:1,arms:1,armThick:1,hands:1,legs:1,legThick:1,feet:1,muscle:.2,
        faceW:1,jaw:1,eyeSize:1,eyeGap:1,eyeY:1,noseSize:1,ears:1,mouthW:1},
  female:{height:1.66,head:1,neck:.86,shoulders:.88,chest:.92,bust:.7,waist:.86,belly:0,hips:1.12,glutes:.55,torso:.98,arms:.98,armThick:.82,hands:.86,legs:1.03,legThick:.95,feet:.86,muscle:.05,
        faceW:.95,jaw:.85,eyeSize:1.1,eyeGap:1,eyeY:1,noseSize:.85,ears:.9,mouthW:.9}
};
const STYLE0={male:{hair:'short',eyes:'whites',mouth:'smile',brows:true,hat:'none',glasses:'none',sleeves:'short',legwear:'long',hands:'mitten'},
              female:{hair:'long',eyes:'lashes',mouth:'smile',brows:true,hat:'none',glasses:'none',sleeves:'short',legwear:'long',hands:'mitten'}};
const COL0={skin:'#e0ac8a',hair:'#3b2a1f',iris:'#3a2618',white:'#f4f2ee',shirt:'#3d6fb6',pants:'#2f3a52',shoes:'#6b4329',sole:'#1d1a18',hat:'#b23a3a',glass:'#23262b',mouth:'#7c2f2f'};
const S={gender:'male',p:{...BASE.male},st:{...STYLE0.male},c:{...COL0},sculpt:{},paint:{},name:'Walker'};

const BODY_SL=[['height','Height',1.0,2.4,.01],['head','Head size',.6,2],['neck','Neck',.5,1.8],['shoulders','Shoulders',.6,1.5],['chest','Chest',.6,1.6],['bust','Bust',0,1.6],
  ['waist','Waist',.6,1.7],['belly','Belly',0,1.6],['hips','Hips',.6,1.7],['glutes','Glutes',0,1.5],['torso','Torso length',.7,1.4],['arms','Arm length',.6,1.5],['armThick','Arm thickness',.5,1.8],
  ['hands','Hands',.6,1.7],['legs','Leg length',.6,1.5],['legThick','Leg thickness',.5,1.8],['feet','Feet',.6,1.7],['muscle','Muscle',0,1.6]];
const FACE_SL=[['faceW','Face width',.7,1.4],['jaw','Jaw',.6,1.4],['eyeSize','Eye size',.5,2.2],['eyeGap','Eye spacing',.6,1.5],['eyeY','Eye height',.4,1.6],['noseSize','Nose',0,2.5],['ears','Ears',0,2.6],['mouthW','Mouth width',.4,1.8]];

function dims(p){ const s=p.height/1.78, T=.5*s*p.torso, m=p.muscle;
  const d={s,T, r:.112*s*p.head, neckL:.075*s*p.neck, neckR:.054*s*(1+.3*m)*(.7+.3*p.neck),
    shW:.185*s*p.shoulders*(1+.06*m), chW:.165*s*p.chest*(1+.1*m)*(.55+.45*p.shoulders), chD:.105*s*p.chest*(1+.12*m),
    waW:.135*s*p.waist, waD:.095*s*p.waist, pelW:.15*s*p.hips, pelH:.11*s, pelD:.1*s*(.6+.4*p.hips), hipX:.085*s*p.hips,
    uArm:.28*s*p.arms, fArm:.25*s*p.arms, armR:.043*s*p.armThick*(1+.3*m), hand:.095*s*p.hands,
    thigh:.42*s*p.legs, shin:.41*s*p.legs, legR:.068*s*p.legThick*(1+.2*m), ankle:.075*s, foot:.25*s*p.feet, footW:.048*s*p.feet};
  d.hipY=.02*s+d.thigh+d.shin+d.ankle; return d; }

const BONE_NAMES=['root','hips','spine','chest','neck','head','armL','foreL','handL','armR','foreR','handR','thighL','shinL','footL','thighR','shinR','footR'];
const BONE_LABEL={root:'Whole body',hips:'Hips',spine:'Lower back',chest:'Chest',neck:'Neck',head:'Head',armL:'Left upper arm',foreL:'Left forearm',handL:'Left hand',armR:'Right upper arm',foreR:'Right forearm',handR:'Right hand',thighL:'Left thigh',shinL:'Left shin',footL:'Left foot',thighR:'Right thigh',shinR:'Right shin',footR:'Right foot'};
function boneTable(d){ const T=d.T, s=d.s;
  return [['root',null,[0,0,0]],['hips','root',[0,d.hipY,0]],['spine','hips',[0,.15*T,0]],['chest','spine',[0,.3*T,0]],['neck','chest',[0,.55*T,0]],['head','neck',[0,d.neckL,0]],
    ['armL','chest',[d.shW,.5*T,0]],['foreL','armL',[0,-d.uArm,0]],['handL','foreL',[0,-d.fArm,0]],
    ['armR','chest',[-d.shW,.5*T,0]],['foreR','armR',[0,-d.uArm,0]],['handR','foreR',[0,-d.fArm,0]],
    ['thighL','hips',[d.hipX,-.02*s,0]],['shinL','thighL',[0,-d.thigh,0]],['footL','shinL',[0,-d.shin,0]],
    ['thighR','hips',[-d.hipX,-.02*s,0]],['shinR','thighR',[0,-d.thigh,0]],['footR','shinR',[0,-d.shin,0]]]; }

// ---------------------------------------------------------------- shapes (each part a closed, seamless surface: sculpting never tears it)
function clean(g){ for(const k of Object.keys(g.attributes)) if(k!=='position') g.deleteAttribute(k); return mergeVertices(g,1e-5); }
function superEll(rx,ry,rz,p=2,ws=24,hs=16,mod){ const g=new THREE.SphereGeometry(1,ws,hs), a=g.attributes.position;
  for(let i=0;i<a.count;i++){ let x=a.getX(i),y=a.getY(i),z=a.getZ(i); const n=Math.pow(Math.abs(x)**p+Math.abs(y)**p+Math.abs(z)**p,1/p)||1; x/=n;y/=n;z/=n;
    let P=[x*rx,y*ry,z*rz]; if(mod) P=mod(P[0],P[1],P[2],x,y,z); a.setXYZ(i,P[0],P[1],P[2]); }
  return clean(g); }
function limb(len,r1,r2,dz=1,rs=14,cs=5,ls=6){ const pts=[];   // from y=0 (radius r1) down to y=-len (radius r2), rounded ends
  for(let i=0;i<=cs;i++){ const t=-Math.PI/2+i/cs*Math.PI/2; pts.push(new V2(Math.max(0,Math.cos(t))*r2,-len+Math.sin(t)*r2)); }
  for(let i=1;i<ls;i++){ const u=i/ls; pts.push(new V2(r2+(r1-r2)*u,-len+u*len)); }
  for(let i=0;i<=cs;i++){ const t=i/cs*Math.PI/2; pts.push(new V2(Math.max(0,Math.cos(t))*r1,Math.sin(t)*r1)); }
  const g=new THREE.LatheGeometry(pts,rs); g.scale(1,1,dz); return clean(g); }
function lathe(pts,rs=20){ return clean(new THREE.LatheGeometry(pts.map(([x,y])=>new V2(Math.max(0,x),y)),rs)); }
function torusArc(R,t,arc,rot=0){ const g=new THREE.TorusGeometry(R,t,6,14,arc); g.rotateZ(rot); return clean(g); }
const qFromY=v=>new THREE.Quaternion().setFromUnitVectors(new V3(0,1,0),v.clone().normalize());

// ---------------------------------------------------------------- the parts: every one named, on one bone, coloured by its region
function buildParts(d){
  const p=S.p, st=S.st, s=d.s, r=d.r, out=[];
  const add=(name,bone,region,geo,at=[0,0,0],rot)=>{ if(rot) geo.applyMatrix4(new THREE.Matrix4().makeRotationFromEuler(new THREE.Euler(rot[0]*D2R,rot[1]*D2R,rot[2]*D2R,'XYZ'))); geo.translate(at[0],at[1],at[2]); out.push({name,bone,region,geo}); };
  const upReg=st.sleeves==='none'?'skin':'shirt', loReg=st.sleeves==='long'?'shirt':'skin';
  const thighReg=st.legwear==='skirt'?'skin':'pants', shinReg=st.legwear==='long'?'pants':'skin';
  // torso
  add('pelvis','hips','pants',superEll(d.pelW,d.pelH*1.15,d.pelD,2.9,24,14,(X,Y,Z)=>[X*(Y<0?1-.12*(-Y/(d.pelH*1.15)):1),Y,Z]),[0,-.005*s,0]);
  if(p.glutes>.02) for(const sg of [1,-1]) add('glute'+(sg>0?'L':'R'),'hips','pants',superEll(.068*s*(.55+.45*p.glutes)*p.hips,.07*s*(.6+.4*p.glutes),.05*s*p.glutes+.01*s,2,14,10),[sg*.058*s*p.hips,-.03*s,-d.pelD*.55]);
  add('waist','spine','shirt',superEll(d.waW*(1+.28*p.belly),d.T*.25,d.waD*(1+.75*p.belly),2.5,24,16),[0,d.T*.15,.035*s*p.belly]);
  add('chest','chest','shirt',superEll(d.chW,d.T*.31,d.chD,2.5,28,20,(X,Y,Z)=>{ const t=Math.max(0,-Y/(d.T*.31)); return [X*(1-.18*t),Y,Z]; }),[0,d.T*.25,0]);
  add('yoke','chest','shirt',superEll(d.shW+d.armR*.3,d.T*.1,d.chD*.82,2.4,24,10),[0,d.T*.46,-d.chD*.05]);
  if(p.bust>.02) for(const sg of [1,-1]) add('bust'+(sg>0?'L':'R'),'chest','shirt',superEll(.058*s*(.5+.5*p.bust),.055*s*(.5+.5*p.bust),.045*s*p.bust+.01*s,2,16,12),[sg*d.chW*.42,d.T*.27,d.chD*.62]);
  add('neck','neck','skin',limb(d.neckL+.05*s,d.neckR,d.neckR*1.12,1,14,4,3),[0,d.neckL+.025*s,0]);
  // head and face
  const hc=[0,r*.95,0], rx=r*.86*p.faceW, ry=r, rz=r*.93, HP=2.2;
  const jawK=y=>{ if(y>=0) return [1,1]; const t=Math.min(1,-y/ry); return [1+(p.jaw*.9-1)*t,1-.06*t]; };
  add('head','head','skin',superEll(rx,ry,rz,HP,32,24,(X,Y,Z)=>{ const [kx,kz]=jawK(Y); return [X*kx,Y,Z*kz]; }),hc);
  const fz=(x,y)=>{ const [kx,kz]=jawK(y); const q=1-Math.abs(x/(rx*kx))**HP-Math.abs(y/ry)**HP; return rz*kz*Math.pow(Math.max(.03,q),1/HP); };
  const at=(x,y,dz=0)=>[x,hc[1]+y,fz(x,y)+dz];
  const e=r*.12*p.eyeSize, ex=r*.36*p.eyeGap, ey=r*(.06+.28*(p.eyeY-1));
  for(const sg of [1,-1]){ const L=sg>0?'L':'R', x=sg*ex, nm=k=>'eye_'+st.eyes+'_'+k+L;
    const whites=(k=1)=>add(nm('w'),'head','white',superEll(e*1.15*k,e*1.3*k,e*.55*k,2,14,10),at(x,0,-e*.22*k));
    const iris=(k=1,dy=-.08)=>add(nm('i'),'head','iris',superEll(e*.6*k,e*.7*k,e*.32*k,2,12,8),at(x,e*dy*k,e*.12*k));
    const arc=()=>add(nm('a'),'head','iris',torusArc(e*.85,e*.2,Math.PI),at(x,-e*.35,-e*.05));
    switch(st.eyes){
      case 'dots': add(nm('d'),'head','iris',superEll(e*.7,e*.9,e*.45,2,12,10),at(x,0,-e*.12)); break;
      case 'whites': whites(); iris(); break;
      case 'big': whites(1.45); iris(1.5,-.1); add(nm('g'),'head','white',superEll(e*.28,e*.28,e*.18,2,8,6),at(x+e*.35,e*.4,e*.62)); break;
      case 'sleepy': whites(); iris(1,-.2); add(nm('l'),'head','skin',superEll(e*1.32,e*.78,e*.72,2,14,10),at(x,e*.62,-e*.12)); break;
      case 'happy': arc(); break;
      case 'wink': if(sg>0){ whites(); iris(); } else arc(); break;
      case 'lashes': whites(); iris(); for(let k=0;k<3;k++){ const a=(25+k*30)*D2R; const g=superEll(e*.12,e*.38,e*.12,2,6,6); g.rotateZ(-sg*(a-50*D2R)); add(nm('h'+k),'head','hair',g,at(x+sg*Math.cos(a)*e*1.15,Math.sin(a)*e*1.2+e*.1,-e*.08)); } break;
    }
    if(st.brows) add('brow'+L,'head','hair',superEll(e*1.25,e*.26,e*.28,4,10,6),at(x,e*2.1+(st.eyes==='big'?e*.5:0),-e*.08),[0,0,-sg*8]);
    add('ear'+L,'head','skin',superEll(r*.1*p.ears+.002,r*.2*p.ears+.002,r*.13*p.ears+.002,2,12,10),[sg*rx*.97,hc[1]-r*.02,-r*.05]);
  }
  if(p.noseSize>.02) add('nose','head','skin',superEll(r*.11*p.noseSize,r*.15*p.noseSize,r*.13*p.noseSize,2,12,10),at(0,-r*.2,-r*.04*p.noseSize));
  const mw=r*.2*p.mouthW, my=-r*.5;
  switch(st.mouth){
    case 'line': add('mouth_line','head','mouth',superEll(mw,r*.03,r*.04,4,12,6),at(0,my,-r*.015)); break;
    case 'smile': add('mouth_smile','head','mouth',torusArc(mw*.9,r*.035,Math.PI,Math.PI),at(0,my+mw*.45,-r*.02)); break;
    case 'open': add('mouth_open','head','mouth',superEll(mw*.65,r*.1,r*.06,2,14,10),at(0,my-r*.02,-r*.03)); break;
    case 'grin': add('mouth_grin','head','white',superEll(mw,r*.07,r*.05,3,16,8),at(0,my,-r*.025)); add('mouth_grinl','head','mouth',superEll(mw*1.04,r*.012,r*.055,4,12,4),at(0,my,-r*.02)); break;
    case 'o': add('mouth_o','head','mouth',torusArc(r*.06,r*.025,Math.PI*2),at(0,my,-r*.01)); break;

function quickSculpt(k){ push(); const d=G.d, r=d.r, hb=G.rest.head, h=hb.y+r*.95, at=(x,y,z)=>new V3(x,y,z);

  if(k==='cheeks') go('pull',B('head',at(r*.5,h-r*.15,r*.75)),N('head',at(.5,0,.8)),r*.28,.5);
  if(k==='chin') go('pull',B('head',at(0,h-r*.85,r*.6)),N('head',at(0,-.4,1)),r*.3,.6);
  if(k==='brow') go('pull',B('head',at(r*.3,h+r*.32,r*.85)),N('head',at(0,.2,1)),r*.3,.5);
  if(k==='belly') go('inflate',B('spine',at(0,G.rest.spine.y+d.T*.08,d.waD)),N('spine',at(0,0,1)),d.waW*1.1,.8,10);
  if(k==='pecs') go('pull',B('chest',at(d.chW*.45,G.rest.chest.y+d.T*.33,d.chD*.95)),N('chest',at(0,0,1)),d.chW*.5,.5,6);
  if(k==='calves'){ const sh=G.rest.shinL; go('pull',B('shinL',at(sh.x,sh.y-d.shin*.3,-d.legR*.7)),N('shinL',at(0,0,-1)),d.legR*1.1,.6,6); }
  if(k==='knuckles'){ BR.tool='pull'; for(let i=0;i<40;i++){ const vi=(Math.random()*G.n)|0; const pos=G.geo.attributes.position.array; const p=new V3(pos[vi*3],pos[vi*3+1],pos[vi*3+2]).applyMatrix4(M[G.vBone[vi]]); const nn=new V3().fromArray(G.geo.attributes.normal.array,vi*3).transformDirection(G.bones[BONE_NAMES[G.vBone[vi]]].matrixWorld); BR.r=.025; BR.s=.6; strokeAt({p,n:nn},false); } }

// ---------------------------------------------------------------- camera, input, loop
function focusPoint(){ if(VIEW.focus==='face'){ const p=new V3(); G.bones.head.getWorldPosition(p); p.y+=G.d.r*.9; return p; } if(VIEW.focus==='feet'){ const a=new V3(),b=new V3(); G.bones.footL.getWorldPosition(a); G.bones.footR.getWorldPosition(b); return a.add(b).multiplyScalar(.5).add(new V3(0,.05,0)); }

let FOC=null;

  sun.target.position.set(0,.8,0); }
const zoomOf=d=>Math.round(100*(1-Math.log(d/.5)/Math.log(16))), distOf=z=>.5*Math.pow(16,1-z/100);

let drag=null;
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{ cv.setPointerCapture(e.pointerId); const h=(e.button===0&&!e.shiftKey&&(TAB==='sculpt'||TAB==='pose'))?hitAt(e):null;
  if(h&&TAB==='sculpt'){ push(); drag={mode:'sculpt'}; if(BR.tool==='grab') grabStart(h); else strokeAt(h,true); return; }
  drag={mode:(e.button===1||(e.button===0&&e.shiftKey))?'pan':'orbit',x:e.clientX,y:e.clientY,moved:0,hit:h}; });
cv.addEventListener('pointermove',e=>{
  if(drag&&drag.mode==='sculpt'){ if(BR.tool==='grab') grabMove(e); else { const h=hitAt(e); if(h){ strokeAt(h,false); showCursor(h); } } return; }
  if(drag){ const dx=e.clientX-drag.x, dy=e.clientY-drag.y; drag.x=e.clientX; drag.y=e.clientY; drag.moved+=Math.abs(dx)+Math.abs(dy);
    if(drag.mode==='orbit'){ VIEW.yaw-=dx*.45; VIEW.pitch=Math.max(-80,Math.min(85,VIEW.pitch+dy*.35)); VIEW.spin=false; }
    else { const k=VIEW.dist*.0016, rgt=new V3().setFromMatrixColumn(camera.matrixWorld,0), up=new V3().setFromMatrixColumn(camera.matrixWorld,1); VIEW.focus=null; VIEW.tx-=rgt.x*dx*k; VIEW.tz-=rgt.z*dx*k; VIEW.tx+=up.x*dy*k; VIEW.tz+=up.z*dy*k; VIEW.ty+=up.y*dy*k; }
    refreshBar(); return; }
  if(TAB==='sculpt'){ const h=hitAt(e); if(h) showCursor(h); else cursor.visible=false; } });
const endDrag=e=>{ if(!drag) return; if(drag.mode==='sculpt'){ grabW=null; save(); } else if(drag.mode==='orbit'&&drag.moved<4&&drag.hit&&TAB==='pose'){ POSE.sel=BONE_NAMES[G.vBone[drag.hit.vi]]; refreshAll(); hud(); } drag=null; };
cv.addEventListener('pointerup',endDrag); cv.addEventListener('pointercancel',endDrag);
cv.addEventListener('pointerleave',()=>{ if(!drag) cursor.visible=false; });
cv.addEventListener('wheel',e=>{ e.preventDefault(); VIEW.dist=Math.max(.5,Math.min(8,VIEW.dist*Math.exp(e.deltaY*.0012))); refreshBar(); },{passive:false});
function showCursor(h){ cursor.visible=true; cursor.position.copy(h.p).addScaledVector(h.n,.002); cursor.quaternion.setFromUnitVectors(new V3(0,0,1),h.n); cursor.scale.setScalar(BR.r); }
addEventListener('keydown',e=>{ if(e.target.matches('input[type=text],textarea')) return; const k=e.key;
  if((e.ctrlKey||e.metaKey)&&k.toLowerCase()==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); return; }

  if(k==='['){ BR.r=Math.max(.01,BR.r*.85); refreshAll(); } if(k===']'){ BR.r=Math.min(.25,BR.r/.85); refreshAll(); }

let last=performance.now();
function loop(now){ const dt=Math.min(.05,(now-last)/1000); last=now; stepPose(dt); if(VIEW.spin){ VIEW.yaw+=VIEW.spinV*dt; if(Math.random()<.1) refreshBar(); } renderNow(); requestAnimationFrame(loop); }

// ---------------------------------------------------------------- start: what was here last time, or the base Walker spread out
(function start(){
  const v=store.get('avatar-workbench-view'); if(v) Object.assign(VIEW,v,{spin:false,focus:null});
  const s=store.get('avatar-workbench'); let ok=false;
  if(s){ try{ fromJSON(s); ok=true; }catch(e){ ok=false; } }
  if(!ok){ rebuild(); setPose('Spread out'); }
  applyScene(VIEW.scene in SCENES?VIEW.scene:'Studio'); G.mesh.material=MATS[VIEW.shade]||MATS.toon; G.outline.visible=VIEW.outline; sun.castShadow=VIEW.shadows; gridH.visible=VIEW.grid;
  POSE.blend=1; for(const b of BONE_NAMES) POSE.cur[b]=POSE.target[b].slice(); POSE.air=POSE.airT; applyPose(); groundIt();
  showTab(store.get('avatar-workbench-tab')||'body'); refreshPoseUI(); resize(); $('#loading').hidden=true; requestAnimationFrame(loop);
  window.AW={S,G:()=>G,POSE,VIEW,BR,setPose,playAnim,applyView,applyBody,applyLook,applyScene,strokeAt,hitAt,quickSculpt,toJSON,fromJSON,showTab,undo,renderNow};
})();
