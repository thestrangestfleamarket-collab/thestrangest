<title>Quiet Island</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600&display=swap">
<style>
:root{
  --ink:#0d2230;
  --foam:#f4f7f6;
  --glass:rgba(16,38,52,.38);
  --glass-hi:rgba(244,247,246,.92);
  --line:rgba(244,247,246,.22);
  --dim:rgba(244,247,246,.72);
  --display:'Instrument Serif',Georgia,'Times New Roman',serif;
  --ui:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--foam);font-family:var(--ui)}
#c{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;outline:none}
.ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;
  padding-block:calc(18px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.mark{font:500 11px/1.4 var(--ui);letter-spacing:.18em;text-transform:uppercase;color:var(--dim);text-shadow:0 1px 8px rgba(0,0,0,.35)}
.mark b{color:var(--foam);font-weight:600}
.bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.lede{display:flex;flex-direction:column;gap:10px;min-width:0}
h1{margin:0;font:400 clamp(44px,8vw,96px)/.9 var(--display);letter-spacing:-.01em;text-shadow:0 2px 24px rgba(0,0,0,.28)}
h1 i{font-style:italic}
.sub{margin:0;font:400 15px/1.5 var(--ui);color:var(--dim);max-width:46ch;text-shadow:0 1px 10px rgba(0,0,0,.4)}
.row{display:flex;flex-wrap:wrap;gap:6px;pointer-events:auto}
.chip{font:500 12px/1 var(--ui);color:var(--foam);background:var(--glass);border:1px solid var(--line);border-radius:999px;
  padding:9px 13px;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:background .25s,color .25s}
.chip:hover{background:rgba(16,38,52,.6)}
.chip[aria-pressed="true"]{background:var(--glass-hi);color:var(--ink)}
.chip:focus-visible{outline:2px solid var(--foam);outline-offset:2px}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.vr{font:600 12px/1 var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--ink);background:var(--foam);border:0;border-radius:999px;padding:11px 16px;cursor:pointer;pointer-events:auto}
.vr[disabled]{background:var(--glass);color:var(--dim);border:1px solid var(--line);cursor:default}
.log{font:500 11px/1.6 var(--ui);color:var(--dim);font-variant-numeric:tabular-nums;text-align:right;text-shadow:0 1px 8px rgba(0,0,0,.4)}
.hint{font:400 12px/1.4 var(--ui);color:var(--dim);text-shadow:0 1px 8px rgba(0,0,0,.4)}
#load{position:fixed;inset:0;display:grid;place-items:center;background:var(--ink);transition:opacity 1.2s;z-index:5}
#load div{display:flex;flex-direction:column;align-items:center;gap:14px}
#load em{font:italic 400 34px/1 var(--display)}
#load span{font:500 11px/1 var(--ui);letter-spacing:.18em;text-transform:uppercase;color:var(--dim);font-variant-numeric:tabular-nums}
#veil{position:fixed;inset:0;background:var(--ink);opacity:0;pointer-events:none;transition:opacity .6s}
@media (max-width:640px),(max-height:560px){.side{align-items:flex-start}.log{text-align:left}.sub{display:none}h1{font-size:40px}.chip{padding:7px 10px;font-size:11px}}
@media (prefers-reduced-motion:reduce){#load,#veil,.chip{transition:none}}
</style>

<canvas id="c" tabindex="0" aria-label="A small island with a hut, palms and the open sea"></canvas>
<div class="ui">
  <div class="top">
    <div class="mark"><b>Quiet Island</b> · 4°37′ S · no sound, on purpose</div>
    <div class="side">
      <button class="vr" id="vr" disabled>Checking VR…</button>
    </div>
  </div>
  <div class="bottom">
    <div class="lede">
      <h1>Quiet <i>Island.</i></h1>
      <p class="sub">One hut, five palms, a hammock and the whole sea. Drag to look around. Tap a coconut to knock it down.</p>
      <div class="row" id="views"></div>
    </div>
    <div class="side">
      <div class="log" id="log"></div>
      <div class="row" id="times"></div>
      <div class="row" id="winds"></div>
    </div>
  </div>
</div>
<div id="veil"></div>
<div id="load"><div><em>Quiet Island</em><span id="lp">Gathering shells · 0%</span></div></div>

</script>

const controls=new OrbitControls(camera,canvas);

const manager=new THREE.LoadingManager();
const lp=document.getElementById('lp');

const texL=new THREE.TextureLoader(manager), gltfL=new GLTFLoader(manager), hdrL=new RGBELoader(manager).setDataType(THREE.FloatType);

const WIND_V=`

    if(hd>-.7)turn+=2.5;turn+=noise(i*3.1,S.time*.4)*1.6;
    f.h+=clamp(turn,-2.5,2.5)*dt;const sp=f.s*(.55+.45*Math.sin(S.time*.8+i));
    f.p.x+=Math.cos(f.h)*sp*dt;f.p.z+=Math.sin(f.h)*sp*dt;
    const g=H(f.p.x,f.p.z),ty=clamp(Math.max(g*.55,g+.3),-2.6,-.35);f.y+=(ty-f.y)*dt*2;
    tmpQ.setFromEuler(tmpE.set(0,-f.h,0));tmpM.compose(new V3(f.p.x,f.y+Math.sin(S.time*2+i)*.03,f.p.z),tmpQ,new V3(f.sz,f.sz,f.sz));fish.im.setMatrixAt(i,tmpM)});
  fish.im.instanceMatrix.needsUpdate=true;
}

const gulls=[];
function buildGulls(){
  const white=new THREE.MeshStandardMaterial({color:0xf2f2ee,roughness:.8}),grey=new THREE.MeshStandardMaterial({color:0x9aa2a8,roughness:.8,side:THREE.DoubleSide}),dark=new THREE.MeshStandardMaterial({color:0x2a2d30,roughness:.8,side:THREE.DoubleSide}),beak=new THREE.MeshStandardMaterial({color:0xe0b23a});
  for(let i=0;i<4;i++){
    const g=new THREE.Group();const body=new THREE.Mesh(new THREE.SphereGeometry(.12,10,8),white);body.scale.set(1,1,3);g.add(body);
    const head=new THREE.Mesh(new THREE.SphereGeometry(.08,10,8),white);head.position.set(0,.05,.36);g.add(head);
    const bk=new THREE.Mesh(new THREE.ConeGeometry(.02,.09,6),beak);bk.rotation.x=Math.PI/2;bk.position.set(0,.04,.47);g.add(bk);
    const tail=new THREE.Mesh(new THREE.PlaneGeometry(.2,.2),white);tail.rotation.x=-Math.PI/2;tail.position.z=-.4;g.add(tail);
    const wings=[];for(const s of [-1,1]){const inner=new THREE.Group(),outer=new THREE.Group();
      const ig=new THREE.BufferGeometry().setFromPoints([new V3(0,0,.12),new V3(s*.55,0,.08),new V3(s*.55,0,-.14),new V3(0,0,-.16)]);ig.setIndex(s>0?[0,1,2,0,2,3]:[0,2,1,0,3,2]);ig.computeVertexNormals();
      inner.add(new THREE.Mesh(ig,grey));outer.position.x=s*.55;
      const og=new THREE.BufferGeometry().setFromPoints([new V3(0,0,.08),new V3(s*.5,0,-.02),new V3(s*.42,0,-.12),new V3(0,0,-.14)]);og.setIndex(s>0?[0,1,2,0,2,3]:[0,2,1,0,3,2]);og.computeVertexNormals();
      outer.add(new THREE.Mesh(og,dark));inner.add(outer);g.add(inner);wings.push([inner,outer,s])}
    g.traverse(o=>{if(o.isMesh)o.castShadow=true});scene.add(g);
    gulls.push({g,wings,r:rr(22,48),h:rr(12,24),sp:rr(.08,.14)*(i%2?1:-1),a:rr(0,TAU),flap:0,ph:rr(0,9)})}
}
function stepGulls(dt){
  gulls.forEach(b=>{b.a+=b.sp*dt;const wob=Math.sin(S.time*.2+b.ph)*6;const r=b.r+wob;
    const p=new V3(Math.cos(b.a)*r,b.h+Math.sin(S.time*.3+b.ph)*2,Math.sin(b.a)*r);
    const t=new V3(-Math.sin(b.a)*Math.sign(b.sp),0,Math.cos(b.a)*Math.sign(b.sp));
    b.g.position.copy(p);b.g.lookAt(p.clone().add(t));b.g.rotateZ(-Math.sign(b.sp)*.35);
    const fl=Math.sin(S.time*.5+b.ph)>.6;b.flap+=(fl?1:-1)*dt*2;b.flap=clamp(b.flap,0,1);
    const ang=b.flap*Math.sin(S.time*7.5+b.ph)*.6+(1-b.flap)*(.08+Math.sin(S.time*1.3+b.ph)*.04);
    b.wings.forEach(([i,o,s])=>{i.rotation.z=s*ang;o.rotation.z=s*ang*.6+s*.05})});
}

const tmpV=new V3(),tmpN=new V3();
function physics(dt){
  const t=S.time;
  for(const b of bodies){
    if(b.state==='tree'){palmSway(b.palm,tmpV);b.p.copy(b.anchor).add(tmpV);b.m.position.copy(b.p);continue}
    if(b.state==='held')continue;
    const wy=waveY(b.p.x,b.p.z,t),sub=clamp((wy-(b.p.y-b.r))/(2*b.r),0,1);
    if(b.rest>1.2&&sub===0)continue;
    b.v.y-=9.81*dt;
    if(sub>0){b.v.y+=sub*9.81*2.1*dt;const k=Math.min(1,sub*2.2*dt);b.v.multiplyScalar(1-k);
      const r=Math.hypot(b.p.x,b.p.z);b.v.x+=(-b.p.x/r*.12+WAVES[0].dx*.05)*sub*dt*S.wind*2;b.v.z+=(-b.p.z/r*.12+WAVES[0].dz*.05)*sub*dt*S.wind*2;
      b.m.rotation.x+=Math.sin(t*1.3+b.r*40)*.004;b.rest=0}
    b.p.addScaledVector(b.v,dt);
    const h=H(b.p.x,b.p.z);let contact=false;
    if(b.p.y-b.r<h){const n=Hn(b.p.x,b.p.z);b.p.y=h+b.r;const vn=b.v.dot(n);if(vn<0)b.v.addScaledVector(n,-vn*(1+.28));
      const vt=tmpV.copy(b.v).addScaledVector(n,-b.v.dot(n));b.v.addScaledVector(vt,-Math.min(1,(sub>0?1.5:3.2)*dt));
      contact=true}
    for(const c of colliders){tmpN.copy(b.p).sub(c.c);const d=tmpN.length(),m=b.r+c.r;if(d<m&&d>1e-4){tmpN.multiplyScalar(1/d);b.p.addScaledVector(tmpN,m-d);const vn=b.v.dot(tmpN);if(vn<0)b.v.addScaledVector(tmpN,-vn*1.3);contact=true}}
    for(const bx of [HUT.box,pier.box]){if(!bx)continue;const lx=b.p.x-bx.c.x,lz=b.p.z-bx.c.z,c=Math.cos(bx.rot),s=Math.sin(bx.rot);const u=lx*c-lz*s,w=lx*s+lz*c;
      if(Math.abs(u)<bx.hw&&Math.abs(w)<bx.hd&&b.p.y-b.r<bx.top&&b.p.y>bx.top-.25){b.p.y=bx.top+b.r;if(b.v.y<0)b.v.y*=-.3;b.v.x*=1-3*dt;b.v.z*=1-3*dt;contact=true}}
    for(const o of bodies){if(o===b||o.state!=='free')continue;tmpN.copy(b.p).sub(o.p);const d=tmpN.length(),m=b.r+o.r;if(d<m&&d>1e-4){tmpN.multiplyScalar(1/d);const k=(m-d)/2;b.p.addScaledVector(tmpN,k);o.p.addScaledVector(tmpN,-k);
      const rv=b.v.clone().sub(o.v).dot(tmpN);if(rv<0){b.v.addScaledVector(tmpN,-rv*.65);o.v.addScaledVector(tmpN,rv*.65);o.rest=0}}}
    if(contact){const hv=Math.hypot(b.v.x,b.v.z);if(hv>1e-3){const ax=tmpN.set(b.v.z,0,-b.v.x).normalize();b.m.rotateOnWorldAxis(ax,hv*dt/b.r)}}
    b.rest=(contact&&b.v.lengthSq()<.004)?b.rest+dt:0;
    b.m.position.copy(b.p)}
}
function knock(b,impulse){if(b.state==='tree'){b.state='free';b.v.set(rr(-.4,.4),-.2,rr(-.4,.4))}else b.v.add(impulse);b.rest=0}

const views={
  island:{label:'The island',p:[2,21,33],t:[0,1,-1]},
  water:{label:'At the water',p:[7.5,1.2,15.5],t:[-1,1.6,-2]},
  hut:{label:'The hut',p:[2.6,2.4,4.2],t:[-1.3,1.6,-2.8]},
  above:{label:'From above',p:[.1,62,.4],t:[0,0,0]},
  sea:{label:'Open sea',p:[-46,5,52],t:[0,2,0]},
  hammock:{label:'The hammock',p:[-1.2,2.1,4.2],t:[-5.6,1,8.2]}};
let fly=null;
function goView(k,instant){const v=views[k];setPressed('views',k);
  const from={p:camera.position.clone(),t:controls.target.clone()},to={p:new V3(...v.p),t:new V3(...v.t)};
  if(instant){camera.position.copy(to.p);controls.target.copy(to.t);controls.update();return}
  fly={from,to,t:0}}
function stepFly(dt){if(!fly)return;fly.t=Math.min(1,fly.t+dt/3.2);const e=fly.t<.5?4*fly.t**3:1-(-2*fly.t+2)**3/2;
  camera.position.lerpVectors(fly.from.p,fly.to.p,e);const lift=Math.sin(e*Math.PI)*Math.max(0,8-fly.to.p.y)*.6;camera.position.y+=lift;
  controls.target.lerpVectors(fly.from.t,fly.to.t,e);if(fly.t>=1)fly=null}

function chips(id,items,on){const el=document.getElementById(id);el.innerHTML='';
  for(const [k,label] of items){const b=document.createElement('button');b.className='chip';b.type='button';b.dataset.k=k;b.textContent=label;b.setAttribute('aria-pressed','false');b.onclick=()=>on(k);el.appendChild(b)}}
function setPressed(id,k){document.querySelectorAll('#'+id+' .chip').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===k?'true':'false'))}
chips('views',Object.entries(views).map(([k,v])=>[k,v.label]),k=>goView(k));
chips('times',Object.entries(SKY).map(([k,v])=>[k,v.label]),setSky);
chips('winds',[['calm','Calm'],['breezy','Breezy'],['still','Still water']],k=>{setPressed('winds',k);S.windT=k==='calm'?.75:k==='breezy'?1.45:.05;WU.uCrest.value=k==='breezy'?1:0;updLog()});
const logEl=document.getElementById('log');
function updLog(){const kn=Math.round(S.windT*7);logEl.textContent=`Wind ${kn} kn · swell ${(S.windT*.32).toFixed(1)} m · water 27 °C`}

const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();let downAt=null;
canvas.addEventListener('pointerdown',e=>{downAt=[e.clientX,e.clientY];fly=null});
canvas.addEventListener('pointerup',e=>{if(!downAt||Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1])>6)return;
  mouse.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(mouse,camera);
  const hit=ray.intersectObjects(bodies.map(b=>b.m))[0];
  if(hit){const b=hit.object.userData.body;const d=ray.ray.direction.clone();d.y=Math.max(d.y,0)+.5;knock(b,d.multiplyScalar(3.2))}});
canvas.addEventListener('pointermove',e=>{if(e.buttons)return;mouse.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(mouse,camera);
  canvas.style.cursor=ray.intersectObjects(bodies.map(b=>b.m))[0]?'pointer':'grab'});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

const XR={hands:[],arcPts:new Float32Array(60*3)};
const teleTargets=[];
function setupXR(){
  const btn=document.getElementById('vr');
  const no=t=>{btn.textContent=t;btn.disabled=true};
  if(!navigator.xr){no('VR: open on a headset browser');return}
  navigator.xr.isSessionSupported('immersive-vr').then(ok=>{if(!ok)return no('VR: no headset found');
    btn.disabled=false;btn.textContent='Enter VR';
    btn.onclick=async()=>{try{const s=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor','bounded-floor','hand-tracking']});
      renderer.xr.setSession(s);btn.textContent='In VR';s.addEventListener('end',()=>{btn.textContent='Enter VR';rig.position.set(0,0,0);rig.rotation.set(0,0,0);goView('island',true)})}
      catch(e){no('VR was refused here: open this page directly on the headset')}}}).catch(()=>no('VR: open on a headset browser'));
  const lineG=new THREE.BufferGeometry();lineG.setAttribute('position',new THREE.BufferAttribute(XR.arcPts,3));
  XR.arc=new THREE.Line(lineG,new THREE.LineBasicMaterial({color:0xf4f7f6,transparent:true,opacity:.8}));XR.arc.visible=false;XR.arc.frustumCulled=false;scene.add(XR.arc);
  XR.ring=new THREE.Mesh(new THREE.RingGeometry(.22,.28,32).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0xf4f7f6,transparent:true,opacity:.85,depthWrite:false}));XR.ring.visible=false;scene.add(XR.ring);
  for(let i=0;i<2;i++){
    const ctl=renderer.xr.getController(i),grip=renderer.xr.getControllerGrip(i);rig.add(ctl,grip);
    const body=new THREE.Mesh(new THREE.CapsuleGeometry(.025,.09,4,10),new THREE.MeshStandardMaterial({color:0x2a3a44,roughness:.4}));body.rotation.x=-Math.PI/2.4;grip.add(body);
    const h={ctl,grip,aim:false,held:null,hist:[],snap:false};XR.hands.push(h);
    ctl.addEventListener('selectstart',()=>{const hit=pointHit(h);if(hit){knock(hit,new V3())}else h.aim=true});
    ctl.addEventListener('selectend',()=>{if(h.aim&&XR.target&&XR.owner===h)teleport(XR.target);h.aim=false;XR.arc.visible=XR.ring.visible=false;XR.target=null});
    ctl.addEventListener('squeezestart',()=>grab(h));ctl.addEventListener('squeezeend',()=>release(h));
  }
}
function pointHit(h){const m=h.ctl.matrixWorld,o=new V3().setFromMatrixPosition(m),d=new V3(0,0,-1).transformDirection(m);ray.set(o,d);ray.far=40;const hit=ray.intersectObjects(bodies.filter(b=>b.state==='tree').map(b=>b.m))[0];ray.far=Infinity;return hit&&hit.object.userData.body}
function grab(h){const p=new V3().setFromMatrixPosition(h.grip.matrixWorld);let best=null,bd=.28;for(const b of bodies){if(b.state==='held')continue;const d=b.p.distanceTo(p);if(d<bd){bd=d;best=b}}
  if(best){best.state='held';h.held=best;h.hist=[]}}
function release(h){const b=h.held;if(!b)return;h.held=null;b.state='free';b.rest=0;
  const H_=h.hist;if(H_.length>2){const a=H_[0],z=H_[H_.length-1],dt=(z.t-a.t)||1/72;b.v.copy(z.p).sub(a.p).multiplyScalar(1.15/dt)}else b.v.set(0,0,0)}
function teleport(p){const cam=new V3();camera.getWorldPosition(cam);rig.position.x+=p.x-cam.x;rig.position.z+=p.z-cam.z;rig.position.y=p.y}
function stepXR(dt){
  const s=renderer.xr.getSession();if(!s)return;
  let k=0;for(const src of s.inputSources){const h=XR.hands[k++];if(!h||!src.gamepad)continue;const ax=src.gamepad.axes[2]||0;
    if(Math.abs(ax)>.7&&!h.snap){h.snap=true;const cam=new V3();camera.getWorldPosition(cam);const a=-Math.sign(ax)*Math.PI/6;
      rig.position.sub(cam).applyAxisAngle(new V3(0,1,0),a).add(cam);rig.rotation.y+=a}else if(Math.abs(ax)<.3)h.snap=false}
  for(const h of XR.hands){
    if(h.held){const p=new V3().setFromMatrixPosition(h.grip.matrixWorld);h.held.p.copy(p);h.held.m.position.copy(p);h.hist.push({p:p.clone(),t:performance.now()/1000});if(h.hist.length>6)h.hist.shift()}
    if(h.aim){XR.owner=h;const m=h.ctl.matrixWorld,o=new V3().setFromMatrixPosition(m),v=new V3(0,0,-1).transformDirection(m).multiplyScalar(8);
      let p=o.clone(),hit=null;const pts=[p.clone()];
      for(let n=0;n<58;n++){const q=p.clone().addScaledVector(v,.03);v.y-=9.81*.03;
        ray.set(p,q.clone().sub(p).normalize());ray.far=p.distanceTo(q);const r=ray.intersectObjects(teleTargets,true)[0];ray.far=Infinity;
        if(r){hit=r;pts.push(r.point.clone());break}p=q;pts.push(p.clone());if(p.y<-3)break}
      for(let i=0;i<60;i++){const q=pts[Math.min(i,pts.length-1)];XR.arcPts.set([q.x,q.y,q.z],i*3)}
      XR.arc.geometry.attributes.position.needsUpdate=true;XR.arc.visible=true;
      const ok=hit&&hit.point.y>-.05&&(hit.face?hit.face.normal.clone().transformDirection(hit.object.matrixWorld).y>.6:true);
      XR.arc.material.color.set(ok?0xf4f7f6:0xd4664a);XR.ring.visible=!!ok;XR.target=ok?hit.point.clone():null;if(ok)XR.ring.position.copy(hit.point).add(new V3(0,.02,0))}}
}
renderer.xr.addEventListener('sessionstart',()=>{fly=null;controls.enabled=false;camera.position.set(0,0,0);camera.rotation.set(0,0,0);
  const p=new V3(2.2,0,4.8);p.y=H(p.x,p.z);rig.position.copy(p);rig.rotation.y=.35;});
renderer.xr.addEventListener('sessionend',()=>{controls.enabled=true});

let last=performance.now()/1000,acc=0;
function frame(){
  const now=performance.now()/1000;let dt=Math.min(now-last,1/20);last=now;
  S.wind+=(S.windT-S.wind)*Math.min(1,dt*.5);
  S.time+=dt;
  U.uTime.value=S.time;U.uWind.value=S.wind;
  acc+=dt;let n=0;while(acc>1/120&&n<6){physics(1/120);acc-=1/120;n++}
  if(HAM.mesh)stepHammock(dt);if(boat.grp)stepBoat(dt);if(fish.im)stepFish(dt);stepGulls(dt);
  if(HUT.lantern){HUT.lantern.rotation.z=Math.sin(S.time*1.1)*.05*S.wind;HUT.lantern.rotation.x=Math.sin(S.time*.8+1)*.04*S.wind;
    if(cur==='night')HUT.lamp.intensity=7*(1+.04*Math.sin(now*9)+.03*Math.sin(now*23))}
  if(renderer.xr.isPresenting)stepXR(dt);else{stepFly(dt);controls.update()}
  renderer.render(scene,camera);
}

async function start(){
  const sky=Q.get('time')||'day';
  const first=loadSky(sky);
  buildHut();
  makePalm(-9.5,-3.5,8.6,2.9,.42,0);
  makePalm(7.5,-7.5,7.4,-.75,.32,1.7);
  makePalm(-7.6,6.6,6.9,2.3,.3,3.1);
  makePalm(-3.6,9.6,7.6,1.8,.26,4.4);
  makePalm(4.8,-11.2,6.4,-1.4,.36,5.6);
  makePalm(8.6,4.6,7.9,.15,.22,2.6);
  for(let i=0;i<3;i++){const x=rr(-4,4),z=rr(2,6);addCoconut(new V3(x,H(x,z)+.12,z))}
  buildHammock(palms[2],palms[3]);
  buildGulls();buildFish();
  await Promise.all([buildPier(),buildRocks(),first]);
  await buildPlants();await buildProps();
  pier.box={c:pier.start.clone().addScaledVector(pier.dir,6),hw:6.2,hd:1.25,top:pier.top,rot:-Math.atan2(pier.dir.z,pier.dir.x)};
  teleTargets.push(terrain,...hutParts.filter(m=>m.userData.walk),pier.g);
  applySky(sky);
  setPressed('winds','calm');updLog();
  goView(Q.get('view')||'island',true);
  if(Q.has('at')){const [x,y,z,tx,ty,tz]=Q.get('at').split(',').map(Number);camera.position.set(x,y,z);controls.target.set(tx||0,ty||0,tz||0);controls.update()}
  setupXR();
  renderer.setAnimationLoop(frame);
  const l=document.getElementById('load');l.style.opacity=0;setTimeout(()=>l.remove(),1300);
  window.__ready=true;window.__dbg={scene,renderer,camera,WU,U,S,cache,SKY,applySky,THREE,bodies,knock,H,physics};
}
start();
