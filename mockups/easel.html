<title>The Easel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Atkinson+Hyperlegible:wght@400;700&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: the apartment in 3D on the left, the game's own window (the Codec menu's green on black) on the right; the steps of the system across the top, the rules under them. One look: a painter's room after dark. */
:root{
  --bg:#12100d; --surface:#1b1814; --line:#3a332a; --fg:#ece5d8; --muted:#a69c8c; --ochre:#d9a441; --ok:#7dffa8; --bad:#ff8a7a;
  --g:#7dffa8; --g2:#3aa866; --gk:#020a06; --gb:#031a0d; --go:#d8ffe4;
  --display:"Young Serif",Georgia,"Times New Roman",serif; --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"Share Tech Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
.wrap{max-width:1320px;margin:0 auto;display:grid;gap:16px}
header{display:grid;gap:12px}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
h1{font:400 34px/1.05 var(--display);margin:0;letter-spacing:.01em;text-wrap:balance}
.lede{margin:0;color:var(--muted);max-width:70ch}
.steps{display:flex;flex-wrap:wrap;gap:6px}
.steps button{font:13px var(--mono);letter-spacing:1.5px;color:var(--fg);background:var(--surface);border:1px solid var(--line);padding:8px 12px;cursor:pointer}
.steps button b{color:var(--ochre);font-weight:400;margin-right:6px}
.steps button[aria-selected="true"]{border-color:var(--ochre);color:var(--ochre)}
.steps button:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
.grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
.stage{position:relative;height:clamp(340px,64vh,660px);background:#0b0a08;border:1px solid var(--line);overflow:hidden}
#three{position:absolute;inset:0}
#three canvas{display:block;width:100%;height:100%}
.hud{position:absolute;left:12px;top:10px;font:13px var(--mono);letter-spacing:1px;color:var(--go);text-shadow:0 1px 2px #000;display:grid;gap:2px;pointer-events:none}
.hud .k{color:var(--g)}
.log{position:absolute;left:12px;bottom:10px;right:12px;font:13px var(--mono);letter-spacing:1px;color:var(--go);text-shadow:0 1px 2px #000;display:grid;gap:2px;pointer-events:none}
.log div{animation:fade 6s forwards}
@keyframes fade{0%,70%{opacity:1}100%{opacity:.35}}
.stagehint{position:absolute;right:12px;top:10px;font:12px var(--mono);color:var(--muted);text-align:right;max-width:46%;pointer-events:none}
/* the game's window */
.win{background:repeating-linear-gradient(0deg,rgba(125,255,168,.05) 0 1px,transparent 1px 3px),var(--gk);box-shadow:0 0 0 2px var(--g2);color:var(--g);font:14px/1.45 var(--mono);letter-spacing:1px;text-transform:uppercase;padding:12px;max-height:clamp(340px,64vh,660px);overflow:auto;display:grid;gap:10px;align-content:start}
.win .ttl{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--g);font-size:18px;letter-spacing:3px}
.win .ttl span+span{color:var(--g2);font-size:13px;letter-spacing:1px}
.pane{background:rgba(3,26,13,.85);box-shadow:inset 0 0 0 2px var(--g2);padding:10px;display:grid;gap:8px;min-width:0}
.win h3{font:inherit;font-size:12px;color:var(--g2);margin:0;padding-bottom:4px;border-bottom:2px solid var(--g2);letter-spacing:2px}
.win .b{font:inherit;color:var(--g);background:transparent;border:0;padding:4px 7px;cursor:pointer;text-transform:uppercase;letter-spacing:1px}
.win .b:hover,.win .b[aria-pressed="true"]{color:var(--gk);background:var(--g)}
.win .b:disabled{color:#245c3a;cursor:not-allowed;background:transparent}
.win .b.hot{box-shadow:inset 0 0 0 2px var(--g)}
.row{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.dim{color:var(--g2)}
.go{color:var(--go)}
.warn{color:#ffd27a}
.red{color:var(--bad)}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl td{padding:3px 4px;border-bottom:1px solid #0d3a1f;vertical-align:middle}
.tbl td.n{text-align:right;white-space:nowrap}
.win input[type=text],.win input[type=number]{font:inherit;color:var(--go);background:var(--gb);border:0;box-shadow:inset 0 0 0 2px var(--g2);padding:6px 8px;width:100%;text-transform:uppercase;letter-spacing:1px}
.win input[type=range]{accent-color:var(--g);width:100%}
.ed-wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
#ed{width:100%;image-rendering:pixelated;cursor:crosshair;background:#000;touch-action:none;box-shadow:0 0 0 2px var(--g2)}
.pal{display:grid;grid-template-columns:repeat(16,1fr);gap:1px;background:#000;padding:1px}
.pal button{aspect-ratio:1;border:0;padding:0;cursor:pointer;min-width:0}
.pal button.on{outline:2px solid #fff;outline-offset:-1px;position:relative;z-index:1}
.pal button:disabled{opacity:.12;cursor:not-allowed}
.sw{display:inline-block;width:16px;height:16px;vertical-align:-3px;box-shadow:0 0 0 1px var(--g2)}
.meter{height:8px;background:#0d3a1f;position:relative}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--g)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.card{background:var(--gb);box-shadow:inset 0 0 0 2px #0d3a1f;padding:8px;display:grid;gap:6px;align-content:start;min-width:0}
.card canvas{width:100%;image-rendering:pixelated;background:#000}
.card .t{color:var(--go);font-size:12px;line-height:1.3;overflow-wrap:anywhere}
.card .a{color:var(--g2);font-size:11px}
.card.sel{box-shadow:inset 0 0 0 2px var(--g)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tick{color:var(--gk);background:var(--g);padding:0 6px}
.untick{color:var(--g2);box-shadow:inset 0 0 0 1px var(--g2);padding:0 6px}
.prov{display:grid;gap:3px;font-size:12px}
.prov div::before{content:'· ';color:var(--g2)}
/* the notes under it */
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.note{background:var(--surface);border:1px solid var(--line);padding:14px 16px;display:grid;gap:8px;align-content:start;min-width:0}
.note h2{font:400 19px/1.2 var(--display);margin:0;text-wrap:balance}
.note ul{margin:0;padding-left:18px;display:grid;gap:5px;color:var(--fg)}
.note p{margin:0;color:var(--muted)}
.note code{font:13px var(--mono);color:var(--ochre)}
.note .lab{font:12px var(--mono);letter-spacing:2px;color:var(--ochre);text-transform:uppercase}
.choice{display:grid;gap:4px}
.choice b{color:var(--fg)}
.choice span{color:var(--muted)}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}.stage{height:min(58vh,420px)}.win{max-height:none}.stagehint{display:none}}
@media (max-width:480px){h1{font-size:27px}.two{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.log div{animation:none}}
</style>

<div class="wrap">
  <header>
    <div class="brand"><h1>The Easel</h1><p class="lede">A mockup of painting and drawing in THE MARKET: buy supplies, paint at an easel, sign it, frame and hang it in your apartment, give it, trade it or sell it. Everything here works; the numbers are examples.</p></div>
    <nav class="steps" role="tablist" aria-label="Steps of the system" id="steps"></nav>
  </header>
  <main class="grid">
    <section class="stage" aria-label="Your apartment in 3D">
      <div id="three"></div>
      <div class="hud" id="hud"></div>
      <p class="stagehint" id="hint">DRAG TO LOOK ROUND</p>
      <div class="log" id="log" aria-live="polite"></div>
    </section>
    <section class="win" id="win" aria-live="polite"></section>
  </main>
  <section class="notes" id="notes"></section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(()=>{
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>'$'+Math.round(n).toLocaleString('en-US');

/* ---------- the palette: the spray can's 256 colours (159f-spray), one palette for all player art ---------- */
const hsl=(h,s,l)=>{ const f=n=>{ const k=(n+h*12)%12, a=s*Math.min(l,1-l); return l-a*Math.max(-1,Math.min(k-3,9-k,1)); }; return [f(0),f(8),f(4)].map(v=>Math.round(v*255)); };
const PAL=[]; for(let i=0;i<256;i++){ const r=i>>4,k=i&15; PAL.push(r===0?[Math.round(k/15*255),Math.round(k/15*255),Math.round(k/15*255)]:hsl(k/16,.85,.18+(r-1)/14*.68)); }
const GREY=i=>i<16, PRIMER=14;
const near=(r,g,b,greys)=>{ let bi=0,bd=1e9; for(let i=0;i<(greys?16:256);i++){ const p=PAL[i], d=(p[0]-r)**2*.3+(p[1]-g)**2*.59+(p[2]-b)**2*.11; if(d<bd){bd=d;bi=i;} } return bi; };
const css=i=>`rgb(${PAL[i].join(',')})`;
const mixIdx=(a,b,t)=>{ const A=PAL[a],B=PAL[b]; return near(A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t); };

/* ---------- seeded noise for the example paintings ---------- */
const rng=s=>()=>{ s|=0; s=s+0x6D2B79F5|0; let t=Math.imul(s^s>>>15,1|s); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };
const lerp=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
function make(w,h,seed,fn){ const px=new Uint8Array(w*h).fill(PRIMER), R=rng(seed); const put=(x,y,c,j=10)=>{ x=Math.round(x); y=Math.round(y); if(x<0||y<0||x>=w||y>=h)return; px[y*w+x]=near(c[0]+(R()-.5)*j,c[1]+(R()-.5)*j,c[2]+(R()-.5)*j); }; fn(put,w,h,R); return px; }
const GEN={
  moon:(put,w,h,R)=>{ const hz=Math.round(h*.56); for(let y=0;y<hz;y++)for(let x=0;x<w;x++)put(x,y,lerp([12,16,44],[52,62,104],y/hz),5);
    for(let i=0;i<w*.5;i++)put(R()*w,R()*hz*.8,[230,230,210],0);
    const mx=w*.7,my=h*.22,mr=w*.085; for(let y=0;y<hz;y++)for(let x=0;x<w;x++){ const d=Math.hypot(x-mx,y-my); if(d<mr)put(x,y,[244,232,186],6); else if(d<mr*1.9&&R()<.5)put(x,y,[80,86,130],10); }
    for(let y=hz;y<hz+3;y++)for(let x=0;x<w;x++)put(x,y,[22,24,32],6);
    for(let i=0;i<w*.35;i++)put(R()*w,hz+R()*2,[250,210,110],0);
    for(let y=hz+3;y<h;y++)for(let x=0;x<w;x++)put(x,y,lerp([20,34,60],[6,12,26],(y-hz)/(h-hz)),5);
    for(let y=hz+3;y<h;y++){ const sp=1+(y-hz)*.22; for(let k=0;k<3;k++)if(R()<.7)put(mx+(R()-.5)*sp*2,y,[226,210,150],10); }
    for(let x=2;x<w*.32;x+=4){ for(let y=h*.62;y<h;y++)put(x,y,[30,24,20],4); } for(let x=0;x<w*.34;x++)put(x,h*.64,[40,30,24],4); },
  pigeon:(put,w,h,R)=>{ for(let y=0;y<h;y++)for(let x=0;x<w;x++)put(x,y,lerp([150,170,214],[252,186,140],y/(h*.7)),16);
    for(let y=Math.round(h*.72);y<h;y++)for(let x=0;x<w;x++)put(x,y,[96,70,60],12); for(let x=0;x<w;x++)put(x,h*.72,[60,44,40],4);
    const cx=w*.48,cy=h*.58; for(let y=0;y<h;y++)for(let x=0;x<w;x++){ if(((x-cx)/(w*.2))**2+((y-cy)/(h*.12))**2<1)put(x,y,[120,124,140],14); if(Math.hypot(x-(cx+w*.15),y-(cy-h*.13))<w*.07)put(x,y,[110,116,134],10); }
    put(cx+w*.17,cy-h*.15,[250,140,40],0); put(cx+w*.23,cy-h*.12,[230,190,120],0); for(let x=cx-w*.06;x<cx+w*.12;x++)put(x,cy-h*.02,[90,140,120],8); },
  castle:(put,w,h,R)=>{ for(let y=0;y<h;y++)for(let x=0;x<w;x++)put(x,y,lerp([120,136,130],[176,186,176],y/h),14);
    const sil=x=>{ const t=x/w; let top=h*.5; if(t>.15&&t<.3)top=h*.28; if(t>.68&&t<.84)top=h*.24; if(t>.42&&t<.58)top=h*.36; if((Math.floor(x)%3)===0)top+=2; return top; };
    for(let x=0;x<w;x++)for(let y=Math.round(sil(x));y<h*.86;y++)put(x,y,[62,70,72],10);
    for(let y=Math.round(h*.86);y<h;y++)for(let x=0;x<w;x++)put(x,y,[70,92,62],12);
    for(let i=0;i<w*h*.08;i++)put(R()*w,h*.45+R()*h*.4,[190,198,190],8); put(w*.22,h*.36,[250,200,90],0); put(w*.76,h*.32,[250,200,90],0); },
  mush:(put,w,h,R)=>{ for(let y=0;y<h;y++)for(let x=0;x<w;x++)put(x,y,lerp([20,48,30],[40,80,44],y/h),16);
    const cx=w/2,cy=h*.48,r=w*.34; for(let y=0;y<h;y++)for(let x=0;x<w;x++){ if(y<cy&&Math.hypot((x-cx)/r,(y-cy)/(r*.8))<1)put(x,y,[200,40,36],16); if(y>=cy&&y<h*.86&&Math.abs(x-cx)<w*.09+(y-cy)*.05)put(x,y,[236,224,196],10); }
    for(let i=0;i<9;i++){ const a=Math.PI*(.1+.8*R()), d=r*(.3+.55*R()); const x=cx+Math.cos(a)*d, y=cy-Math.sin(a)*d*.8; put(x,y,[250,250,240],0); put(x+1,y,[250,250,240],0); }
    for(let x=0;x<w;x++)for(let y=Math.round(h*.86);y<h;y++)put(x,y,[60,46,30],12); },
  lamp:(put,w,h,R)=>{ for(let y=0;y<h;y++)for(let x=0;x<w;x++){ const d=Math.hypot(x-w*.36,y-h*.22); put(x,y,lerp([250,206,110],[18,20,36],Math.min(1,d/(w*.45))),12); }
    for(let y=Math.round(h*.2);y<h*.8;y++){ put(w*.36,y,[16,16,20],2); put(w*.36+1,y,[30,30,34],2); } for(let x=-2;x<=2;x++)put(w*.36+x,h*.2,[255,236,170],0);
    for(let y=Math.round(h*.8);y<h;y++)for(let x=0;x<w;x++)put(x,y,[28,30,40],10);
    for(let y=Math.round(h*.8);y<h;y+=2)for(let k=0;k<2;k++)put(w*.36+(R()-.5)*8,y,[220,180,100],10); for(let x=w*.6;x<w*.95;x++)for(let y=h*.5;y<h*.8;y++)put(x,y,[40,34,46],8); },
  pears:(put,w,h,R)=>{ for(let y=0;y<h;y++)for(let x=0;x<w;x++)put(x,y,[70,52,42],14); for(let y=Math.round(h*.68);y<h;y++)for(let x=0;x<w;x++)put(x,y,[150,104,64],14);
    [[.3,.55],[.52,.5],[.72,.58]].forEach(([fx,fy],k)=>{ const cx=w*fx,cy=h*fy; for(let y=0;y<h;y++)for(let x=0;x<w;x++){ if(Math.hypot(x-cx,(y-cy)*1.1)<w*.1||Math.hypot(x-cx,y-(cy-h*.1))<w*.06)put(x,y,k===1?[196,170,60]:[160,184,70],18); } put(cx,cy-h*.19,[70,50,30],0); put(cx,cy-h*.2,[70,50,30],0); put(cx-w*.03,cy-h*.06,[240,236,170],0); }); }
};
let uid=1;
const art=(o)=>Object.assign({id:'art-'+(uid++),w:48,h:48,medium:'OIL',kind:'PAINTING',frame:'',signed:true,admirers:0,prov:[]},o);

/* ---------- the player, the pack, the world (examples) ---------- */
const S={ step:'paint', cash:1240, skill:34.2, me:'BRALYNN', apt:201,
  supply:{oil:3412,water:2650,pencil:2800,charcoal:1600},
  pack:{canvasS:1,canvasM:2,canvasL:0,canvasXL:0,sketch:1,pine:1,oak:1,gilt:0},
  easel:null, works:[], hung:[], undo:[], redo:[], trade:null, sellTab:'dealer', hangSel:null, hangFrame:'oak', sold:[] };
const RANKS=[[100,'GRANDMASTER'],[90,'MASTER'],[80,'ADEPT'],[70,'EXPERT'],[50,'JOURNEYMAN'],[30,'APPRENTICE'],[0,'NOVICE']], rank=v=>RANKS.find(r=>v>=r[0])[1];
const SIZES={S:[32,32,'SMALL CANVAS',4,0],M:[48,48,'MEDIUM CANVAS',8,0],L:[64,48,'LARGE CANVAS',14,50],XL:[96,64,'GRAND CANVAS',30,80],SK:[32,32,'SKETCHBOOK PAGE',0,0]};
const FRAMES={'':['NO FRAME',0,null],pine:['PINE FRAME',3,0xc89a5a],oak:['OAK FRAME',10,0x6e4224],gilt:['GILT FRAME',40,0xc9a250]};
const MEDIA={oil:['OIL','opaque: covers what is under it'],water:['WATERCOLOUR','see-through: each wash mixes with what is under it'],pencil:['PENCIL','greys, one pixel, a drawing'],charcoal:['CHARCOAL','greys, soft and broken, a drawing']};

const pigeon=art({title:'PIGEON AT DAWN',artist:'MOTHGIRL',px:make(48,48,7,GEN.pigeon),frame:'pine',admirers:17,prov:['PAINTED BY MOTHGIRL (APT 214) · 29 OCT 2026','GIVEN TO BRALYNN · 1 NOV 2026']});
const castle=art({title:'THE CASTLE IN FOG',artist:'OLD KETTLE',w:64,h:48,px:make(64,48,11,GEN.castle),medium:'WATERCOLOUR',frame:'gilt',admirers:88,prov:['PAINTED BY OLD KETTLE (APT 230) · 27 OCT 2026','CONSIGNED AT THE GALLERY · $600','BOUGHT BY BRALYNN · $600 · 2 NOV 2026']});
S.works=[pigeon,castle];
S.hung=[{a:pigeon,x:-2.3,y:1.75},{a:castle,x:-0.6,y:1.95}];
const wip={id:'wip',w:48,h:48,px:make(48,48,3,GEN.moon),title:'',artist:S.me,medium:'OIL',kind:'PAINTING',frame:'',signed:false,admirers:0,prov:[],strokes:212};
for(let y=34;y<48;y++)for(let x=27;x<48;x++)wip.px[y*48+x]=PRIMER;
S.easel=wip;
const GALLERY=[
  art({title:'LAMP ON MARKET ST',artist:'BUTTONS',px:make(48,48,21,GEN.lamp),admirers:41,price:320,frame:'oak'}),
  art({title:'THE MUSHROOM SELLER',artist:'RAGPICKER',w:32,h:32,px:make(32,32,5,GEN.mush),admirers:12,price:95,medium:'WATERCOLOUR'}),
  art({title:'THREE PEARS',artist:'OLD KETTLE',w:64,h:48,px:make(64,48,9,GEN.pears),admirers:203,price:1800,frame:'gilt'}),
  art({title:'PIGEON II',artist:'MOTHGIRL',px:make(48,48,8,GEN.pigeon),admirers:9,price:140,frame:'pine'})];
GALLERY.forEach(g=>g.prov=[`PAINTED BY ${g.artist} · 3 NOV 2026`,`CONSIGNED AT THE GALLERY · ${money(g.price)}`]);

/* ---------- a painting as pixels ---------- */
function pic(p){ if(!p._cv){ p._cv=document.createElement('canvas'); } const c=p._cv; if(c.width!==p.w||c.height!==p.h){ c.width=p.w; c.height=p.h; } const x=c.getContext('2d'), im=x.createImageData(p.w,p.h); for(let i=0;i<p.w*p.h;i++){ const q=PAL[p.px[i]]; im.data[i*4]=q[0]; im.data[i*4+1]=q[1]; im.data[i*4+2]=q[2]; im.data[i*4+3]=255; } x.putImageData(im,0,0); if(p._tex)p._tex.needsUpdate=true; return c; }
const cover=p=>{ let n=0; for(const v of p.px)if(v!==PRIMER)n++; return n/p.px.length; };
const colours=p=>new Set(p.px).size-(p.px.includes(PRIMER)?1:0);
function thumb(p){ const c=document.createElement('canvas'); c.width=p.w; c.height=p.h; c.getContext('2d').drawImage(pic(p),0,0); c.setAttribute('role','img'); c.setAttribute('aria-label',p.title||'painting'); return c; }

/* ---------- the log and the hud ---------- */
function say(t,cls){ const d=document.createElement('div'); d.textContent=t; if(cls)d.className=cls; const L=$('#log'); L.appendChild(d); while(L.children.length>4)L.firstChild.remove(); }
function hud(){ $('#hud').innerHTML=`<div><span class="k">CASH</span> ${money(S.cash)}</div><div><span class="k">PAINTING</span> ${S.skill.toFixed(1)} · ${rank(S.skill)}</div><div><span class="k">PACK</span> ${S.works.length} WORKS · ${S.pack.canvasS+S.pack.canvasM+S.pack.canvasL+S.pack.canvasXL} CANVASES</div>`; }

/* ---------- 3D: the apartment's corner, the easel, the wall ---------- */

  else if(ED.tool==='smudge'){ const x=i%p.w,y=(i/p.w)|0; let r=0,g=0,b=0,k=0; for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){ const xx=x+dx,yy=y+dy; if(xx<0||yy<0||xx>=p.w||yy>=p.h)continue; const q=PAL[p.px[yy*p.w+xx]]; r+=q[0];g+=q[1];b+=q[2];k++; } n=near(r/k,g/k,b/k); }
  else if(ED.medium==='water')n=mixIdx(old,ED.c,old===PRIMER?.75:.5);
  else if(ED.medium==='charcoal'){ if(T.r()<.35)return; n=ED.c; }
  else n=ED.c;
  if(n===old)return; const use=ED.tool!=='erase'&&ED.tool!=='smudge'; if(use){ const s=SUP[ED.medium]; if(S.supply[s]<=0){ T.empty=true; return; } S.supply[s]--; } p.px[i]=n; T.changed++; }
const RAD=[0,.5,1.2,2.3,4.2];
function dab(x,y){ const p=S.easel, r=ED.medium==='pencil'?.5:RAD[ED.size], k=Math.ceil(r); for(let dy=-k;dy<=k;dy++)for(let dx=-k;dx<=k;dx++){ if(dx*dx+dy*dy>r*r+.01&&!(dx===0&&dy===0))continue; const xx=x+dx,yy=y+dy; if(xx<0||yy<0||xx>=p.w||yy>=p.h)continue; px(yy*p.w+xx); } }
function seg(a,b){ let [x0,y0]=a; const [x1,y1]=b, dx=Math.abs(x1-x0), dy=-Math.abs(y1-y0), sx=x0<x1?1:-1, sy=y0<y1?1:-1; let e=dx+dy; for(let n=0;n<400;n++){ dab(x0,y0); if(x0===x1&&y0===y1)break; const e2=2*e; if(e2>=dy){ e+=dy; x0+=sx; } if(e2<=dx){ e+=dx; y0+=sy; } } }
function fill(x,y){ const p=S.easel, from=p.px[y*p.w+x], st=[[x,y]], seen=new Uint8Array(p.w*p.h); while(st.length){ const [a,b]=st.pop(); if(a<0||b<0||a>=p.w||b>=p.h)continue; const i=b*p.w+a; if(seen[i]||p.px[i]!==from)continue; seen[i]=1; px(i); st.push([a+1,b],[a-1,b],[a,b+1],[a,b-1]); } }
function drawEd(){ const p=S.easel; if(!edCtx||!p)return; edCtx.imageSmoothingEnabled=false; edCtx.drawImage(pic(p),0,0,p.w*SC,p.h*SC);
  if(ED.ref){ const rp={w:48,h:48,px:REFV}; edCtx.globalAlpha=.32; edCtx.drawImage(pic(rp),0,0,p.w*SC,p.h*SC); edCtx.globalAlpha=1; }
  if(ED.grid){ edCtx.strokeStyle='rgba(0,0,0,.25)'; edCtx.lineWidth=1; edCtx.beginPath(); for(let x=0;x<=p.w;x++){ edCtx.moveTo(x*SC+.5,0); edCtx.lineTo(x*SC+.5,p.h*SC); } for(let y=0;y<=p.h;y++){ edCtx.moveTo(0,y*SC+.5); edCtx.lineTo(p.w*SC,y*SC+.5); } edCtx.stroke(); } }
function after(){ texOf(S.easel); stats(); hud(); }
function stats(){ const p=S.easel, el=$('#stats'); if(!el||!p)return; const s=SUP[ED.medium], full={oil:4000,water:3000,pencil:3000,charcoal:2000}[s];
  el.innerHTML=`<h3>THIS ${p.kind}</h3><table class="tbl"><tr><td>${MEDIA[ED.medium][0]} LEFT</td><td class="n">${S.supply[s].toLocaleString('en-US')}</td><td style="width:40%"><div class="meter"><i style="width:${Math.min(100,S.supply[s]/full*100)}%"></i></div></td></tr><tr><td>COVERED</td><td class="n">${Math.round(cover(p)*100)}%</td><td class="dim">UNDER 15%: NOBODY BUYS IT</td></tr><tr><td>COLOURS</td><td class="n">${colours(p)}</td><td></td></tr><tr><td>STROKES</td><td class="n">${p.strokes||0}</td><td></td></tr></table>

/* 4 FRAME & HANG */

  `<div class="pane"><h3>FROM YOUR PACK</h3>${loose.length?'<div class="cards" id="loose"></div>':'<div class="dim">EVERYTHING YOU OWN IS ON THE WALL.</div>'}</div>
  ${sel?`<div class="pane"><h3>FRAME</h3><div class="row">${Object.keys(FRAMES).map(k=>{ const have=k===''||S.pack[k]>0||sel.frame===k; return `<button class="b" data-f="${k}" aria-pressed="${S.hangFrame===k}" ${have?'':'disabled'}>${FRAMES[k][0]}${k&&sel.frame!==k?' ('+(S.pack[k]||0)+')':''}</button>`; }).join('')}</div>
   <div class="dim" style="font-size:12px">${sel.frame?'IT IS FRAMED IN '+FRAMES[sel.frame][0]+'. A NEW FRAME SWAPS IT; THE OLD ONE GOES TO YOUR PACK.':'FRAMES COME FROM THE ART SHOP. A FRAME ADDS ITS PRICE TO WHAT IT IS WORTH.'}</div>

  <div class="pane"><h3>ON YOUR WALL</h3><table class="tbl">${S.hung.map((h,i)=>`<tr><td class="go">“${esc(h.a.title)}”<div class="dim" style="font-size:11px">${h.a.artist} · ${FRAMES[h.a.frame||''][0]} · ♥ ${h.a.admirers}</div></td><td class="n"><button class="b" data-ins="${i}">LOOK</button><button class="b" data-down="${i}">TAKE DOWN</button></td></tr>`).join('')||'<tr><td class="dim">NOTHING YET.</td></tr>'}</table>
   <div class="dim" style="font-size:12px">VISITORS TO YOUR APARTMENT SEE THEM AND CAN ADMIRE (♥) ONE ONCE A DAY.</div></div><div id="insp"></div>`;
  const L=$('#loose'); if(L)loose.forEach(w=>L.appendChild(cardOf(w,w===sel,()=>{ S.hangSel=w; wHang(); })));

function hangIt(x,y){ const p=S.hangSel; if(!p)return; const f=S.hangFrame; if(f!==(p.frame||'')){ if(f&&!(S.pack[f]>0))return say('YOU HAVE NO '+FRAMES[f][0]+'.','red'); if(f)S.pack[f]--; if(p.frame)S.pack[p.frame]=(S.pack[p.frame]||0)+1; p.frame=f; }

const RANK_K={NOVICE:1,APPRENTICE:1.2,JOURNEYMAN:1.5,EXPERT:2,ADEPT:2.5,MASTER:3.5,GRANDMASTER:5};
function appraise(p){ const base={1024:20,2304:40,3072:80,6144:160}[p.w*p.h]||40, cv=cover(p), cols=colours(p), artistSkill=p.artist===S.me?S.skill:p.artist==='OLD KETTLE'?92:p.artist==='MOTHGIRL'?58:40;

  let v=0; rows.forEach(([,n,o])=>{ v=o==='+'?v+n:v*n; }); return {rows,value:cv<.15?0:Math.round(v),blank:cv<.15}; }

    if(sel){ const a=appraise(sel), offer=Math.round(a.value*.6), d=document.createElement('div'); d.className='pane';

      if(tab==='dealer'&&!a.blank)$('#sellNow').onclick=()=>{ S.cash+=offer; sel.prov.push(`SOLD TO THE DEALER · ${money(offer)} · 4 NOV 2026`); S.works=S.works.filter(x=>x!==sel); const g=Object.assign(sel,{price:a.value}); g.prov.push('ON SALE AT THE GALLERY · '+money(a.value)); GALLERY.unshift(g); S.skill=Math.min(100,S.skill+.4); say(`THE DEALER PAID ${money(offer)} FOR “${sel.title}”.`); hud(); wSell(); };
      if(tab==='consign'){ const r=$('#cp'), upd=()=>{ S.cprice=+r.value; $('#cpv').textContent=money(+r.value); $('#cpn').textContent=`YOU GET ${money(r.value*.9)} WHEN IT SELLS (HE KEEPS 10%). HE THINKS IT IS WORTH ${money(a.value)}.`; }; r.oninput=upd; upd();
        $('#consign').onclick=()=>{ if(a.blank)return; const price=+r.value; sel.price=price; sel.consigned=true; sel.prov.push(`CONSIGNED AT THE GALLERY · ${money(price)} · 4 NOV 2026`); S.works=S.works.filter(x=>x!==sel); GALLERY.unshift(sel); say(`“${sel.title}” HANGS IN THE GALLERY AT ${money(price)}.`); setTimeout(()=>{ if(!GALLERY.includes(sel))return; GALLERY.splice(GALLERY.indexOf(sel),1); sel.prov.push(`BOUGHT BY BUTTONS · ${money(price)}`); S.cash+=price*.9; say(`LETTER: “${sel.title}” SOLD TO BUTTONS. ${money(price*.9)} IS IN YOUR MAILBOX.`,'go'); hud(); if(S.step==='sell')wSell(); },6000); wSell(); }; } } }
  else { const d=document.createElement('div'); d.className='pane'; d.innerHTML='<h3>ON THE GALLERY\'S WALLS</h3>'; const cs=document.createElement('div'); cs.className='cards'; GALLERY.forEach(g=>{ const mineC=g.artist===S.me; const c=cardOf(g,false,()=>inspect(g,'#insp'),`<div class="a">♥ ${g.admirers} · ${money(g.price)}</div><div class="row"><button class="b" data-buyg="${g.id}" ${mineC?'disabled':''}>${mineC?'YOURS':'BUY'}</button><button class="b" data-adm="${g.id}">♥</button></div>`); cs.appendChild(c); }); d.appendChild(cs); B.appendChild(d);
    B.querySelectorAll('[data-buyg]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); const g=GALLERY.find(x=>x.id===b.dataset.buyg); if(S.cash<g.price)return say('YOU CANNOT AFFORD THAT.','red'); S.cash-=g.price; GALLERY.splice(GALLERY.indexOf(g),1); g.prov.push(`BOUGHT BY ${S.me} · ${money(g.price)} · 4 NOV 2026`); S.works.push(g); say(`BOUGHT “${g.title}” BY ${g.artist}. IT IS IN YOUR PACK.`); hud(); wSell(); });
    B.querySelectorAll('[data-adm]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); const g=GALLERY.find(x=>x.id===b.dataset.adm); if(g._adm)return say('ONCE A DAY FOR EACH PICTURE.'); g._adm=1; g.admirers++; say(`YOU ADMIRE “${g.title}”. ${g.artist} GAINS A LITTLE FAME.`); wSell(); }); } }

/* THE SKILL */
const UNLOCK=[[0,'NOVICE','SMALL AND MEDIUM CANVASES, THE SKETCHBOOK; OIL, WATERCOLOUR, PENCIL, CHARCOAL; BRUSH 1–2, LINE, FILL, PICK, SCRAPE.'],[30,'APPRENTICE','SMUDGE; BRUSH 3.'],[50,'JOURNEYMAN','LARGE CANVAS 64×48; BRUSH 4.'],[70,'EXPERT','CONSIGN AT THE GALLERY AT YOUR OWN PRICE.'],[80,'ADEPT','GRAND CANVAS 96×64; COMMISSIONS: A PLAYER ORDERS A PICTURE FROM YOU, PAYS ON DELIVERY.'],[90,'MASTER','PRINTS: A NUMBERED EDITION OF 10 FROM A SIGNED ORIGINAL.'],[100,'GRANDMASTER','THE MUSEUM HANGS ONE OF YOUR WORKS ON ITS PLAYERS\' FLOOR.']];
function wSkill(){ W().innerHTML=ttl('SKILLS','PAINTING · '+S.skill.toFixed(1))+
  `<div class="pane"><h3>PAINTING · ${rank(S.skill)}</h3><div class="meter"><i style="width:${S.skill}%"></i></div><table class="tbl">${UNLOCK.map(([v,n,t])=>`<tr><td class="${S.skill>=v?'go':'dim'}" style="white-space:nowrap">${v} ${n}</td><td class="${S.skill>=v?'':'dim'}" style="font-size:12px">${t}</td></tr>`).join('')}</table></div>
  <div class="pane"><h3>HOW IT RISES</h3><table class="tbl"><tr><td>SIGNING A WORK</td><td class="n">+0.2 TO 2.5</td></tr><tr><td class="dim" colspan="2" style="font-size:12px">MORE FOR MORE OF THE CANVAS COVERED, MORE COLOURS, MORE STROKES. A BLANK ONE TEACHES NOTHING.</td></tr><tr><td>PAINTING OUTDOORS (FIELD EASEL)</td><td class="n">× 1.5</td></tr><tr><td>A SALE OR A TRADE</td><td class="n">+0.3 TO 0.4</td></tr><tr><td>SOMEONE ADMIRES YOUR WORK</td><td class="n">+0.05</td></tr></table></div>
  <div class="pane"><h3>THE BOOK: YOUR WORKS</h3><div class="cards" id="bk"></div></div>`;
  const bk=$('#bk'); [...S.works,...S.sold].filter(w=>w.artist===S.me).forEach(w=>bk.appendChild(cardOf(w,false,null))); if(!bk.children.length)bk.innerHTML='<div class="dim">YOU HAVE NOT SIGNED ANYTHING YET. FINISH THE MOON ON THE EASEL.</div>'; }

/* THE PLAN */
function wPlan(){ W().innerHTML=ttl('THE PLAN','FOR THE OWNER')+
  `<div class="pane"><h3>NEW THINGS ON THE ITEM MODEL (SHIFT+7)</h3><table class="tbl">${[['EASEL','$40','FURNITURE, DECORATE'],['FIELD EASEL','$25','CARRIED, SET UP OUTDOORS'],['OILS / WATERCOLOURS','$16 / $10','4,000 / 3,000 DABS'],['PENCIL / CHARCOAL','$1 / $2','GREYS'],['SKETCHBOOK','$5','12 PAGES 32×32'],['CANVAS S M L XL','$4 $8 $14 $30','32² 48² 64×48 96×64'],['FRAME PINE OAK GILT','$3 $10 $40','WORN BY A PAINTING'],['PAINTING / DRAWING','APPRAISED','MADE BY PLAYERS']].map(r=>`<tr><td>${r[0]}</td><td class="n">${r[1]}</td><td class="dim" style="font-size:12px">${r[2]}</td></tr>`).join('')}</table>
  <div class="dim" style="font-size:12px">SHARED FIELDS: ART (A MADE THING CARRIES ITS PICTURE'S ID), WALL (HANGS IN DECORATE), BURNABLE (CANVAS, PAPER, FRAMES: FIRE TAKES THEM).</div></div>
  <div class="pane"><h3>ONE PAINTING</h3><div style="font-size:13px">ITS PIXELS ARE BYTES IN THE SPRAY'S 256 COLOURS: 48×48 IS 2.3 KB, 96×64 IS 6 KB. KEPT ONCE ON THE SERVER BY ITS ID; YOUR PACK HOLDS ONLY THE ID, SO YOUR 2 MB SAVE NEVER FILLS WITH PICTURES. SIGNED = NEVER CHANGED. ONLY THE SERVER ADDS TO ITS HISTORY.</div></div>`; }

/* ---------- the notes under each step ---------- */
const NOTES={
 supplies:[['WHERE THEY COME FROM',['A shop counter in the art museum sells supplies: an existing character given the JOB (shopkeeper) in the character editor.','The bodega\'s BBS catalogue can sell the easel and canvases too; the drone brings them, as it does today.','Paints run out like the spray can: every pixel you lay down is a dab.']],['WHAT A PLAYER GETS TO DO',['A reason to spend money and come back: supplies wear out.','Bigger canvases open up with the skill, so there is something to work toward.','An unfinished canvas is a thing in your pack. Take it off the easel, put it back up tomorrow.']]],
 paint:[['THE EASEL',['Double-click an easel (yours in the apartment, or a field easel set up outside) with a canvas in your pack. You stand at it and paint; your arm moves.','The window is a flat 2D canvas. In 3D only the easel\'s picture changes, once a stroke ends.','THE VIEW: at a field easel, a faint copy of what is in front of you sits under the canvas to paint from (on the website, read once from the frame).']],['FOUR MEDIUMS',['OIL covers what is under it.','WATERCOLOUR mixes with what is under it: a second wash goes darker.','PENCIL is one grey pixel; CHARCOAL leaves a broken grey line. Both make a DRAWING, and work in the sketchbook anywhere, no easel needed.']],['OTHERS SEE IT',['Players near you see the canvas fill in: strokes go out through ONLINE about four times a second, only to players in sight.','Nobody else can paint on your canvas.']]],
 sign:[['ONE OF A KIND',['Signing makes it a PAINTING or DRAWING item with a title, your name, the date and the medium; your mark goes in the corner.','It can never be painted over, and there is only ever one. Its history starts with you.','It burns: a fire in your apartment can take it.']],['THE SKILL',['Signing teaches PAINTING by how much you put in: canvas covered, colours, strokes.','Under 15% covered teaches nothing and no dealer buys it, so blank canvases are worthless.']]],
 hang:[['DECORATE, AS IT IS',['A painting is a wall thing in DECORATE (T): point at a wall, green fits, red does not, the grid you already have.','Frames are bought, then put on: the frame is part of the painting from then on and adds its price to its worth.','Hung paintings are in your apartment\'s save, on the server, like the rest of your things.']],['OTHER PLAYERS',['Visitors to your apartment see your walls and can admire (♥) each picture once a day.','Admirers are the painter\'s fame: they raise what all that painter\'s work is worth.','REPORT on any picture sends it to the owner\'s TENANTS panel.']]],
 trade:[['TRADE IS FOR EVERYTHING',['This is the player trade you said yes to on 20 Oct: double-click a player → TRADE. Any item and cash, both sides tick ACCEPT, any change unticks both.','The block\'s server checks both still have what they offer and swaps both sides at once, so nothing is lost or copied.','Paintings are its first use; anything in a pack can go through it.']],['GIVE',['GIVE is a trade with nothing back. The other player still has to accept, so nobody gets things pushed on them.','Every trade or gift is written into the painting\'s history: who painted it, who owned it, what it went for.']]],
 sell:[['THREE WAYS TO SELL',['THE DEALER buys now at 60% of worth and hangs it in his gallery at full price, where any player can buy it.','CONSIGN (EXPERT): hang it in his gallery at your own price; he keeps 10% and the rest comes by mail.','To another player through TRADE, for cash.']],['WHAT IT IS WORTH',['Size, medium, how much is painted, colours, the painter\'s rank, admirers, the frame. The dealer shows his sums.','Money comes from the dealer, so it ties into the economy you already have.']]],
 skill:[['PAINTING, A NEW SKILL',['Next to MYCOLOGY, FISHING and the rest, with the same ranks, NOVICE to GRANDMASTER, and the same cap.','Each rank opens a tool, a size or a way to sell, so there is always a next thing.','Your works go into THE BOOK, like recipes and finds.']]],
 plan:[['WHAT IT TOUCHES',['Items (new kinds and fields, the item editor), the pack, DECORATE, skills, shops (the dealer\'s JOB), ONLINE (live strokes), player trade (new, for all items), the worker (the painting store, trade), fire (burnable), the owner\'s TENANTS panel (ART: hide, ban from public walls).','Editors kept in sync: item, character (the dealer buys paintings), text (the windows\' words).']],['COST',['A hung painting: one tiny texture (48×48 is 9 KB on the graphics card), 2 triangles and about 60 for a frame; drawn only when seen, dropped when you leave the room.','The painting window: nothing in 3D a frame. Live strokes: a few bytes, four times a second, only while painting near someone.','The server: 2–6 KB a painting, in a new Studio store beside Block, Post, Home and Dish.']],['IN FOUR PULL REQUESTS',['1 · easel, supplies, paint, sign, frame, hang, the dealer, the skill.','2 · player trade and give (for every item), live strokes for watchers.','3 · consign, the gallery to buy from, admiring and fame, history on INSPECT.','4 · prints, commissions, the museum\'s players\' floor.','Each ships with its test: tests/easel.cjs paints, signs and hangs; trade runs two pages through the ONLINE box.']],['YOUR CALLS',null]]
};
const CHOICES=[['Mediums','A · four (oil, watercolour, pencil, charcoal), as shown','B · one paint box and a pencil'],['Canvas sizes','A · pixel sizes 32 to 96, matching the game\'s art, as shown','B · bigger, 128 to 256 (smoother, 4–16× the storage)'],['Who sells and buys','A · a dealer and an art shop in the art museum','B · the flea market\'s TRADER buys art; the BBS sells supplies'],['Public walls (gallery, museum)','A · you approve a picture before it goes up','B · anyone hangs; you take down what is reported'],['The museum\'s players\' floor','A · yes, at GRANDMASTER','B · no, the museum keeps to its 53'],['Skill gates','A · bigger canvases and tools open with rank, as shown','B · everything open from the start; rank only sets worth']];
function notes(k){ $('#notes').innerHTML=(NOTES[k]||[]).map(([h,l])=>l?`<article class="note"><h2>${h}</h2><ul>${l.map(x=>`<li>${esc(x).replace(/(tests\/easel\.cjs)/,'<code>$1</code>')}</li>`).join('')}</ul></article>`:`<article class="note"><h2>${h}</h2><p>Six things to pick before building. Reply with a letter for each, like “A B A A A A”.</p>${CHOICES.map(([q,a,b],i)=>`<div class="choice"><span class="lab">${i+1} · ${q}</span><b>${esc(a)}</b><span>${esc(b)}</span></div>`).join('')}</article>`).join(''); }

/* ---------- start: half-way through a painting of the Hudson ---------- */
putOnEasel(); hangAll(); nav(); go('paint'); say('YOU STAND AT THE EASEL. THE MOON IS HALF DONE.');
})();
</script>
