<!doctype html>
<html><head><meta charset="utf-8"><title>Avatar faces</title>
<style>body{margin:0;background:#1b1d26;color:#e8e4d8;font:600 15px monospace}.g{display:grid;grid-template-columns:repeat(4,260px);gap:14px;padding:16px}.c{background:#2a2d38;padding:8px;text-align:center}svg{display:block;margin:auto}</style></head>
<body><div class="g" id="g"></div>
<script>
const SK='#d9a984', SD='#c4916d', SL='#e6bc9a', BR='#4a2a20', IR='#4f7a3c', LIP='#a8604e', LIPD='#7e4234';
const head=f=>`<svg width="240" height="250" viewBox="0 0 240 250">
<rect x="22" y="104" width="20" height="44" fill="${SD}"/><rect x="198" y="104" width="20" height="44" fill="${SD}"/>
<path d="M40 238 V58 Q40 20 78 20 H162 Q200 20 200 58 V238 Z" fill="${SK}"/>
<path d="M120 128 L106 172 H124 Z" fill="${SD}"/>${f}</svg>`;
const brow=(y,k=0)=>`<rect x="62" y="${y-k}" width="44" height="9" fill="${BR}" transform="rotate(${k} 84 ${y})"/><rect x="134" y="${y-k}" width="44" height="9" fill="${BR}" transform="rotate(${-k} 156 ${y})"/>`;
const both=f=>f(84)+f(156);
const F=[
 ['1 BLOCK: WHITE, IRIS, PUPIL',brow(86)+both(x=>`<rect x="${x-20}" y="104" width="40" height="16" fill="#f2efe6"/><rect x="${x-6}" y="104" width="14" height="16" fill="${IR}"/><rect x="${x-2}" y="108" width="7" height="9" fill="#151515"/><rect x="${x+3}" y="106" width="3" height="3" fill="#fff"/>`)+`<rect x="92" y="194" width="56" height="7" fill="${LIPD}"/><rect x="96" y="201" width="48" height="6" fill="${LIP}"/>`],
 ['2 ALMOND + LIPS',brow(84,4)+both(x=>`<path d="M${x-22} 112 Q${x} 96 ${x+22} 112 Q${x} 124 ${x-22} 112Z" fill="#f2efe6"/><circle cx="${x+1}" cy="111" r="8" fill="${IR}"/><circle cx="${x+1}" cy="111" r="4" fill="#151515"/><circle cx="${x+4}" cy="108" r="2" fill="#fff"/><path d="M${x-22} 112 Q${x} 96 ${x+22} 112" stroke="#3a2420" stroke-width="3" fill="none"/>`)+`<path d="M90 196 Q104 188 120 194 Q136 188 150 196 Q120 202 90 196Z" fill="${LIPD}"/><path d="M90 196 Q120 214 150 196 Q120 202 90 196Z" fill="${LIP}"/>`],
 ['3 ROUND EYES + SMILE',brow(80)+both(x=>`<circle cx="${x}" cy="110" r="14" fill="#f2efe6"/><circle cx="${x+2}" cy="111" r="8" fill="#5a7fb0"/><circle cx="${x+2}" cy="111" r="4" fill="#151515"/><circle cx="${x+5}" cy="107" r="2.5" fill="#fff"/><path d="M${x-14} 106 Q${x} 92 ${x+14} 106" stroke="${SD}" stroke-width="4" fill="none"/>`)+`<path d="M88 190 Q120 220 152 190 Q120 204 88 190Z" fill="${LIPD}"/>`],
 ['4 SLEEPY LIDS',brow(86,-3)+both(x=>`<path d="M${x-20} 112 Q${x} 100 ${x+20} 112 Q${x} 122 ${x-20} 112Z" fill="#f2efe6"/><circle cx="${x}" cy="113" r="7" fill="#6b4a2e"/><circle cx="${x}" cy="113" r="3.5" fill="#151515"/><path d="M${x-21} 112 Q${x} 98 ${x+21} 112 L${x+21} 108 Q${x} 96 ${x-21} 108Z" fill="${SD}"/><rect x="${x-21}" y="106" width="42" height="5" fill="${SD}"/>`)+`<rect x="98" y="197" width="44" height="6" fill="${LIP}"/>`],
 ['5 LASHES + FULL LIPS',brow(82,2)+both(x=>`<path d="M${x-20} 112 Q${x} 98 ${x+20} 112 Q${x} 124 ${x-20} 112Z" fill="#f2efe6"/><circle cx="${x}" cy="111" r="8" fill="#7a5a34"/><circle cx="${x}" cy="111" r="4" fill="#151515"/><circle cx="${x+3}" cy="108" r="2" fill="#fff"/><path d="M${x-22} 110 Q${x} 94 ${x+24} 108" stroke="#1d1414" stroke-width="4" fill="none"/><path d="M${x-16} 100 Q${x} 92 ${x+16} 100" stroke="${SD}" stroke-width="2" fill="none"/>`)+`<path d="M92 196 Q106 186 120 192 Q134 186 148 196 Q120 200 92 196Z" fill="#b5545a"/><path d="M92 196 Q120 216 148 196 Q120 200 92 196Z" fill="#c8676c"/><rect x="116" y="176" width="8" height="10" fill="${SD}"/>`],
 ['6 DEEP-SET, THIN MOUTH',`<rect x="58" y="94" width="52" height="12" fill="${SD}"/><rect x="130" y="94" width="52" height="12" fill="${SD}"/>`+brow(86)+both(x=>`<rect x="${x-18}" y="106" width="36" height="12" fill="#e6e0d2"/><rect x="${x-5}" y="106" width="11" height="12" fill="#5d6a72"/><rect x="${x-2}" y="108" width="5" height="8" fill="#151515"/><rect x="${x-18}" y="118" width="36" height="4" fill="${SD}"/>`)+`<rect x="94" y="198" width="52" height="4" fill="${LIPD}"/><rect x="92" y="196" width="4" height="4" fill="${SD}"/><rect x="144" y="196" width="4" height="4" fill="${SD}"/>`],
 ['7 BIG IRIS + TEETH SMILE',brow(78,3)+both(x=>`<ellipse cx="${x}" cy="112" rx="17" ry="14" fill="#f2efe6"/><circle cx="${x+1}" cy="113" r="11" fill="#3f8a7a"/><circle cx="${x+1}" cy="113" r="5" fill="#151515"/><circle cx="${x+5}" cy="108" r="3.5" fill="#fff"/><circle cx="${x-3}" cy="117" r="1.5" fill="#fff"/><path d="M${x-17} 110 Q${x} 92 ${x+17} 110" stroke="#2a1a16" stroke-width="3" fill="none"/>`)+`<path d="M90 188 Q120 228 150 188Z" fill="#5c2424"/><path d="M93 190 H147 Q144 198 120 198 Q96 198 93 190Z" fill="#f4efe4"/>`],
 ['8 NARROW + SMIRK',brow(88,-6).replace(`rotate(6 156`,`rotate(2 156`)+both(x=>`<path d="M${x-20} 111 Q${x} 104 ${x+20} 111 Q${x} 118 ${x-20} 111Z" fill="#efe9dc"/><circle cx="${x+3}" cy="111" r="5" fill="#4b5d3a"/><circle cx="${x+3}" cy="111" r="2.5" fill="#151515"/><path d="M${x-20} 116 Q${x} 121 ${x+20} 116" stroke="${SD}" stroke-width="3" fill="none"/>`)+`<path d="M96 200 Q122 202 146 190" stroke="${LIPD}" stroke-width="6" fill="none" stroke-linecap="square"/>`],
];
document.getElementById('g').innerHTML=F.map(([n,f])=>`<div class="c">${head(f)}<div>${n}</div></div>`).join('');
</script></body></html>
