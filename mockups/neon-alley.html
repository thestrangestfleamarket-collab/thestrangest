<style>
/* One screen: the alley fills it, a small plate of controls top-left, his photo on demand bottom-right. */
:root{
  --ink:#ecebf6; --dim:#a3a0c0; --plate:rgba(16,12,34,.88); --edge:#3a2f66; --hot:#d2307a; --night:#0c0b1e;
  --mono:"Silkscreen","Courier New",monospace; --body:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--night);color:var(--ink);overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
.plate{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));
  max-width:min(340px,calc(100vw - 32px));max-height:calc(100% - 90px);overflow:auto;background:var(--plate);border:2px solid var(--edge);padding:10px 12px;
  font:12px/1.45 var(--body);display:flex;flex-direction:column;gap:8px}
h1{font:700 15px/1.1 var(--mono);margin:0;letter-spacing:.04em;color:#fff}
h1 b{color:#ff6fae}
.tag{font:10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.row{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.row span{font:10px var(--mono);letter-spacing:.1em;color:var(--dim);min-width:58px}
button{font:11px var(--mono);letter-spacing:.06em;background:#1d1838;color:var(--ink);border:1px solid var(--edge);padding:4px 7px;cursor:pointer}
button[aria-pressed="true"]{background:var(--hot);border-color:#ff9cc8;color:#fff}
button:focus-visible{outline:2px solid #ffd34d;outline-offset:1px}
.cost{font:11px/1.5 var(--body);color:var(--dim);font-variant-numeric:tabular-nums}
.cost b{color:var(--ink);font-weight:500}
.hint{font-size:11px;color:var(--dim)}
#refb{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px))}
#ref{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(50px + env(safe-area-inset-bottom,0px));
  width:min(480px,calc(100vw - 32px));border:2px solid var(--edge);background:#000}
#ref img{display:block;width:100%}
[hidden]{display:none!important}
#load{position:fixed;inset:0;display:grid;place-items:center;font:12px var(--mono);letter-spacing:.1em;color:var(--dim);pointer-events:none}
</style>

<script>
// ---------- small helpers ----------
let seed=7;const rnd=()=>((seed=(seed*16807)%2147483647)/2147483647);
const cv=(w,h)=>{const c=document.createElement('canvas');c.width=Math.max(1,w|0);c.height=Math.max(1,h|0);return c};
const tx=c=>{const t=new THREE.CanvasTexture(c);t.magFilter=THREE.NearestFilter;t.minFilter=THREE.NearestFilter;t.generateMipmaps=false;return t};
const T=24;                         // texels a metre for walls (the game's 24 a tile, near enough)
let LANG=0;                         // 0 hangul, 1 english
const KO='"Black Han Sans","Do Hyeon","Noto Sans KR",sans-serif', KO2='"Do Hyeon","Black Han Sans",sans-serif';

// the light in flat bands, each band down a little cooler and bluer (the game's CEL, 4 bands)
const bands=(()=>{const d=new Uint8Array([34,36,66,255, 92,92,132,255, 170,166,196,255, 255,250,244,255]);
  const t=new THREE.DataTexture(d,4,1,THREE.RGBAFormat);t.magFilter=t.minFilter=THREE.NearestFilter;t.needsUpdate=true;return t})();
const TOON=(o)=>new THREE.MeshToonMaterial(Object.assign({gradientMap:bands},o));
const BASIC=(o)=>new THREE.MeshBasicMaterial(o);

// ---------- painters ----------
// a concrete or tiled facade with a window grid; some windows lit (their glow in the emissive map)
function facade(w,h,o){
  const c=cv(w*T,h*T),g=c.getContext('2d'),e=cv(w*T,h*T),q=e.getContext('2d');q.fillStyle='#000';q.fillRect(0,0,e.width,e.height);
  const base=o.base;g.fillStyle=base;g.fillRect(0,0,c.width,c.height);
  const d=g.getImageData(0,0,c.width,c.height);                         // grain: each texel its tone
  for(let i=0;i<d.data.length;i+=4){const k=.9+rnd()*.16;d.data[i]*=k;d.data[i+1]*=k;d.data[i+2]*=k}g.putImageData(d,0,0);
  if(o.tile){g.fillStyle='rgba(0,0,0,.18)';for(let y=0;y<c.height;y+=6)g.fillRect(0,y,c.width,1);for(let x=0;x<c.width;x+=12)g.fillRect(x,0,1,c.height)}
  // the floor bands (slab edges) and stains running down from them
  const st=o.storey||3.2;
  for(let f=1;f*st<h;f++){const y=c.height-(f*st)*T;g.fillStyle='rgba(0,0,0,.28)';g.fillRect(0,y,c.width,3);g.fillStyle='rgba(255,255,255,.06)';g.fillRect(0,y-1,c.width,1);
    for(let x=0;x<c.width;x+=3+((rnd()*9)|0)){g.fillStyle='rgba(20,18,26,.14)';g.fillRect(x,y+3,1+((rnd()*2)|0),4+((rnd()*30)|0))}}
  const ww=o.win||1.4,wh=1.5;
  for(let f=(o.from||1);f*st+wh<h-.3;f++)for(let x=o.wx||.8;x+ww<w-.3;x+=ww+(o.gap||1.1)){
    const X=x*T,Y=c.height-(f*st+.9+wh)*T,W=ww*T,H=wh*T;
    g.fillStyle='#55525c';g.fillRect(X-2,Y-2,W+4,H+4);                 // the frame
    const lit=rnd()<(o.lit||.25),col=lit?['#ffd79a','#f2c27a','#cfe3ff','#ffb2c8'][(rnd()*4)|0]:'#16141f';
    g.fillStyle=col;g.fillRect(X,Y,W,H);
    if(lit){q.fillStyle=col;q.fillRect(X,Y,W,H);q.fillStyle='rgba(0,0,0,.35)';q.fillRect(X,Y,W*(.2+rnd()*.5),H);  // a curtain drawn part way
      g.fillStyle='rgba(0,0,0,.35)';g.fillRect(X,Y,W*(.2+rnd()*.5),H)}
    else{g.fillStyle='#2a2838';g.fillRect(X+W*.15,Y+2,2,H-4)}
    g.fillStyle='#55525c';g.fillRect(X+W/2-1,Y,2,H);
    g.fillStyle='#77737f';g.fillRect(X-3,Y+H+2,W+6,2);                  // the sill
    if(rnd()<.25){g.fillStyle='#3e3b45';g.fillRect(X+W*.6,Y+H+4,W*.35,10);g.fillStyle='#2b2933';g.fillRect(X+W*.6,Y+H+6,W*.35,1)} // an AC unit's shadow box
  }
  return {map:tx(c),em:tx(e)};
}
// a plain shape painted on a small canvas, its alpha cut hard (no soft edge: alphaTest)
function hard(c){const g=c.getContext('2d'),d=g.getImageData(0,0,c.width,c.height);
  for(let i=3;i<d.data.length;i+=4)d.data[i]=d.data[i]>110?255:0;g.putImageData(d,0,0);return c}
// the halo round a neon shape: three hard steps, never a blur
function halo(src,col,r){const p=r*3+2,c=cv(src.width+p*2,src.height+p*2),g=c.getContext('2d');
  const lv=[[r*3,.16],[r*2,.2],[r,.26]];

let PX=2,VIEW=0,yaw=0,pitch=0,dist=1,zoom=1;
const cam=new THREE.PerspectiveCamera(52,1,.1,200),iso=new THREE.OrthographicCamera(-1,1,1,-1,.1,400);
function fit(){const w=innerWidth,h=innerHeight;R.setPixelRatio(1);R.setSize(Math.ceil(w/PX),Math.ceil(h/PX),false);
  cam.aspect=w/h;cam.updateProjectionMatrix();const s=13/zoom;iso.left=-s*w/h;iso.right=s*w/h;iso.top=s;iso.bottom=-s;iso.updateProjectionMatrix()}
function place(){
  if(VIEW===0){cam.position.set(1.5,1.6,4.5);cam.lookAt(1.5+Math.sin(yaw-.12)*10,1.6+1.6+pitch*10,4.5-Math.cos(yaw-.12)*10);cam.fov=60/zoom;cam.updateProjectionMatrix()}
  else if(VIEW===1){const d=4.2/zoom,a=yaw,p=.25+pitch;const t=man.position;cam.position.set(t.x+Math.sin(a)*d*Math.cos(p),1.9+Math.sin(p)*d,t.z+Math.cos(a)*d*Math.cos(p));cam.lookAt(t.x,1.5,t.z-3);cam.fov=55;cam.updateProjectionMatrix()}
  else{const a=Math.PI/4+yaw,t=new THREE.Vector3(0,0,-14);iso.position.set(t.x+Math.sin(a)*60,62,t.z+Math.cos(a)*60);iso.lookAt(t)}
}
const cut=[new THREE.Plane(new THREE.Vector3(-1,0,0),A-.05)];R.localClippingEnabled=false;

  pitch=Math.max(-.5,Math.min(.6,dragging.pitch-(e.clientY-dragging.y)*.003*(VIEW===0?-1:1)));if(VIEW===2)pitch=0;frame()});
