const ITEMS=[

 {id:'amethyst',name:'AMETHYST',art:'gem',n:1,w:.2,x:66,y:56},

const CAP=40, CELL=44, NOTES={
 A:"Ultima's way. Put a thing anywhere in the bag, pile things up, open the pouch inside. DRAG a thing to move it; drag it OUT onto the grass to drop it; DOUBLE CLICK eats, drinks, opens the pouch, picks up what's on the ground. Drop a thing on the pouch to put it in.",

const $=id=>document.getElementById(id), byId=id=>ITEMS.find(i=>i.id===id);

const mouthOf=where=>$('m'+where), cells=where=>{ const m=mouthOf(where); return [Math.floor(m.clientWidth/CELL),Math.floor(m.clientHeight/CELL)]; };
function snap(it,where,x,y){ const [cx,cy]=cells(where); const taken=new Set(ITEMS.filter(i=>i.where===where&&i!==it).map(i=>Math.round(i.x/CELL)+','+Math.round(i.y/CELL))); let best=null,bd=1e9; for(let j=0;j<cy;j++)for(let i=0;i<cx;i++){ if(taken.has(i+','+j))continue; const d=(i*CELL+2-x)**2+(j*CELL+2-y)**2; if(d<bd){ bd=d; best=[i*CELL+2,j*CELL+2]; } } return best; }
function freeSpot(it,where){ if(mode==='B')return snap(it,where,0,0); const m=mouthOf(where); for(let y=0;y+40<=m.clientHeight;y+=22)for(let x=0;x+40<=m.clientWidth;x+=24){ if(!ITEMS.some(i=>i.where===where&&i!==it&&Math.abs(i.x-x)<30&&Math.abs(i.y-y)<30))return [x,y]; } return [Math.random()*(m.clientWidth-40),Math.random()*(m.clientHeight-40)]; }

function toBag(it,where='bag'){ const s=freeSpot(it,where); if(!s){ say('NO ROOM.','#c8a090'); return false; } it.where=where; it.x=s[0]; it.y=s[1]; return true; }
function use(it){
  if(it.where==='ground'){ if(toBag(it))say('YOU PICK UP THE '+it.name+'.','#f2c14e'); }
  else if(it.where==='worn'){ if(toBag(it))say('YOU TAKE OFF THE '+it.name+'.'); }
  else if(it.bag){ const w=$('pouchwin'); w.hidden=!w.hidden; if(!w.hidden)place(w,$('bagwin').offsetLeft-250,$('bagwin').offsetTop); say(w.hidden?'YOU CLOSE THE POUCH.':'YOU OPEN THE POUCH.'); }
  else if(it.eat){ it.n--; say(`YOU ${it.eat} THE ${it.name}.`,it.eat==='DRINK'?'#9fe07f':'#d8dae2'); if(it.n<=0)ITEMS.splice(ITEMS.indexOf(it),1); }
  else if(it.slot&&mode==='C'){ wear(it); }
  else say('YOU LOOK AT THE '+it.name+'.','#9b9584');
  render();
}
function wear(it,slot){ slot=slot||it.slot; if(!it.slot){ say("YOU CAN'T WEAR THAT.",'#c8a090'); return; } if(slot!==it.slot){ say('THAT GOES ON YOUR '+it.slot.toUpperCase()+'.','#c8a090'); return; } const old=ITEMS.find(i=>i.where==='worn'&&i.slot===slot&&i!==it); if(old)toBag(old); it.where='worn'; say(slot==='hand'?'YOU HOLD THE '+it.name+'.':'YOU PUT ON THE '+it.name+'.','#9fe07f'); }
const place=(w,x,y)=>{ const S=$('scene'); w.style.left=Math.max(0,Math.min(S.clientWidth-w.offsetWidth,x))+'px'; w.style.top=Math.max(0,Math.min(S.clientHeight-40,y))+'px'; };
function layout(){ const S=$('scene'), W=S.clientWidth; place($('bagwin'),Math.min(W-340,W*.56),28); place($('dollwin'),12,96); }
function setMode(m){ mode=m; for(const k of 'ABC')$('t'+k).setAttribute('aria-pressed',k===m); $('note').textContent=NOTES[m]; $('dollwin').hidden=m!=='C'; if(m!=='C')for(const it of ITEMS)if(it.where==='worn')toBag(it); if(m==='B')for(const where of ['bag','pouch'])for(const it of ITEMS)if(it.where===where){ const s=snap(it,where,it.x,it.y); if(s){ it.x=s[0]; it.y=s[1]; } } render(); }
for(const k of 'ABC')$('t'+k).addEventListener('click',()=>setMode(k));
document.addEventListener('click',e=>{ const b=e.target.closest('[data-close]'); if(b){ $(b.dataset.close).hidden=true; } });
let drag=null, lastTap={id:null,t:0};
document.addEventListener('pointerdown',e=>{ if(e.button)return; const t=e.target.closest('.ttl'); if(t&&!e.target.closest('.x')){ const w=$(t.dataset.win); drag={win:w,ox:e.clientX-w.offsetLeft,oy:e.clientY-w.offsetTop}; e.preventDefault(); return; }
  const d=e.target.closest('.it'); if(!d)return; e.preventDefault(); const it=byId(d.dataset.id); const r=d.getBoundingClientRect(); drag={it,d,sx:e.clientX,sy:e.clientY,dx:e.clientX-r.left,dy:e.clientY-r.top,moved:false}; });
document.addEventListener('pointermove',e=>{ if(!drag)return; if(drag.win){ place(drag.win,e.clientX-drag.ox,e.clientY-drag.oy); return; }
  if(!drag.moved){ if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<4)return; drag.moved=true; drag.d.classList.add('held'); const g=document.createElement('img'); g.className='ghost'; g.src=drag.it.src; document.body.appendChild(g); drag.ghost=g; }
  drag.ghost.style.left=(e.clientX-drag.dx)+'px'; drag.ghost.style.top=(e.clientY-drag.dy)+'px';
  document.querySelectorAll('.slot.over').forEach(s=>s.classList.remove('over')); const u=document.elementFromPoint(e.clientX,e.clientY), s=u&&u.closest('.slot'); if(s)s.classList.add('over'); });
document.addEventListener('pointerup',e=>{ if(!drag)return; const D=drag; drag=null; if(D.win)return;
  if(!D.moved){ const now=Date.now(); if(lastTap.id===D.it.id&&now-lastTap.t<400){ lastTap={id:null,t:0}; use(D.it); } else lastTap={id:D.it.id,t:now}; return; }
  D.ghost.remove(); D.d.classList.remove('held'); document.querySelectorAll('.slot.over').forEach(s=>s.classList.remove('over'));
  const it=D.it, u=document.elementFromPoint(e.clientX,e.clientY); if(!u){ render(); return; }
  const onIt=u.closest('.it'), onItem=onIt&&byId(onIt.dataset.id);
  const mouth=u.closest('.mouth'), slot=u.closest('.slot'), doll=u.closest('.doll'), S=$('scene').getBoundingClientRect();
  if(onItem&&onItem.bag&&onItem!==it&&onItem.where!=='ground'){ if(it.bag)say("THE POUCH WON'T GO INTO ITSELF.",'#c8a090'); else if(toBag(it,'pouch'))say('YOU PUT THE '+it.name+' IN THE POUCH.'); }
  else if(mouth){ const where=mouth.dataset.where; if(where==='pouch'&&it.bag)say("THE POUCH WON'T GO INTO ITSELF.",'#c8a090'); else{ const m=mouth.getBoundingClientRect(); const was=it.where; if(put(it,where,e.clientX-D.dx-m.left,e.clientY-D.dy-m.top)&&was==='ground')say('YOU PICK UP THE '+it.name+'.','#f2c14e'); else if(was==='worn')say('YOU TAKE OFF THE '+it.name+'.'); } }
  else if(slot||doll){ wear(it,slot?slot.dataset.slot:it.slot); }
  else if(u.closest('#scene')&&!u.closest('.win')){ it.where='ground'; it.gx=e.clientX-S.left; it.gy=e.clientY-S.top; if(it.bag)$('pouchwin').hidden=true; say('YOU DROP THE '+it.name+'.'); }
  render(); });
document.addEventListener('pointercancel',()=>{ if(drag&&drag.ghost)drag.ghost.remove(); drag=null; render(); });
addEventListener('resize',layout);
layout(); setMode('A'); say('YOUR BAG IS OPEN. (I)','#9b9584');
</script>
