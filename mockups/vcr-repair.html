<title>Lightning Fast VCR Repair</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* One screen: the building fills it, a small plate of controls top-left, the photo on demand bottom-right. */
:root{
  --ink:#e8ecf4; --dim:#9aa6bd; --plate:rgba(14,20,38,.86); --edge:#2b3b66; --hot:#2f5bd6; --red:#c8202a;
  --mono:"Silkscreen","Courier New",monospace; --body:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:#0b1020;color:var(--ink);overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
.plate{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));
  max-width:min(330px,calc(100vw - 32px));background:var(--plate);border:2px solid var(--edge);padding:10px 12px;
  font:12px/1.45 var(--body);display:flex;flex-direction:column;gap:8px}
h1{font:700 15px/1.1 var(--mono);margin:0;letter-spacing:.04em;color:#fff}
h1 b{color:#6f95ff}
.tag{font:10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.row{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.row span{font:10px var(--mono);letter-spacing:.1em;color:var(--dim);min-width:52px}
button{font:11px var(--mono);letter-spacing:.06em;background:#16213f;color:var(--ink);border:1px solid var(--edge);padding:4px 7px;cursor:pointer}
button[aria-pressed="true"]{background:var(--hot);border-color:#7d9cff;color:#fff}
button:focus-visible{outline:2px solid #ffd34d;outline-offset:1px}
.cost{font:11px/1.5 var(--body);color:var(--dim);font-variant-numeric:tabular-nums}
.cost b{color:var(--ink);font-weight:500}
.hint{font-size:11px;color:var(--dim)}
#ref{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  width:min(380px,calc(100vw - 32px));border:2px solid var(--edge);background:var(--plate);padding:4px}
#ref img{display:block;width:100%}
#ref div{font:10px var(--mono);letter-spacing:.1em;color:var(--dim);padding:4px 2px 0}
@media (max-width:520px){.plate{font-size:11px}#ref{width:calc(100vw - 32px)}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Silkscreen:wght@400;700&display=swap">

function block(w,h){const c=cv(w*T,h*T),g=c.getContext('2d');g.fillStyle='#9fa1a1';g.fillRect(0,0,c.width,c.height);
  const bw=10,bh=5;for(let y=0,r=0;y<c.height;y+=bh,r++)for(let x=-(r%2)*bw/2;x<c.width;x+=bw){
    const v=196+((rnd()*14)|0);g.fillStyle=`rgb(${v},${v},${v-3})`;g.fillRect(x,y,bw-1,bh-1);
    g.fillStyle=`rgb(${v+10},${v+10},${v+8})`;g.fillRect(x,y,bw-1,1);

  const gr=g.createLinearGradient(0,c.height,0,c.height-T*1.2);gr.addColorStop(0,'rgba(70,66,60,.35)');gr.addColorStop(1,'rgba(70,66,60,0)');

  g.lineWidth=5;g.strokeStyle='#0d1c55';g.strokeText('LIGHTNING',0,0);g.fillStyle='#2547b8';g.fillText('LIGHTNING',0,0);
  g.font='900 40px Impact,"Arial Black",sans-serif';g.strokeText('FAST',30,38);g.fillText('FAST',30,38);g.restore();
  g.save();g.translate(W*.36,H*.64);g.rotate(-.12);   // the tape
  g.fillStyle='#111';g.fillRect(-78,-30,160,58);g.fillStyle='#2b2b2b';g.fillRect(-72,-24,148,30);

const bulb=add(new THREE.CircleGeometry(.2,8),new THREE.MeshBasicMaterial({color:0x55524a}),W/2+.74,5.94,-.9,false,false);bulb.rotation.x=Math.PI/2;
add(box(.14,.14,.3),C('#e2e2df'),W/2+.12,4.6,-1.6);add(box(.1,.1,.24),C('#e2e2df'),W/2+.22,4.55,-1.4);
add(box(.18,.22,.34),C('#3f6ea8'),W/2+.12,1.4,-3.6);           // the meter on the side
// the side yard: a chain-link fence and its gate, across from the wall's middle to a post 6 out

const post=C('#a9adb1');const fz=-3.2,fx0=W/2,fx1=W/2+6;
for(const x of [fx0+.08,fx0+2.4,fx1])add(new THREE.CylinderGeometry(.06,.06,2.5,6),post,x,1.25,fz);
add(new THREE.CylinderGeometry(.04,.04,6,6),post,(fx0+fx1)/2,2.2,fz).rotation.z=Math.PI/2;
{const g=new THREE.PlaneGeometry(6,2.2);const uv=g.attributes.uv;for(let i=0;i<uv.count;i++)uv.setXY(i,uv.getX(i)*6*2,uv.getY(i)*2.2*2);
 add(g,chainM,(fx0+fx1)/2,1.1,fz,true,false)}
for(const y of [2.4,2.55,2.7])add(new THREE.CylinderGeometry(.012,.012,6,3),post,(fx0+fx1)/2,y,fz-.08).rotation.z=Math.PI/2; // barbed wire
add(new THREE.CylinderGeometry(.035,.035,2.2,6),post,fx0+2.4,1.1,fz+.02).rotation.z=0;
// the bed along the front: a concrete curb, mulch, five bare shrubs
add(box(5.9,.18,1.6),C('#b9b7b0'),-3.05,.09,.8);add(new THREE.PlaneGeometry(5.6,1.35),L(mulch(5.6,1.35)),-3.05,.185,.8).rotation.x=-Math.PI/2;
const twig=C('#5a4436');
for(const [x,s] of [[-5.5,.9],[-4.6,1.1],[-3.4,1.3],[-2.1,.8],[-1.1,1.0]]){
  for(let i=0;i<9;i++){const h=(.5+rnd()*.7)*s,m=add(new THREE.CylinderGeometry(.015,.03,h,3),twig,x,.18,.75);
    m.geometry.translate(0,h/2,0);m.rotation.set((rnd()-.5)*1.1,rnd()*6.3,(rnd()-.5)*1.1)}}
// the ground: the lot's asphalt, a concrete apron along the front and side
{const g=new THREE.PlaneGeometry(60,44);const m=add(g,L(asphalt(60,44)),0,0,0,false);m.rotation.x=-Math.PI/2;m.position.set(4,0,-4)}

add(box(1.6,.06,D+2),C('#b4b2ab'),W/2+.8,.03,-D/2+1,false);
// a person for scale, 1.8 high
{const p=C('#2e3550'),s=C('#c99a7a');add(box(.18,.85,.2),p,1.0,.43,2.6);add(box(.18,.85,.2),p,1.24,.43,2.6);
 add(box(.5,.65,.26),C('#3c6b5a'),1.12,1.18,2.6);add(box(.24,.26,.24),s,1.12,1.65,2.6)}

// ---------- light: the sun the day's one light, a little sky; at night the lamp and the sign ----------
const hemi=new THREE.HemisphereLight(0xbfd6ff,0x6b6258,.5);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff2dc,1.0);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-16,right:16,top:16,bottom:-16,near:1,far:60});sun.shadow.bias=-.0006;sun.shadow.normalBias=.03;
sun.position.set(-12,22,18);scene.add(sun);scene.add(sun.target);
const lamp=new THREE.SpotLight(0xffd9a0,0,14,.9,.5,1.4);lamp.position.set(W/2+.74,5.95,-.9);lamp.target.position.set(W/2+2,0,-.9);lamp.castShadow=true;lamp.shadow.mapSize.set(512,512);
scene.add(lamp);scene.add(lamp.target);
const glow=new THREE.PointLight(0xdfe8ff,0,7,2);glow.position.set(-1.15,5.3,1.4);scene.add(glow);
const TIMES={
  day:{bg:0x3f86d8,hemi:.5,sky:0xbfd6ff,sun:1.0,sunc:0xfff2dc,pos:[-12,22,18],lamp:0,glow:0,sign:0,bulb:0x55524a},
  dusk:{bg:0xd77a52,hemi:.22,sky:0xffb48a,sun:.65,sunc:0xffa060,pos:[-26,7,14],lamp:1.4,glow:.4,sign:.45,bulb:0xffd9a0},
  night:{bg:0x0d1530,hemi:.16,sky:0x4a5fa0,sun:0,sunc:0x000000,pos:[-12,22,18],lamp:3,glow:.9,sign:.9,bulb:0xffe2b0}};
function setTime(k){const t=TIMES[k];scene.background=new THREE.Color(t.bg);hemi.intensity=t.hemi;hemi.color.set(t.sky);
  sun.intensity=t.sun;sun.color.set(t.sunc);sun.position.set(...t.pos);sun.visible=t.sun>0;lamp.intensity=t.lamp;glow.intensity=t.glow;
  signM.emissiveIntensity=t.sign;bulb.material.color.set(t.bulb);
  for(const id of ['day','dusk','night'])document.getElementById(id).setAttribute('aria-pressed',id===k);dirty=1}

// ---------- the view: isometric (ortho) or at a person's eye, turned by drag ----------
let px=3,yaw=.62,pitch=.6,zoom=1,mode='iso',dirty=1;
const target=new THREE.Vector3(1.5,3.2,-2.5);
const ortho=new THREE.OrthographicCamera(-1,1,1,-1,.1,200),persp=new THREE.PerspectiveCamera(50,1,.1,200);
function place(){const a=innerWidth/innerHeight;
  if(mode==='iso'){const half=10/zoom;ortho.left=-half*a;ortho.right=half*a;ortho.top=half;ortho.bottom=-half;ortho.updateProjectionMatrix();
    const r=60;ortho.position.set(target.x+r*Math.sin(yaw)*Math.cos(pitch),target.y+r*Math.sin(pitch),target.z+r*Math.cos(yaw)*Math.cos(pitch));ortho.lookAt(target)}
  else{persp.aspect=a;persp.updateProjectionMatrix();const r=16/zoom,p=Math.max(.02,pitch*.35);
    persp.position.set(target.x+r*Math.sin(yaw)*Math.cos(p),1.6,target.z+r*Math.cos(yaw)*Math.cos(p));persp.lookAt(target.x,3.4,target.z)}}
function size(){R.setPixelRatio(1);R.setSize(Math.ceil(innerWidth/px),Math.ceil(innerHeight/px),false);dirty=1}
addEventListener('resize',size);
let drag=null,pinch=0;const pts=new Map();
cvs.addEventListener('pointerdown',e=>{cvs.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);drag=[e.clientX,e.clientY]});
cvs.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(pts.size===2){const [a,b]=[...pts.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pinch)zoom=Math.min(4,Math.max(.5,zoom*d/pinch));pinch=d;dirty=1;return}
  if(!drag)return;yaw-=(e.clientX-drag[0])*.008;pitch=Math.min(1.45,Math.max(.12,pitch+(e.clientY-drag[1])*.006));drag=[e.clientX,e.clientY];dirty=1});
const up=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=0;if(!pts.size)drag=null};cvs.addEventListener('pointerup',up);cvs.addEventListener('pointercancel',up);
cvs.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.min(4,Math.max(.5,zoom*Math.exp(-e.deltaY*.0012)));dirty=1},{passive:false});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();const sn=Math.round((yaw-Math.PI/4)/(Math.PI/2))*Math.PI/2+Math.PI/4;if(k==='q'){yaw=sn-Math.PI/2;dirty=1}
  if(k==='e'){yaw=sn+Math.PI/2;dirty=1}});
document.querySelectorAll('[data-px]').forEach(b=>b.onclick=()=>{px=+b.dataset.px;document.querySelectorAll('[data-px]').forEach(o=>o.setAttribute('aria-pressed',o===b));size()});
for(const k of ['day','dusk','night'])document.getElementById(k).onclick=()=>setTime(k);
const setMode=m=>{mode=m;zoom=1;pitch=m==='iso'?.6:.3;document.getElementById('iso').setAttribute('aria-pressed',m==='iso');document.getElementById('eye').setAttribute('aria-pressed',m==='eye');dirty=1};
document.getElementById('iso').onclick=()=>setMode('iso');document.getElementById('eye').onclick=()=>setMode('eye');
const ref=document.getElementById('ref'),pb=document.getElementById('photo');
pb.onclick=()=>{ref.hidden=!ref.hidden;pb.setAttribute('aria-pressed',!ref.hidden)};
if(innerWidth<620){ref.hidden=true;pb.setAttribute('aria-pressed','false')}

const costEl=document.getElementById('cost');let lastMs=0;
function frame(){requestAnimationFrame(frame);if(!dirty)return;dirty=0;place();const t0=performance.now();
  R.render(scene,mode==='iso'?ortho:persp);lastMs=performance.now()-t0;const i=R.info.render;
  const lit=[sun,lamp,glow].filter(l=>l.visible&&l.intensity>0).length,sh=[sun,lamp].filter(l=>l.visible&&l.intensity>0).length;
  costEl.innerHTML=`<b>${i.triangles.toLocaleString()}</b> triangles · <b>${i.calls}</b> draws<br><b>${lit}</b> lights (${sh} with shadows) · <b>${lastMs.toFixed(1)}</b> ms CPU`}
size();setTime('day');frame();
})();
