<title>The Market Avatar Editor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap">
<style>
:root{ --bg:#0d0f14; --panel:rgba(16,18,26,.88); --fg:#ece5d3; --dim:#9b9584; --key:#f2c14e; --line:#2a2e3a; --btn:#0e1016; --btnl:#3a3f4e;
  --pixel:'Silkscreen',ui-monospace,Menlo,monospace; color-scheme:dark }
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden}
body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font:12px var(--pixel)}
#stage{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block;touch-action:none}
#loading{position:fixed;inset:0;display:grid;place-items:center;font:12px var(--pixel);letter-spacing:2px;color:#8a8f9c;background:#0e1016;z-index:50}
#wb{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:16px;bottom:16px;width:300px;display:flex;flex-direction:column;background:var(--panel);border:2px solid var(--line);z-index:20}
#wb h2{font:13px var(--pixel);color:var(--key);margin:0;padding:12px 14px;border-bottom:2px solid var(--line);letter-spacing:.04em}
#wb h2 span{color:var(--dim);font-size:10px}
#wb .tabs{display:flex;flex-wrap:wrap;border-bottom:2px solid var(--line)}
#wb .tabs button{flex:1 1 30%;font:inherit;color:var(--dim);background:transparent;border:0;border-right:2px solid var(--line);border-bottom:2px solid var(--line);padding:10px 4px;cursor:pointer}
#wb .tabs button[aria-selected="true"]{color:var(--key);background:#151924}
#wb .pane{padding:8px 14px 14px;overflow:auto;flex:1;min-height:0} #wb .pane[hidden]{display:none}
#wb h3{font:11px var(--pixel);color:var(--dim);margin:12px 0 4px;letter-spacing:1px}
#wb .row{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:5px 0}
#wb .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:5px}
#wb .btn,#bar .btn,#swap .btn{font:inherit;color:var(--fg);background:var(--btn);border:2px solid var(--btnl);padding:6px 8px;cursor:pointer;text-align:left}
#wb .btn[aria-pressed="true"],#bar .btn[aria-pressed="true"],#swap .btn[aria-pressed="true"]{color:var(--key);border-color:var(--key)}
#wb .btn:hover,#bar .btn:hover{border-color:#6b6f80}
#wb .btn:focus-visible,#bar .btn:focus-visible,#bar input:focus-visible,#wb input:focus-visible{outline:2px solid var(--key);outline-offset:1px}
#wb .dim{color:var(--dim);line-height:1.6} #wb .lab{width:96px} #wb input[type=range]{flex:1;min-width:90px;accent-color:var(--key)} #wb .val{width:40px;text-align:right;color:var(--dim)}
#wb textarea{width:100%;box-sizing:border-box;min-height:70px;font:10px ui-monospace,Menlo,monospace;background:var(--btn);color:var(--fg);border:2px solid var(--btnl)}
#bar{position:fixed;left:336px;right:436px;bottom:16px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;background:var(--panel);border:2px solid var(--line);padding:8px 12px;z-index:19}
#bar label{display:flex;align-items:center;gap:6px;flex:1 1 120px;min-width:0;color:var(--dim)}
#bar input[type=range]{flex:1;min-width:0;accent-color:var(--key)}
#tip{position:fixed;left:336px;right:436px;top:16px;text-align:center;color:var(--dim);pointer-events:none;z-index:18;text-shadow:0 1px 0 #000}
#toast{position:fixed;left:50%;top:44px;transform:translateX(-50%);background:var(--panel);border:2px solid var(--key);color:var(--key);padding:6px 12px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:70vw}
#toast.on{opacity:1}
#swap{display:none}
#av{right:max(16px,env(safe-area-inset-right,0px))!important;top:16px!important;bottom:16px!important}
#ed{left:max(16px,env(safe-area-inset-left,0px))!important;top:16px!important;bottom:16px!important}
@media (max-width:900px){
  #wb,#av,#ed{left:max(16px,env(safe-area-inset-left,0px))!important;right:max(16px,env(safe-area-inset-right,0px))!important;width:auto!important;top:54vh!important;bottom:16px!important}
  #bar{left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(46vh + 24px)}
  #tip{display:none}
  #swap{display:flex;gap:6px;position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:16px;z-index:25}
  body.show-av #wb{display:none} body:not(.show-av) #av{display:none!important}
}
@media (prefers-reduced-motion:reduce){ #toast{transition:none} }
</style>
<div id="stage"></div>
<div id="loading">I took a trip to The Strangest Flea Market...</div>
<div id="tip">DRAG TO TURN · RIGHT-DRAG OR SHIFT TO SLIDE · WHEEL ZOOMS</div>
<div id="toast" role="status"></div>
<div id="swap"><button class="btn" type="button" data-swap="av">AVATAR</button><button class="btn" type="button" data-swap="wb">POSE · VIEW · FILES</button></div>
<div id="wb" role="region" aria-label="Poses, view and files">
  <h2>THE MARKET <span>AVATAR EDITOR</span></h2>
  <div class="tabs" id="wbtabs"></div>
  <div class="pane" id="p-pose"></div>
  <div class="pane" id="p-moves" hidden></div>
  <div class="pane" id="p-view" hidden></div>
  <div class="pane" id="p-looks" hidden></div>
  <div class="pane" id="p-files" hidden></div>
</div>
<div id="bar">
  <label>TURN <input type="range" id="yaw" min="-180" max="180" step="1" aria-label="Turn"></label>
  <label>TILT <input type="range" id="pitch" min="-80" max="85" step="1" aria-label="Tilt"></label>
  <label>ZOOM <input type="range" id="zoom" min="0" max="100" step="1" aria-label="Zoom"></label>
  <button class="btn" type="button" id="spin">TURNTABLE</button>
</div>
