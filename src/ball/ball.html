<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<title>Ball</title>
<style>
body{margin:0}[hidden]{display:none!important}
:root{
  --bg:#0d1216; --panel:rgba(13,18,22,.72); --line:rgba(255,255,255,.16);
  --fg:#f1efe8; --dim:#a9b0b3; --amber:#ffb629; --rim:#e2501c;
  --ui:"Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --num:"DIN Alternate","Bahnschrift","Roboto Condensed","Arial Narrow",var(--ui);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);overflow:hidden;touch-action:none;
  -webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0}
#c{width:100%;height:100%;display:block;outline:none}
.hud{position:fixed;z-index:2;pointer-events:none}
#score{top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));
  background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 14px;display:flex;gap:18px;
  backdrop-filter:blur(6px)}
#score div{display:flex;flex-direction:column}
#score small{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
#gm{font-size:15px!important;line-height:1.9!important}
#score b{font-family:var(--num);font-size:26px;font-variant-numeric:tabular-nums;color:var(--amber);line-height:1.1}
#xr{top:calc(12px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:auto;max-width:48vw}
button{font:600 14px var(--ui);color:var(--fg);background:var(--panel);border:1px solid var(--line);
  border-radius:6px;padding:10px 16px;cursor:pointer;backdrop-filter:blur(6px)}
button:hover{border-color:var(--amber)}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
button.go{background:var(--rim);border-color:transparent}
#xrnote{font-size:12px;color:var(--dim);background:var(--panel);border:1px solid var(--line);border-radius:6px;
  padding:8px 10px;text-align:right;line-height:1.35}
#panel{display:flex;flex-direction:column;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;backdrop-filter:blur(6px);width:min(230px,46vw)}
#panel label{font-size:12px;color:var(--dim);display:flex;justify-content:space-between}
#panel span{color:var(--amber);font-family:var(--num)}
#panel input{width:100%;accent-color:var(--amber)}
#panel button{text-align:left;padding:8px 10px;font-size:13px}
#help{bottom:calc(14px + env(safe-area-inset-bottom,0px));left:max(16px,env(safe-area-inset-left,0px));
  font-size:12px;color:var(--dim);background:var(--panel);border:1px solid var(--line);border-radius:6px;
  padding:8px 12px;line-height:1.5;max-width:min(360px,60vw)}
@media (max-width:640px){#help{max-width:calc(100vw - 236px)}}
#help kbd{font:600 11px var(--ui);color:var(--fg);border:1px solid var(--line);border-radius:3px;padding:0 4px}
#pad{bottom:calc(18px + env(safe-area-inset-bottom,0px));right:max(16px,env(safe-area-inset-right,0px));
  display:flex;gap:10px;align-items:flex-end;pointer-events:auto}
#shoot{width:84px;height:84px;border-radius:50%;background:var(--rim);border-color:transparent;font-size:15px;padding:0}
#meter{left:50%;bottom:calc(120px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(240px,50vw);height:10px;
  border:1px solid var(--line);border-radius:5px;background:var(--panel);overflow:hidden}
#meter i{display:block;height:100%;width:0;background:var(--amber)}
#flash{left:50%;top:22%;transform:translateX(-50%);font:700 44px var(--num);color:var(--amber);opacity:0;
  transition:opacity .5s;text-shadow:0 2px 12px rgba(0,0,0,.6);white-space:nowrap}
#err{left:50%;top:50%;transform:translate(-50%,-50%);background:var(--panel);border:1px solid var(--line);
  padding:16px 20px;border-radius:6px;max-width:80vw}
@media (prefers-reduced-motion:reduce){#flash{transition:none}}
</style>
</head>
<body>
<div id="stage"><canvas id="c" tabindex="0" aria-label="Ball"></canvas></div>
<div id="score" class="hud"><div><small>Points</small><b id="pts">0</b></div><div><small>Made / Shots</small><b id="fg">0 / 0</b></div><div><small>Game</small><b id="gm">free play</b></div></div>
<div id="xr" class="hud">
  <button id="btnVR" class="go" hidden>Enter VR</button>
  <button id="btnAR" hidden>Enter AR · hoop in your room</button>
  <button id="btnSet">Settings</button>
  <div id="panel" hidden>
    <label for="tod">Time of day <span id="todV">22:00</span></label>
    <input id="tod" type="range" min="0" max="24" step="0.25" value="22">
    <button id="bCourt">Court</button><button id="bLights">Lights</button><button id="bGame">60 second game</button><button id="bWx">Weather</button><button id="bNet">Net</button><button id="bBall">Get ball</button>
  </div>
  <div id="xrnote" hidden></div>
</div>
<div id="help" class="hud"></div>
<div id="meter" class="hud" hidden><i id="meterFill"></i></div>
<div id="pad" class="hud"><button id="recall">Get ball</button><button id="shoot">Shoot</button></div>
<div id="flash" class="hud"></div>
<div id="err" class="hud" hidden></div>
<script type="module">__BALL__</script>
</body>
</html>
