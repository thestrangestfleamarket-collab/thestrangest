<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<title>Skirmish Table</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14171c; color: #e8eaee;
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  canvas { display: block; touch-action: none; }
  button { font: inherit; color: #fff; background: #2f6fed; border: 0; border-radius: 8px; padding: 10px 16px; cursor: pointer; }
  button.secondary { background: #3a404b; }
  button.danger { background: #8a2f2f; }
  button:disabled { opacity: .45; cursor: default; }
  input { font: inherit; color: inherit; background: #0d0f13; border: 1px solid #3a404b; border-radius: 8px;
    padding: 10px 12px; width: 6.5em; text-transform: uppercase; letter-spacing: .2em; text-align: center; }
  #lobby { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px;
    background: rgba(14, 16, 20, .92); z-index: 10; }
  #lobby .card { background: #1d2129; border: 1px solid #2c323c; border-radius: 14px; padding: 24px; max-width: 420px; width: 100%; }
  #lobby h1 { margin: 0 0 4px; font-size: 24px; }
  #lobby p { margin: 0 0 18px; color: #a5acb8; }
  #lobby .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
  select { font: inherit; color: inherit; background: #0d0f13; border: 1px solid #3a404b; border-radius: 8px; padding: 10px 12px; }
  #mapInfo { color: #a5acb8; margin-top: 10px; min-height: 2.8em; }
  #help { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(14, 16, 20, .7); z-index: 9; }
  #help[hidden] { display: none; }
  #help .card { background: #1d2129; border: 1px solid #2c323c; border-radius: 14px; padding: 20px 24px; max-width: 520px; }
  #help h2 { margin: 0 0 10px; font-size: 19px; }
  #help p { color: #a5acb8; margin: 12px 0 0; }
  #rules { line-height: 1.6; }
  #setup { position: fixed; left: 12px; top: 64px; width: 236px; z-index: 3; background: #1d2129ee; border: 1px solid #2c323c; border-radius: 12px; padding: 12px; max-height: calc(100% - 140px); overflow: auto; }
  #setup[hidden] { display: none; }
  #setup h2 { margin: 0 0 4px; font-size: 17px; }
  #setup .row { display: flex; gap: 6px; margin-top: 6px; }
  #setup .row > * { flex: 1; }
  #setup button { padding: 7px 8px; font-size: 14px; }
  #setup select { padding: 7px 8px; font-size: 14px; width: 100%; }
  #budget { color: #ffd66b; font-weight: 600; margin-bottom: 6px; }
  #roster { display: grid; gap: 4px; }
  #roster .chip { text-align: left; }
  #roster .chip.held { background: #b8860b; }
  #teamNote { color: #7d8594; font-size: 12px; margin-top: 4px; }
  #readyBtn { width: 100%; margin-top: 8px; background: #2f8f4a; }
  #readyBtn.danger { background: #8a2f2f; }
  #setupMsg { color: #ff9c8a; min-height: 1.3em; margin-top: 6px; font-size: 13px; }
  #camp { position: fixed; left: 12px; top: 64px; width: 300px; z-index: 3; background: #1d2129ee; border: 1px solid #2c323c; border-radius: 12px; padding: 14px; }
  #camp[hidden], #after[hidden] { display: none; }
  #camp h2 { margin: 0 0 6px; font-size: 18px; }
  #camp p { margin: 0 0 8px; color: #cfd4dc; }
  #campPts { color: #ffd66b !important; }
  #camp .row { display: flex; gap: 8px; }
  #camp .row > * { flex: 1; }
  #after { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(14, 16, 20, .6); z-index: 9; }
  #after .card { background: #1d2129; border: 1px solid #2c323c; border-radius: 14px; padding: 22px 26px; max-width: 460px; }
  #after h2 { margin: 0 0 8px; }
  #after p { color: #cfd4dc; margin: 0 0 16px; }
  #openLbl { display: block; margin-top: 10px; color: #cfd4dc; font-size: 14px; }
  #openLbl input { width: auto; margin-right: 6px; }
  #fairNote { color: #7d8594; font-size: 12px; margin-top: 6px; }
  #afterXp { color: #ffd66b !important; }
  #units { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(14, 16, 20, .8); z-index: 11; }
  #units[hidden] { display: none; }
  #units .card { background: #1d2129; border: 1px solid #2c323c; border-radius: 14px; padding: 18px 22px; max-width: 980px; width: 100%; max-height: 100%; overflow: auto; }
  #units h2 { margin: 0 0 10px; }
  .urow { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 12px; }
  .urow .uhead { grid-column: 1 / -1; }
  .urow .uhead span { color: #a5acb8; margin-left: 8px; }
  .urow .uhead i { color: #ffd66b; font-style: normal; margin-left: 8px; }
  .urow .up { font-size: 13px; padding: 8px; text-align: left; line-height: 1.3; }
  .urow .up.has { background: #2f8f4a; }
  .urow .up small { opacity: .75; }
  #unitsNote { color: #a5acb8; font-size: 13px; }
  #lobbyMsg { color: #ff9c8a; min-height: 1.4em; margin-top: 12px; }
  body::after { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, .6) 100%); }
  #hud, #info { z-index: 2; }
  #hud { position: fixed; left: 0; right: 0; top: 0; padding: 10px 12px; display: none; gap: 10px; align-items: center;
    flex-wrap: wrap; background: linear-gradient(#14171ccc, #14171c00); pointer-events: none; }
  #hud > * { pointer-events: auto; }
  #status { font-weight: 600; margin-right: auto; text-shadow: 0 1px 3px #000; }
  #info { position: fixed; left: 12px; right: 12px; bottom: 10px; color: #cfd4dc; text-shadow: 0 1px 3px #000; pointer-events: none; }
  #info b { color: #fff; }
</style>
</head>
<body>
<div id="lobby">
  <div class="card">
    <h1>Skirmish Table</h1>
    <p>Two-player turn-based tactics. Plays on a Quest 3 in mixed reality or in any browser.</p>
    <div class="row" style="margin-top:0">
      <select id="mapSel" aria-label="Battlefield"></select>
      <button id="createBtn">Create a match</button>
    </div>
    <label id="openLbl"><input type="checkbox" id="openChk"> Open match: both sides' upgrades count (a fair match ignores them)</label>
    <div id="mapInfo"></div>
    <div class="row">
      <select id="levelSel" aria-label="The computer's level"></select>
      <button id="soloBtn" class="secondary">Play the computer</button>
    </div>
    <div class="row"><button id="campBtn" class="secondary">Campaign: The Cold Beacon</button><button id="unitsBtn" class="secondary">Your units</button></div>
    <div class="row">
      <input id="codeInput" maxlength="4" placeholder="CODE" autocomplete="off" aria-label="Room code">
      <button id="joinBtn" class="secondary">Join with code</button>
    </div>
    <div id="lobbyMsg"></div>
  </div>
</div>
<div id="hud">
  <span id="status"></span>
  <button id="arBtn" hidden>Enter AR</button>
  <button id="soundBtn" class="secondary">Sound on</button>
  <button id="qualityBtn" class="secondary">Quality: high</button>
  <button id="helpBtn" class="secondary">Ground rules</button>
  <button id="copyBtn" class="secondary">Copy invite link</button>
  <button id="endBtn">End turn</button>
  <button id="quitBtn" class="danger">Surrender</button>
</div>
<div id="setup" hidden>
  <h2>Choose your team</h2>
  <div id="budget"></div>
  <div id="roster"></div>
  <div class="row"><button id="removeBtn" class="secondary">Remove</button><button id="defaultBtn" class="secondary">Default</button></div>
  <div class="row"><select id="teamSel" aria-label="Saved teams"></select></div>
  <div class="row"><button id="saveTeamBtn" class="secondary">Save team</button><button id="delTeamBtn" class="secondary">Delete</button></div>
  <div id="teamNote"></div>
  <button id="readyBtn">Ready</button>
  <div id="fairNote"></div>
  <div id="setupMsg"></div>
</div>
<div id="camp" hidden>
  <h2 id="campName"></h2>
  <p id="campText"></p>
  <p id="campFoe"></p>
  <p id="campPts"></p>
  <div class="row"><button id="fightBtn">Fight</button><button id="campUnits" class="secondary">Your units</button><button id="campBack" class="secondary">Menu</button></div>
</div>
<div id="after" hidden><div class="card"><h2 id="afterTitle"></h2><p id="afterText"></p><p id="afterXp"></p><button id="afterBtn">Continue</button></div></div>
<div id="units" hidden><div class="card"><h2>Your units</h2><div id="unitRows"></div><p id="unitsNote"></p><button id="unitsClose">Done</button></div></div>
<div id="info"></div>
<div id="help" hidden><div class="card"><h2>Ground rules</h2><div id="rules"></div><p>Tap a tile to see what it is. Tap here to close.</p></div></div>
<script type="module">__CHESS__</script>
</body>
</html>
