<script type="module">
const SB_URL='https://jvcetttmqseoteidfggn.supabase.co', SB_KEY='sb_publishable_UkzD8hOizW1hPr6hm3duQQ_07ZodPik';
const T={name:'The Strangest Flea Market',login:'log in',have:'already have an account? log in',back:'back',
  'code.title':'your invitation','code.body':'the market is invite only for now','code.ph':'invite code','code.go':'next','code.bad':'that invite code is not valid or already used',
  'ask':'no code? ask for one','win':'download for windows','ask.title':'ask for an invite','ask.body':'leave your email and we\'ll send you a code when a spot opens','ask.go':'ask','ask.sent':'thanks: we\'ll email {email} when your code is ready.',
  'make.ok':'code accepted ✓','make.body':'your email and a password, to log in again later','make.go':'start day 1','make.exists':'that email already has an account: log in instead',
  email:'email',password:'password',password2:'password again',short:'the password needs at least 8 characters',match:'the two passwords are different',bademail:'enter your email',
  'login.title':'welcome back','login.bad':'wrong email or password','login.forgot':'forgot password?','login.link':'email me a login link instead',
  'forgot.title':'forgot your password?','forgot.body':'we\'ll email you a link to choose a new one','forgot.go':'email me a reset link','forgot.sent':'a reset link is on its way to {email}. open it in this browser.',
  'link.title':'who are you?','link.go':'email me a login link','link.sent':'a letter from the strangest flea market is on its way to {email}. open the link in this browser.','wait':'waiting for you…',
  'newpass.title':'choose a new password','newpass.go':'save password','nocode.body':'this account has no invite yet: enter your code','opening':'opening the doors…','again':'please log in again'};
const tx=(k,v)=>{ let s=T[k]??k; for(const [a,b] of Object.entries(v||{}))s=s.split('{'+a+'}').join(b); return s; };
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const el=document.getElementById('door');
const S={step:'title',email:'',code:'',err:'',busy:false};
let recovery=false; try{ recovery=/[?&]code=/.test(location.search)&&Object.keys(localStorage).some(k=>/-code-verifier$/.test(k)&&/PASSWORD_RECOVERY/.test(localStorage.getItem(k)||'')); }catch(e){}
let sbP=null; const sb=()=>sbP||(sbP=import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm').then(m=>m.createClient(SB_URL,SB_KEY,{auth:{flowType:'pkce',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}})));
const post=(path,body,token)=>fetch(path,{method:'POST',headers:{'content-type':'application/json',...(token?{authorization:'Bearer '+token}:{})},body:JSON.stringify(body||{})}).then(r=>r.json()).catch(()=>({why:'the market is closed right now'}));

async function enter(){ const c=await sb(), {data}=await c.auth.getSession(), s=data&&data.session; if(!s){ S.step='login'; return; }
  S.step='opening'; draw(); const j=await post('/enter',{},s.access_token);
  if(j.ok){ document.cookie='tsfm-pass='+s.access_token+'; path=/; max-age=3600; secure; samesite=strict'; c.auth.stopAutoRefresh(); location.replace('/'); return new Promise(()=>{}); }
  if(j.why==='code'){ S.step='nocode'; return; }
  if(j.why==='login'){ await c.auth.signOut(); S.step='login'; S.err=tx('again'); return; }
  S.step='title'; S.err=j.why||'the market is closed right now'; }

function draw(){ const s=S, e=esc, b=(a,t,cls='')=>'<button type="button" class="'+cls+'" data-a="'+a+'"'+(s.busy?' disabled':'')+'>'+e(tx(t))+'</button>';
  const err=s.err?'<div class="err">'+e(s.err)+'</div>':'', inp=(id,type,ph,ac,v)=>'<input id="'+id+'" type="'+type+'" autocomplete="'+ac+'" placeholder="'+e(tx(ph))+'"'+(v!=null?' value="'+e(v)+'"':'')+'>', box=h=>'<div class="box">'+h+'</div>';
  const step=s.step; let h='';
  if(step==='title')h='<div class="box title"><h1 class="logo">'+e(tx('name')).replace(/^(the)\s+(strangest)\s+/i,'$1<br>$2<br>')+'</h1>'+
    ('<input id="dcode" type="text" maxlength="32" autocomplete="off" spellcheck="false" placeholder="'+e(tx('code.ph'))+'"'+(s.code?' value="'+e(s.code)+'"':'')+'>'+
    '<div>'+b('docode','code.go','on')+'</div>'+err+'<div>'+b('ask','ask','link')+'</div><div>'+b('login','have','link')+'</div>'+(/Electron/.test(navigator.userAgent)?'':'<div><a class="link" href="/download/windows" download>'+e(tx('win'))+'</a></div>'))+'</div>';
  else if(step==='ask')h=box('<h2>'+e(tx('ask.title'))+'</h2><div class="k">'+e(tx('ask.body'))+'</div>'+inp('dmail','email','email','email',s.email)+'<div>'+b('doask','ask.go','on')+'</div>'+err+'<div>'+b('home','back','link')+'</div>');
  else if(step==='asked')h=box('<div class="k">'+e(tx('ask.sent',{email:s.email}))+'</div><div>'+b('home','back','link')+'</div>');
  else if(step==='opening')h=box('<div class="k blink">'+e(tx('opening'))+'</div>');
  else if(step==='nocode')h=box('<h2>'+e(tx('code.title'))+'</h2><div class="k">'+e(tx('nocode.body'))+'</div><input id="dcode" type="text" maxlength="32" autocomplete="off" placeholder="'+e(tx('code.ph'))+'"'+(s.code?' value="'+e(s.code)+'"':'')+'>'+
    '<div>'+b('dojoin','code.go','on')+'</div>'+err+'<div>'+b('out','back','link')+'</div>');
  else if(step==='make')h=box('<h2>'+e(tx('make.ok'))+'</h2><div class="k">'+e(tx('make.body'))+'</div>'+inp('dmail','email','email','email',s.email)+inp('dpw','password','password','new-password')+inp('dpw2','password','password2','new-password')+
    '<div>'+b('domake','make.go','on')+'</div>'+err+'<div>'+b('home','back','link')+'</div>');
  else if(step==='login')h=box('<h2>'+e(tx('login.title'))+'</h2>'+inp('dmail','email','email','email',s.email)+inp('dpw','password','password','current-password')+'<div>'+b('dologin','login','on')+'</div>'+err+
    '<div>'+b('forgot','login.forgot','link')+b('link','login.link','link')+'</div><div>'+b('home','back','link')+'</div>');
  else if(step==='forgot')h=box('<h2>'+e(tx('forgot.title'))+'</h2><div class="k">'+e(tx('forgot.body'))+'</div>'+inp('dmail','email','email','email',s.email)+'<div>'+b('doforgot','forgot.go','on')+'</div>'+err+'<div>'+b('login','back','link')+'</div>');
  else if(step==='link')h=box('<h2>'+e(tx('link.title'))+'</h2>'+inp('dmail','email','email','email',s.email)+'<div>'+b('dolink','link.go','on')+'</div>'+err+'<div>'+b('login','back','link')+'</div>');
  else if(step==='sent'||step==='linksent')h=box('<div class="k">'+e(tx(step==='sent'?'forgot.sent':'link.sent',{email:s.email}))+'</div><div class="k blink">'+e(tx('wait'))+'</div>'+err+'<div>'+b('login','back','link')+'</div>');
  else if(step==='newpass')h=box('<h2>'+e(tx('newpass.title'))+'</h2>'+inp('dpw','password','password','new-password')+inp('dpw2','password','password2','new-password')+'<div>'+b('donewpass','newpass.go','on')+'</div>'+err);
  el.innerHTML=h;
  const f=el.querySelector('input'); if(f&&!f.value)f.focus({preventScroll:true});
  el.querySelectorAll('input').forEach(i=>i.onkeydown=ev=>{ if(ev.key==='Enter'){ const go=el.querySelector('button.on'); if(go)go.click(); } });
  const on=(a,fn)=>el.querySelectorAll('[data-a="'+a+'"]').forEach(x=>x.onclick=async()=>{ if(s.busy)return; s.busy=true; s.err=''; try{ await fn(); }catch(er){ s.err=er.message||String(er); } s.busy=false; draw(); });
  const val=id=>{ const x=el.querySelector('#'+id); return x?x.value:''; }, mail=()=>{ const m=val('dmail').trim(); if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m))throw new Error(tx('bademail')); s.email=m; return m; };
  const pw2=()=>{ const a=val('dpw'), c=val('dpw2'); if(a.length<8)throw new Error(tx('short')); if(a!==c)throw new Error(tx('match')); return a; };
  const back=location.origin+'/';
  on('login',async()=>{ const c=await sb(), {data}=await c.auth.getSession(); if(data&&data.session)return enter(); s.step='login'; });
  on('home',()=>{ s.step='title'; });
  on('ask',()=>{ s.step='ask'; });
  on('doask',async()=>{ const m=mail(), j=await post('/ask',{email:m}); if(!j.ok)throw new Error(j.why==='email'?tx('bademail'):j.why); s.step='asked'; });
  on('forgot',()=>{ s.step='forgot'; }); on('link',()=>{ s.step='link'; });
  on('docode',async()=>{ const c=val('dcode').trim().toUpperCase(); s.code=c; const j=await post('/join/check',{code:c}); if(!j.ok)throw new Error(j.why==='code'?tx('code.bad'):j.why); s.step='make'; });
  on('domake',async()=>{ const m=mail(), pw=pw2(), j=await post('/join',{code:s.code,email:m,password:pw});
    if(!j.ok){ if(j.why==='code'){ s.step='title'; throw new Error(tx('code.bad')); } throw new Error(j.why==='exists'?tx('make.exists'):j.why==='short'?tx('short'):j.why==='email'?tx('bademail'):j.why); }
    const {error}=await (await sb()).auth.setSession({access_token:j.access_token,refresh_token:j.refresh_token}); if(error)throw error; await enter(); });
  on('dojoin',async()=>{ const c=await sb(), {error}=await c.rpc('join_beta',{invite:val('dcode').trim()}); if(error)throw new Error(/invite/.test(error.message)?tx('code.bad'):error.message); await enter(); });
  on('out',async()=>{ await (await sb()).auth.signOut(); s.step='title'; });
  on('dologin',async()=>{ const m=mail(), {error}=await (await sb()).auth.signInWithPassword({email:m,password:val('dpw')}); if(error)throw new Error(/invalid login/i.test(error.message)?tx('login.bad'):error.message); await enter(); });
  on('doforgot',async()=>{ const m=mail(), {error}=await (await sb()).auth.resetPasswordForEmail(m,{redirectTo:back}); if(error)throw error; s.step='sent'; });
  on('dolink',async()=>{ const m=mail(), {error}=await (await sb()).auth.signInWithOtp({email:m,options:{emailRedirectTo:back,shouldCreateUser:false}}); if(error)throw error; s.step='linksent'; });
  on('donewpass',async()=>{ const pw=pw2(), {error}=await (await sb()).auth.updateUser({password:pw}); if(error)throw error; recovery=false; await enter(); }); }

draw();
if(/[?&]code=/.test(location.search))sb().then(async c=>{ const {data}=await c.auth.getSession(); history.replaceState(null,'',location.pathname);
  if(!(data&&data.session))return; if(recovery){ S.step='newpass'; draw(); return; } await enter(); draw(); }).catch(e=>{ S.err=e.message||String(e); draw(); });
</script></body></html>
