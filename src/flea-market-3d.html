function limbFrame(a,b,ref,alt){ const y=nrm(sub(b,a)); let z=cross(ref,y); if(len(z)<0.2) z=cross(alt,y); z=nrm(z); return {o:a,x:cross(y,z),y,z}; }   // (round pieces: any turn about their own length will do)
function frameOf(n,B){ const {J,m}=B,side=n.charAt(n.length-1);
  if(/^(head|hair|beard|ear)/.test(n)) return FR(B.head||J.head,m.Rh);
  if(n=='neck'||n=='torso') return FR(J.chest,m.Rc);
  if(n=='hips') return FR(J.pelvis,m.Rp);
  if(/^(sleeve|upperArm)/.test(n)) return limbFrame(J['shoulder'+side],J['elbow'+side],m.Ru.x,m.Ru.z);
  if(/^forearm/.test(n)) return limbFrame(J['elbow'+side],J['wrist'+side],m.Ru.x,m.Ru.z);
  if(/^hand/.test(n)) return m.hf[side];
  if(/^fing/.test(n)){ const i=n.charAt(4),j=+n.charAt(5); return limbFrame(J['k'+i+j+side],J['k'+i+(j+1)+side],m.Ru.x,m.Ru.z); }
  if(/^thigh/.test(n)) return limbFrame(J['hip'+side],J['knee'+side],m.Rb.x,m.Rb.z);
  if(/^shin/.test(n)) return limbFrame(J['knee'+side],J['ankle'+side],m.Rb.x,m.Rb.z);
  return FR(J['ankle'+side],m.foot[side]); }   // a shoe

// ---- the floor: nothing of him goes through it. Each listed joint, at its piece's thickness, lifts him if it's below the floor; then
// the whole of him in whole pixels (rounding up: a pixel off the floor, never into it). A toe may bend into its shoe's last half pixel, as at push-off.
// In a move (drop), what rounding up lifted him by comes off again when it's under a pixel, so his feet on the floor stay on it, not hovering
const FLOOR=[['head',8.6],   // (the head with its hair: rolling, the back of his head on the floor, not through it)
  ['headTop',1],['chest',5.4],['spine',5.2],['pelvis',4.4],['neck',2.3]];
for(const n of 'LR') FLOOR.push(['shoulder'+n,2.4],['elbow'+n,2.0],['wrist'+n,1.7],['palm'+n,1.6],['knee'+n,3.0],['ankle'+n,2.6],['heel'+n,0],['ball'+n,0],['toe'+n,-0.6],['fingers'+n,0.4]);   // (and each fingertip, below)
for(const n of 'LR') for(let i=0;i<5;i++) if(i!=2) FLOOR.push(['k'+i+'3'+n,0.3]);
function settle(B,fl,drop){ fl=fl||0; let lift=0; for(const [k,r] of FLOOR) if(B.J[k]) lift=Math.max(lift,r-(B.J[k].y-fl));   // (FAR: no fingertips to keep off the floor)
  const y=B.J.pelvis.y+lift-fl; let dy=STAND+Math.ceil((y-STAND)/PX-0.05)*PX-y+lift;
  if(drop){ let g=1e9; for(const [k,r] of FLOOR) if(B.J[k]) g=Math.min(g,B.J[k].y+dy-r-fl); if(g>0&&g<PX) dy-=g; }
  if(dy){ for(const k in B.J) B.J[k]=add(B.J[k],V(0,dy,0)); if(B.m&&B.m.hf) for(const s in B.m.hf) B.m.hf[s]={...B.m.hf[s],o:add(B.m.hf[s].o,V(0,dy,0))}; } return B; }   // (the hands' own frames go up with him too: left behind, a roll's hands hung 16 below his wrists, owner 15 Oct 2026 "double check each part")

// ---- clipping: walking, the arms lean out (searched by halves) just as far as they must so no point down the arm, at its piece's
// thickness, is inside the shirt, the hips or a thigh; the moves are posed to keep clear, and a check counts anything that isn't
function armPoints(J,n){ const E=J['elbow'+n],W=J['wrist'+n];
  return [[E,2.4],[add(E,mul(sub(W,E),0.5)),2.28],[W,2.1],[J['palm'+n],1.2],[J['fingers'+n],0.4]]; }   // (the hand: its palm, the middle finger's tip)
function clearArms(st,dev){ const abd={L:0,R:0};
  const clips=(n,a)=>{ abd[n]=a; LITE=true; const B=build(walkPose(st,abd),dev); LITE=false; for(const [p,r] of armPoints(B.J,n)) for(const k of ['torso','hips','thighL','thighR']) if(pieceD(k,B,p)<r+0.05) return true; return false; };
  for(const n of 'LR'){ let lo=0,hi=40*D; if(!clips(n,0)){ abd[n]=0; continue; }
    for(let i=0;i<(FAR?6:9);i++){ const a=(lo+hi)/2; if(clips(n,a)) lo=a; else hi=a; } abd[n]=hi; }
  return abd; }
// any pose at all (a move, or one blending into another): an arm that would pass through the body leans out until it doesn't
const ARMBODY=['torso','hips','thighL','thighR'];
function armClips(B,n){ for(const [p,r] of armPoints(B.J,n)) for(const k of ARMBODY) if(pieceD(k,B,p)<r+0.02) return true; return false; }
function clearPose(P,dev){ let B=build(P,dev);
  for(const n of 'LR'){ if(!armClips(B,n)) continue; const b0=[P[n].ua[1],P[n].fa[1]],sgn=1; let lo=0,hi=45*D;
    const at=(e,lite)=>{ P[n].ua[1]=b0[0]+e; P[n].fa[1]=b0[1]+e; LITE=!!lite; const b=build(P,dev); LITE=false; return b; };
    for(let i=0;i<(FAR?6:8);i++){ const e=(lo+hi)/2; if(armClips(at(e,true),n)) lo=e; else hi=e; } B=at(hi); }
  return B; }
// (standing, he is upright and his pieces are where the plain shapes put them: the arms cleared against those, for the rest pose)
function clearUpright(){ const st={ph:0,w:0},abd={L:0,R:0},body=bodyPieces(build(walkPose(st,null),null).J);
  const clips=(n,a)=>{ abd[n]=a; const {J}=build(walkPose(st,abd),null); for(const [p,r] of armPoints(J,n)) for(const b of body) if(b.d(p)<r+0.05) return true; return false; };
  for(const n of 'LR'){ let lo=0,hi=40*D; if(!clips(n,0)){ abd[n]=0; continue; } for(let i=0;i<9;i++){ const a=(lo+hi)/2; if(clips(n,a)) lo=a; else hi=a; } abd[n]=hi; }
  return abd; }
// any piece's true shape wherever it is: the point taken back into its frame and measured against the piece standing
let REST=null; const restOf=()=>REST||(REST=(()=>{ const B=build(walkPose({ph:0,w:0},clearUpright()),null),d={}; for(const p of shell(B.J)) d[p.n]=p.d; return {B,d}; })());
function pieceD(n,B,p){ const R=restOf(),F=frameOf(n,B),Fr=frameOf(n,R.B),l=sub(p,F.o); return R.d[n](add(Fr.o,add(add(mul(Fr.x,dot(l,F.x)),mul(Fr.y,dot(l,F.y))),mul(Fr.z,dot(l,F.z))))); }
// pieces passing through each other this frame (should stay 0): the arms against the body and the head, each leg against the other, the knees against the shirt
function overlaps(B,why){ const {J}=B; let n=0,worst=0;
  const test=(p,r,names,what)=>{ for(const k of names){ const d=pieceD(k,B,p)-r; if(d<0){ n++; worst=Math.min(worst,d); if(why) why.push(what+'>'+k+' '+d.toFixed(2)); } } };
  for(const s of 'LR'){ armPoints(J,s).forEach(([p,r],i)=>test(p,r,['torso','hips','thighL','thighR','head','beard'],'arm'+s+i));
    const o=s=='L'?'R':'L',K=J['knee'+s],A=J['ankle'+s];
    for(const [p,r,w] of [[K,3.0,'knee'],[add(K,mul(sub(A,K),0.5)),2.8,'shin'],[A,2.6,'ankle']]) test(p,r,['thigh'+o,'shin'+o,'shoe'+o],w+s);
    test(K,3.0,['torso'],'knee'+s); }
  return {n,worst}; }

  for(const [k,r] of [['wristL',.09],['wristR',.09],['ballL',.1],['ballR',.1]]){ const a=B.J[k], b=J0[k]; if(!a||!b)continue; const p=ragW(a,hd), v=v3k(v3s(p,ragW(b,hd)),1/dt), sp=Math.hypot(...v3s(v,PHYOU.vel)); if(sp>1.5&&sp<12)S.push({p,r,v}); }   // (fast against his own walk: a swinging arm isn't a punch)
  PHYOU.strikes=S; }
// the heap to the pose: each joint of the move's pose eased from where the heap left it (for the host's picture, 47-you-jointed)
function ragBlend(B){ const b=RAG.blend; if(!b)return; const k=(performance.now()-b.t)/350; if(k>=1){ RAG.blend=null; return; } const w=k*k*(3-2*k);
  for(const n in B.J)if(b.J0[n]){ const a=b.J0[n], c=B.J[n]; B.J[n]=RIG.V(a.x+(c.x-a.x)*w,a.y+(c.y-a.y)*w,a.z+(c.z-a.z)*w); } B.head=B.J.head; }
STATIC=fixed.map(([x0,z0,y0,x1,z1,y1])=>[x0/TL,-z1/TL,y0/TL,x1/TL,-z0/TL,y1/TL]); PHYROOMS=[{on:true,x0:-1e9,x1:1e9,y0:-1e9,y1:1e9,st:STATIC.map(b=>[b[0],b[1],b[2]/RZ,b[3],b[4],b[5]/RZ])}];

// ---- loose things: crates (some stacked), barrels, cardboard boxes and balls, bodies of the engine drawn as boxes in the scene ----
const loose=[]; const CM=new THREE.Matrix3().set(1,0,0,0,0,1,0,-1,0), CMT=CM.clone().transpose(), m3t=new THREE.Matrix3(), m4t=new THREE.Matrix4();
function body(o,mat,x,z,y=0){ const b=phyBody({...o,at:[x/TL,-z/TL,y/TL]}), g=new THREE.Group(); g.matrixAutoUpdate=false; scene.add(g);
  for(const p of b.parts){ let geo; if(p.t==='box'){ geo=new THREE.BoxGeometry(2*p.h[0]*TL,2*p.h[2]*TL,2*p.h[1]*TL); worldUV(geo,4); } else if(p.t==='cyl')geo=new THREE.CylinderGeometry(p.r*TL,p.r*TL,2*p.hh*TL,8); else geo=new THREE.IcosahedronGeometry(p.r*TL,1);
    const me=new THREE.Mesh(geo,mat); me.position.set(p.c[0]*TL,p.c[2]*TL,-p.c[1]*TL); me.castShadow=me.receiveShadow=true; g.add(me); }
  b.g=g; loose.push(b); return b; }
function looseDraw(){ for(const b of loose){ const m=b.m3; m3t.set(m[0],m[1],m[2],m[3],m[4],m[5],m[6],m[7],m[8]).premultiply(CM).multiply(CMT);
  m4t.setFromMatrix3(m3t).setPosition(b.x[0]*TL,b.x[2]*TL,-b.x[1]*TL); b.g.matrix.copy(m4t); b.g.matrixWorldNeedsUpdate=true; } }
const crate=(x,z,s,y=0)=>body({parts:[{t:'box',c:[0,0,s/2/TL],h:[s/2/TL,s/2/TL,s/2/TL]}],m:s*16,mu:.6,e:.1},M(0x9c7a52,woodT),x,z,y);
const carton=(x,z,w,h,y=0)=>body({parts:[{t:'box',c:[0,0,h/2/TL],h:[w/2/TL,w*.35/TL,h/2/TL]}],m:1.5,mu:.5,e:.15},M(0xc49a64),x,z,y);
for(const [x,z] of [[6.2,14],[6.9,14],[7.6,14]])crate(x,z,0.6); crate(6.55,14,0.6,0.6); crate(7.25,14,0.6,0.6); crate(6.9,14,0.6,1.2);   // a stack to knock over
crate(-13.6,13.6,0.6); crate(-13,14.3,0.5); crate(13.4,14,0.6); crate(-0.2,7.6,0.5);
for(const [x,z] of [[-14,21.5],[0.4,15.6],[14.2,21.2]])body({parts:[{t:'cyl',c:[0,0,0.45/TL],r:0.32/TL,hh:0.45/TL}],m:14,mu:.6,e:.1},M(0x7a5236,woodT),x,z);
for(const [x,z] of [[-6.5,13.2],[-5.9,13.5],[-6.2,13.1]])carton(x,z,0.5,0.35); carton(-6.2,13.3,0.45,0.3,0.35);
for(const [x,z,c] of [[2.2,12.6,0xc8553d],[-2.4,15.2,0x35507a],[1.5,16.4,0xd9b54a]])body({parts:[{t:'ball',c:[0,0,0.2/TL],r:0.2/TL}],m:0.45,mu:.5,e:.6},M(c,null,{flatShading:true}),x,z);
looseDraw();
let looseAcc=0, J0=null, J0t=0, trip=false;

// ---- input: keys relative to the screen, click to walk; the view turns and tilts to any angle and zooms to any size ----
const keys=new Set(); let target=null;
const VIEW0={yaw:Math.PI/4,pitch:Math.PI/6,ppu:PPU}; let yaw=VIEW0.yaw, pitch=VIEW0.pitch, yawTo=yaw, pitchTo=pitch, ppuTo=ppu;
const PMIN=0.02, PMAX=Math.PI/2-0.002, clampP=v=>Math.max(PMIN,Math.min(PMAX,v));
renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());
let drag=null;
renderer.domElement.addEventListener('pointerdown',e=>{ if(e.button===2||e.button===1){ drag={x:e.clientX,y:e.clientY}; renderer.domElement.setPointerCapture(e.pointerId); } });
renderer.domElement.addEventListener('pointermove',e=>{ if(!drag)return; yawTo-=(e.clientX-drag.x)*0.008; pitchTo=clampP(pitchTo+(e.clientY-drag.y)*0.006); drag={x:e.clientX,y:e.clientY}; });
renderer.domElement.addEventListener('pointerup',()=>drag=null);
renderer.domElement.addEventListener('wheel',e=>{ e.preventDefault(); ppuTo=Math.max(3,Math.min(240,ppuTo*Math.pow(1.0015,-e.deltaY))); },{passive:false});
addEventListener('keydown',e=>{ const k=e.key.toLowerCase(); keys.add(k); if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
  if(k==='0'){ yawTo=VIEW0.yaw; pitchTo=VIEW0.pitch; ppuTo=VIEW0.ppu; } if(k==='n')nightTo=nightTo?0:1; if(k==='h')document.getElementById('hud').hidden^=1;
  if(k==='-'||k==='_'){PXS=Math.min(12,PXS+1);resize();} if(k==='='||k==='+'){PXS=Math.max(1,PXS-1);resize();}
  if(k==='shift')st.runTarget=1; if(k==='f'&&!e.repeat)trip=true; if(MOVEK[k]&&!e.repeat&&!RAG.on)RIG.act(st,MOVEK[k]); });   // his moves, the rig's own (12-walker-rig-2)
const MOVEK={' ':' ',j:'J',k:'K',r:'R',v:'V'};
addEventListener('keyup',e=>{ const k=e.key.toLowerCase(); keys.delete(k); if(k==='shift')st.runTarget=0; if(MOVEK[k])RIG.release(st,MOVEK[k]); });
addEventListener('blur',()=>{ keys.clear(); st.runTarget=0; });
const ray=new THREE.Raycaster(), gplane=new THREE.Plane(new THREE.Vector3(0,1,0),0), hit=new THREE.Vector3();
renderer.domElement.addEventListener('pointerdown',e=>{ if(e.button!==0)return; const r=renderer.domElement.getBoundingClientRect();
  ray.setFromCamera(new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height*2-1)),cam);
  if(ray.ray.intersectPlane(gplane,hit))target=hit.clone(); });
const marker=new THREE.Mesh(new THREE.PlaneGeometry(0.5,0.5).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0xf2c14e,transparent:true,opacity:0.8})); marker.visible=false; scene.add(marker);

function collide(p){ const r=0.3; p.x=Math.max(BOUND.x0,Math.min(BOUND.x1,p.x)); p.z=Math.max(BOUND.z0,Math.min(BOUND.z1,p.z));
  for(const [x0,z0,x1,z1] of solids){ const cx=Math.max(x0,Math.min(x1,p.x)), cz=Math.max(z0,Math.min(z1,p.z)), dx=p.x-cx, dz=p.z-cz, d2=dx*dx+dz*dz;
    if(d2>=r*r)continue; if(d2>1e-8){ const d=Math.sqrt(d2); p.x=cx+dx/d*r; p.z=cz+dz/d*r; }
    else { const o=[p.x-x0+r,x1-p.x+r,p.z-z0+r,z1-p.z+r], m=Math.min(...o); if(m===o[0])p.x=x0-r; else if(m===o[1])p.x=x1+r; else if(m===o[2])p.z=z0-r; else p.z=z1+r; } } }

// ---- the loop: move, animate, then the camera follows him ----
const R=new THREE.Vector3(),U=new THREE.Vector3(),F=new THREE.Vector3(),disp=new THREE.Vector3();
let last=performance.now(), fpsT=0, fpsN=0, t=0;
function frame(now){ requestAnimationFrame(frame); const dt=Math.min(0.05,(now-last)/1000); last=now; t+=dt;
  if(keys.has('q'))yawTo+=dt*1.8; if(keys.has('e'))yawTo-=dt*1.8; if(keys.has('z'))pitchTo=clampP(pitchTo-dt*1.2); if(keys.has('x'))pitchTo=clampP(pitchTo+dt*1.2);
  const ease=Math.min(1,dt*12); yaw+=(yawTo-yaw)*ease; pitch+=(pitchTo-pitch)*ease; ppu*=Math.pow(ppuTo/ppu,ease); frustum();
  const a=yaw, fx=-Math.sin(a), fz=-Math.cos(a);            // screen-up on the ground, and screen-right
  let mx=0,mz=0, up=keys.has('w')||keys.has('arrowup'), dn=keys.has('s')||keys.has('arrowdown'), lf=keys.has('a')||keys.has('arrowleft'), rt=keys.has('d')||keys.has('arrowright');
  if(up){mx+=fx;mz+=fz;} if(dn){mx-=fx;mz-=fz;} if(rt){mx+=-fz;mz+=fx;} if(lf){mx-=-fz;mz-=fx;}
  if(mx||mz)target=null; else if(target){ const dx=target.x-pos.x, dz=target.z-pos.z, d=Math.hypot(dx,dz); if(d<0.12)target=null; else {mx=dx/d;mz=dz/d;} }
  view0.a=a; P.x=pos.x/TL; P.y=-pos.z/TL; PH.hd=heading;
  // down: F trips him, or something heavy flying into him knocks him down (the game's trigger and shoves, 47-you-jointed)
  const hit=PHYOU.hit||0, hn=PHYOU.hitN; PHYOU.hit=0;
  if(!RAG.on&&(trip||hit>12)){ const [u,v]=[(Math.sin(PH.hd)+Math.cos(PH.hd))/2,(Math.cos(PH.hd)-Math.sin(PH.hd))/2], [fx2,fy2]=wvV(u,v), n=Math.hypot(fx2,fy2), k=Math.min(3,hit/30);
    ragStart(RIG.pose(st,false),J0,J0t?(now-J0t)/1000:0,trip||!hn?[fx2/n*1.6,fy2/n*1.6,.3]:[-hn[0]*k,-hn[1]*k,.2]); target=null; }
  trip=false; let B;
  if(RAG.on){ ragStep(dt); st.target=0; pos.x=P.x*TL; pos.z=-P.y*TL; py=0; if(!RAG.on){ heading=PH.hd; pos.x=P.x*TL; pos.z=-P.y*TL; } }
  if(RAG.on)B=ragPose();
  else{
    // as the game walks him: he turns toward where you steer (half a turn in a third of a second) and goes the way he faces, as far as his feet carried him
    const ml=Math.hypot(mx,mz), busy=st.move;
    if(ml>0&&!busy){ let dh=Math.atan2(mx,mz)-heading; dh=Math.atan2(Math.sin(dh),Math.cos(dh)); const turn=3*Math.PI*dt; heading+=Math.max(-turn,Math.min(turn,dh)); }
    st.target=ml>0?1:0; const before=st.dist; RIG.step(st,dt); const go=(st.dist-before)/PPU; if(typeof SFX!=='undefined')SFX.steps(st,go);   // (his units are art pixels across; a footfall each step: src/sfx.js)
    if(go){ const ox=pos.x,oz=pos.z; pos.x+=Math.sin(heading)*go; pos.z+=Math.cos(heading)*go; collide(pos); if(target&&Math.hypot(pos.x-ox,pos.z-oz)<go*0.2)target=null; }
    py+=(groundY(pos.x,pos.z)-py)*Math.min(1,dt*20); P.x=pos.x/TL; P.y=-pos.z/TL; PH.hd=heading;
    B=RIG.pose(st); ragBlend(B); ragStrikes(B,J0,J0t?(now-J0t)/1000:0); J0=B.J; J0t=now; }
  // his picture, drawn by the rig at his heading as the camera sees it, onto the card that faces the camera
  const hdA=(RAG.on?RAG.hd:heading)-a;
  RIG.viewPitch(null); RIG.draw(B,cloud,hdA,uimg,PW,PICH,AX,AY,1,false);                  // upright, as the game draws him: his body for the physics
  RIG.viewPitch(pitch); RIG.draw(B,cloud,hdA,pimg,PW,PICH,AX,AY,1,false); RIG.viewPitch(null);   // as the camera sees him, at its tilt
  new Uint32Array(pdata.data.buffer).set(pimg); pg.putImageData(pdata,0,0); ptex.needsUpdate=true;
  // the loose things, at the engine's 120 steps a second; your figure and your fists and feet push them (47-physics-1)
  phyYouNow(dt); looseAcc+=dt; let nst=0; while(looseAcc>=PHH&&nst<6){ looseAcc-=PHH; nst++; phyStep(loose,STATIC,PHH,null,null); } if(nst>=6)looseAcc=0; looseDraw();
  let lampW=0; for(const L of lamps){ const d=Math.hypot(L.position.x-pos.x,L.position.z-pos.z); lampW=Math.max(lampW,1-d/7); }
  youMat.color.setRGB(1,1,1).lerp(C1.setHex(0x6c7699),night).lerp(C2.setHex(0xffd9a0),Math.max(0,lampW)*night*0.8);   // the night and the lamps on his picture
  marker.visible=!!target; if(target){ marker.position.set(target.x,groundY(target.x,target.z)+0.03,target.z); marker.material.opacity=0.5+0.4*Math.sin(t*8); }
  // seen from behind the shops (looking across the street at the market), the buildings cut down to a stub so they never hide the walker
  const cut=Math.cos(a)<0?0.14:1; for(const sg of shopGroups)sg.scale.y+=(cut-sg.scale.y)*Math.min(1,dt*8);
  for(const tr of trees){ tr.crown.rotation.z=Math.sin(t*1.3+tr.ph)*0.035+Math.sin(t*3.1+tr.ph)*0.01; tr.crown.rotation.x=Math.sin(t*1.1+tr.ph*1.7)*0.025; }
  if(night!==nightTo){ night+=(nightTo-night)*Math.min(1,dt*2.5); if(Math.abs(nightTo-night)<0.002)night=nightTo; applyTime(night); }
  // the camera: around him at this turn and tilt, looking at him; his card faces it, a little toward it so the ground never cuts his feet
  disp.set(pos.x,py,pos.z); F.set(Math.sin(a)*Math.cos(pitch),Math.sin(pitch),Math.cos(a)*Math.cos(pitch));
  cam.position.copy(disp).addScaledVector(F,300); cam.lookAt(disp); cam.updateMatrixWorld();
  you.quaternion.copy(cam.quaternion); you.position.copy(disp).addScaledVector(F,0.35);
  renderer.render(scene,cam);
  fpsN++; fpsT+=dt; if(fpsT>0.5){ statEl.textContent=`${Math.round(fpsN/fpsT)} fps · ${RW}×${RH} px · turn ${Math.round(((a*180/Math.PI)%360+360)%360)}° · tilt ${Math.round(pitch*180/Math.PI)}° · zoom ${(ppu/PPU).toFixed(2)}×`; fpsN=0; fpsT=0; }
}
resize(); applyTime(0); requestAnimationFrame(frame);
</script>
