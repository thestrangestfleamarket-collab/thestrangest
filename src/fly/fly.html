<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<title>Sky Aces</title>
<style>
  :root { --bg: #0b1016; --panel: rgba(13, 19, 27, 0.9); --line: #2a3848; --ink: #e8eef4; --dim: #8fa1b3; --acc: #ffb648; --acc2: #4fc3ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #menu { position: fixed; inset: 0; display: flex; flex-direction: column; background: linear-gradient(180deg, rgba(6, 10, 15, 0.55), rgba(6, 10, 15, 0.9)); overflow-y: auto; padding: 22px clamp(14px, 4vw, 48px) 28px; }
  #menu h1 { margin: 0; font-size: clamp(26px, 4vw, 44px); letter-spacing: 0.06em; font-weight: 800; } #menu h1 span { color: var(--acc); }
  #menu .sub { color: var(--dim); margin: 2px 0 16px; }
  .cols { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(280px, 1fr); gap: 20px; align-items: start; }
  @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
  .era { margin: 0 0 12px; } .era h2 { font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--acc2); margin: 0 0 6px; font-weight: 700; }
  .planes { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
  .plane { text-align: left; background: var(--panel); border: 1px solid var(--line); color: var(--ink); border-radius: 8px; padding: 9px 11px; cursor: pointer; font: inherit; }
  .plane:hover { border-color: var(--acc2); } .plane.sel { border-color: var(--acc); box-shadow: 0 0 0 1px var(--acc) inset; }
  .plane b { display: block; font-size: 14px; } .plane small { color: var(--dim); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
  .card h3 { margin: 0 0 8px; font-size: 16px; } .stats { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; color: var(--dim); font-size: 13.5px; } .stats b { color: var(--ink); font-weight: 600; }
  label.opt { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 6px 0; color: var(--dim); }
  select { background: #0d141c; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font: inherit; }
  .go { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  button.big { flex: 1; min-width: 130px; padding: 13px 14px; font: inherit; font-weight: 700; font-size: 16px; border-radius: 8px; border: 0; cursor: pointer; background: var(--acc); color: #1a1205; }
  button.big.vr { background: var(--acc2); color: #04131c; } button.big:disabled { opacity: 0.45; cursor: default; }
  #status { color: var(--dim); font-size: 13px; margin-top: 8px; min-height: 1.4em; }
  #help { position: fixed; left: 12px; bottom: 12px; background: rgba(8, 12, 17, 0.78); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; font-size: 12.5px; color: #c6d2dd; max-width: 430px; display: none; pointer-events: none; }
  #help b { color: var(--acc); } #help table { border-collapse: collapse; } #help td { padding: 0 10px 0 0; vertical-align: top; }
  #tip { position: fixed; pointer-events: none; background: rgba(8, 12, 17, 0.9); border: 1px solid var(--acc); color: var(--ink); padding: 3px 8px; border-radius: 5px; font-size: 13px; display: none; }
  #osd { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); color: #fff; font-weight: 700; text-shadow: 0 1px 4px #000; font-size: 18px; pointer-events: none; text-align: center; white-space: pre-line; }
  #bar { position: fixed; right: 12px; bottom: 12px; color: #dfe8ef; font: 13px ui-monospace, Menlo, monospace; text-shadow: 0 1px 3px #000; pointer-events: none; text-align: right; white-space: pre; }
  details { color: var(--dim); font-size: 13px; } details summary { cursor: pointer; color: var(--ink); }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="osd"></div><div id="bar"></div><div id="tip"></div>
<div id="help"></div>
<div id="menu">
  <h1>SKY <span>ACES</span></h1>
  <div class="sub">Dogfights from 1917 to today — desktop or Quest 3 in the browser (WebXR)</div>
  <div class="cols">
    <div id="list"></div>
    <div>
      <div class="card"><h3 id="pname">—</h3><div class="stats" id="pstats"></div></div>
      <div class="card">
        <label class="opt">Time of day <select id="oTime"><option value="day">Midday</option><option value="golden">Golden hour</option><option value="dusk">Dusk</option><option value="night">Moonlit night</option></select></label>
        <label class="opt">Enemies <select id="oEnemies"><option>0</option><option>1</option><option selected>2</option><option>3</option><option>4</option><option>6</option></select></label>
        <label class="opt">Wingmen <select id="oWing"><option selected>0</option><option>1</option><option>2</option><option>3</option></select></label>
        <label class="opt">Enemy skill <select id="oSkill"><option value="0.3">Rookie</option><option value="0.6" selected>Veteran</option><option value="0.95">Ace</option></select></label>
        <label class="opt">Start <select id="oStart"><option value="air">In the air</option><option value="runway">On the runway</option></select></label>
        <label class="opt">Target markers <select id="oMarkers"><option value="1">On</option><option value="0">Off (realistic)</option></select></label>
        <label class="opt">Detail <select id="oQuality"><option value="1">High</option><option value="0.6">Balanced (Quest)</option></select></label>
        <div class="go"><button class="big" id="fly" disabled>Fly</button><button class="big vr" id="vr" disabled>Enter VR</button></div>
        <div id="status">Loading world…</div>
      </div>
      <details><summary>Controls</summary><div id="helpInline"></div></details>
    </div>
  </div>
</div>
<script type="module">__FLY__</script>
</body>
</html>
