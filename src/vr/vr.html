<!doctype html><html lang=en><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><title>VR Games · The Strangest Flea Market</title><link rel=icon href="data:,"><meta name=theme-color content=#0e1016>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap">
<style>
*{box-sizing:border-box}
html{background:#0e1016;color:#e8e4d8;font:17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
body{margin:0;padding:28px 16px 60px}
header,main{max-width:1180px;margin:0 auto}
header{padding:0 0 22px;border-bottom:1px solid #2a2e3a;margin-bottom:26px}
header p{margin:0;color:#8f93a3}
.by{font:12px Silkscreen,ui-monospace,monospace;letter-spacing:.12em;color:#f2b84b;margin:0 0 6px}
h1{font:32px/1.1 Silkscreen,ui-monospace,monospace;margin:0 0 10px;letter-spacing:.02em;text-wrap:balance}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:22px}
article{background:#171a23;border:1px solid #2a2e3a;border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
article img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;background:#07080b}
.in{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.kind{font:11px Silkscreen,ui-monospace,monospace;letter-spacing:.12em;color:#f2b84b;text-transform:uppercase}
h2{font:21px/1.15 Silkscreen,ui-monospace,monospace;margin:0;text-wrap:balance}
article p{margin:0;color:#b9bccb;font-size:15px;flex:1}
ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
li{font:10px Silkscreen,ui-monospace,monospace;letter-spacing:.08em;color:#9aa0b4;border:1px solid #343949;border-radius:4px;padding:3px 7px}
.go{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:4px}
.go a{font:15px Silkscreen,ui-monospace,monospace;color:#0e1016;background:#f2b84b;text-decoration:none;padding:11px 22px;border-radius:6px;min-height:44px}
.go a:hover,.go a:focus-visible{background:#ffd27a;outline:0}
.go a:focus-visible{box-shadow:0 0 0 3px #0e1016,0 0 0 5px #ffd27a}
.go span{font:13px ui-monospace,Menlo,monospace;color:#6f7487;overflow-wrap:anywhere;text-align:right}
@media(max-width:480px){h1{font-size:24px}}
</style></head><body>
